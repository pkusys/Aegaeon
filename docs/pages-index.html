          "text": "Python API ¶ LLMService , NodeConfig , and Request provide direct inference from token IDs. The YAML file supplies model and device metadata; NodeConfig defines each node's engines, caches, and initially cached models. The example uses the Simple-mode configuration , with paths and profiles adapted to the host. Its relative config_path assumes a repository-root working directory; an installed-wheel application can use an absolute path to its own copy. The Ray runtime must already expose the node_0 resource described in Deployment . Example ¶ import os import time import ray from aegaeon import LLMService , NodeConfig , Request from aegaeon.config import get_model_config from aegaeon.models import set_model_registry from aegaeon.model_registry import get_registry from aegaeon.utils import get_tokenizer config_path = os . path . abspath ( 'docs/en/examples/simple.yaml' ) os . environ [ 'AEGAEON_CONFIG_PATH' ] = config_path set_model_registry ( config_path ) ray . init ( address = '127.0.0.1:6789' ) spec = get_registry () . get_by_name ( 'Qwen/Qwen3-4B' ) assert spec is not None model_config = get_model_config ( spec ) tokenizer = get_tokenizer ( spec . path ()) service = LLMService ([ NodeConfig ( node_id = 'node_0' , num_prefill_engines = 0 , num_decode_engines = 0 , num_engines = 1 , tensor_parallel_size = 1 , cpu_num_slabs = 8 , cpu_slab_size_bytes = 1024 ** 3 , model_cache_size = 20 * 1024 ** 3 , cached_models = [ spec ], config_path = config_path , ) ]) request = Request ( model = spec , arrival_time = time . time (), request_id = 0 , prompt_token_ids = tokenizer . encode ( 'KV Cache is' ), decode_tokens = 16 , eos_token_ids = model_config . eos_token_ids , max_model_len = model_config . max_model_len , ) try : outputs = service . serve ([ request ]) if isinstance ( outputs [ 0 ], BaseException ): raise outputs [ 0 ] token_ids = [ step . new_token_id for step in outputs [ 0 ]] print ( tokenizer . decode ( token_ids , skip_special_tokens = True )) finally : ray . shutdown () Interfaces ¶ NodeConfig sets each node's engines, caches, and models; memory sizes use bytes. Request supplies prompt token IDs, output length, EOS, and context limits. Apply a chat template before tokenizing Chat messages. LLMService.serve() returns one StepOutput list or exception per request, in input order. It runs its own event loop and is called from synchronous code. deploy_model_replicas() and undeploy_model_replicas() manage replicas asynchronously. Use the HTTP API for chat formatting, streaming, and response schemas."
        },
        "configuration": {
          "id": "configuration",
          "label": "Configuration Reference",
          "group": "group-4",
          "html": "\u003ch1 id=\"configuration-reference\">Configuration Reference\u003ca class=\"headerlink\" href=\"#/en/configuration#configuration-reference\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>YAML has three sections: \u003ccode>server\u003c/code> defines engine topology and memory budgets, \u003ccode>models\u003c/code> registers model paths and profiles, and \u003ccode>devices\u003c/code> describes GPU capacity and bandwidth. The CLI supplies the bind address, port, and Ray address. See the \u003ca href=\"#/en/examples\">examples\u003c/a>.\u003c/p>\n\u003ch2 id=\"filesystem-paths\">Filesystem paths\u003ca class=\"headerlink\" href=\"#/en/configuration#filesystem-paths\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>The examples and several bundled tools assume a \u003ccode>/srv\u003c/code> directory layout by default: \u003ccode>/srv/models\u003c/code> for model weights, \u003ccode>/srv/aegaeon-archives\u003c/code> for CUDA Graph archives, and \u003ccode>/srv/datasets\u003c/code> for datasets. \u003c/p>\n\u003cp>Before running an example, replace its paths with absolute paths on your machine. Set each \u003ccode>models[].path\u003c/code> to the corresponding checkpoint directory and, when using CUDA Graph save/load, set \u003ccode>server.cuda_graph.archive_dir\u003c/code> to your archive location. For tools, use their path arguments or documented environment variables where available; otherwise adjust the tool's path defaults. Ensure the service can read the inputs and write the outputs. In multi-node deployments, the configured paths must be accessible on every node that uses them.\u003c/p>\n\u003ch2 id=\"serverconfig-defaults\">ServerConfig defaults\u003ca class=\"headerlink\" href=\"#/en/configuration#serverconfig-defaults\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Field\u003c/th>\n\u003cth style=\"text-align: right;\">Default\u003c/th>\n\u003cth>Meaning / constraints\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>cpu_num_slabs\u003c/td>\n\u003ctd style=\"text-align: right;\">128\u003c/td>\n\u003ctd>CPU KV slabs per node\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cpu_slab_size_bytes\u003c/td>\n\u003ctd style=\"text-align: right;\">1073741824\u003c/td>\n\u003ctd>1 GiB per slab, in bytes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>memory_utilization\u003c/td>\n\u003ctd style=\"text-align: right;\">0.775\u003c/td>\n\u003ctd>GPU capacity estimate; the CUDA allocator manages actual allocations separately\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>worker_num_cpus\u003c/td>\n\u003ctd style=\"text-align: right;\">16\u003c/td>\n\u003ctd>Ray CPUs requested per Worker\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>nnodes\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>Physical Ray node count\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>num_prefill_engines\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>Prefill Engines per node\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>num_decode_engines\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>Decode Engines per node\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>num_engines\u003c/td>\n\u003ctd style=\"text-align: right;\">0\u003c/td>\n\u003ctd>Simple Engines per node; mutually exclusive with P/D\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tensor_parallel_size\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>One Worker per Engine; 1 is the only supported value\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>model_cache_size_gb\u003c/td>\n\u003ctd style=\"text-align: right;\">0\u003c/td>\n\u003ctd>CPU weight cache in GiB; 0 selects automatic sizing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>dummy_weights\u003c/td>\n\u003ctd style=\"text-align: right;\">false\u003c/td>\n\u003ctd>Placeholder weights for control-path tests only\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decode_work_stealing\u003c/td>\n\u003ctd style=\"text-align: right;\">false\u003c/td>\n\u003ctd>Node-local Decode batch transfers\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decode_work_stealing_min_batch_gap\u003c/td>\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003ctd>Minimum donor/receiver batch-count gap, at least 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>model_placement_policy\u003c/td>\n\u003ctd style=\"text-align: right;\">least-loaded\u003c/td>\n\u003ctd>Also accepts round-robin\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>request_routing_policy\u003c/td>\n\u003ctd style=\"text-align: right;\">least-outstanding\u003c/td>\n\u003ctd>Also accepts round-robin\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>startup_models\u003c/td>\n\u003ctd style=\"text-align: right;\">null\u003c/td>\n\u003ctd>null=all models; []=empty service\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cuda_graph\u003c/td>\n\u003ctd style=\"text-align: right;\">CudaGraphConfig()\u003c/td>\n\u003ctd>Disabled by default; see below\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>CPU KV defaults to 128 GiB per node; size slabs and the weight cache for available host memory. Simple mode uses \u003ccode>num_engines &gt; 0\u003c/code> with both P/D counts set to 0. P/D mode uses \u003ccode>num_engines: 0\u003c/code> with at least one engine of each stage.\u003c/p>\n\u003cp>\u003ccode>startup_models: null\u003c/code> loads all configured models; \u003ccode>[]\u003c/code> starts empty; a list selects models. CLI \u003ccode>--models\u003c/code> overrides this selection.\u003c/p>\n\u003ch2 id=\"model-entries\">Model entries\u003ca class=\"headerlink\" href=\"#/en/configuration#model-entries\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Field\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>name\u003c/td>\n\u003ctd>Required\u003c/td>\n\u003ctd>Client-facing model name; need not match the profile folder\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>path\u003c/td>\n\u003ctd>Empty string\u003c/td>\n\u003ctd>Local weights; when unset, ModelSpec.path() triggers download\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>params\u003c/td>\n\u003ctd>null\u003c/td>\n\u003ctd>Input multiplied by 2^30 gives the parameter count; null infers it from local weight metadata\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>profile\u003c/td>\n\u003ctd>Empty string\u003c/td>\n\u003ctd>Performance directory alias; otherwise normalized from the model name's last segment\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>max_model_len\u003c/td>\n\u003ctd>null\u003c/td>\n\u003ctd>Total context length override, still subject to model capability\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>id\u003c/td>\n\u003ctd>Unset\u003c/td>\n\u003ctd>Generated sequentially when all are omitted; when explicit, supply an ID for every model\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tool_parser\u003c/td>\n\u003ctd>null\u003c/td>\n\u003ctd>A supported vLLM parser name; overrides selection from the model name/path\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"device-entries\">Device entries\u003ca class=\"headerlink\" href=\"#/en/configuration#device-entries\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Field\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>name\u003c/td>\n\u003ctd>Required logical device name matching detection/aliases\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>memory\u003c/td>\n\u003ctd>Required; multiplied by 2^30 to obtain bytes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>bandwidth\u003c/td>\n\u003ctd>Optional; multiplied by 2^30 to obtain bytes/s; omission attempts NVML detection\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>profile\u003c/td>\n\u003ctd>Retained in DeviceSpec.extra as a performance directory alias\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Other fields\u003c/td>\n\u003ctd>Retained in DeviceSpec.extra; only fields read by an implementation have an effect\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"cuda-graph-defaults-and-constraints\">CUDA graph defaults and constraints\u003ca class=\"headerlink\" href=\"#/en/configuration#cuda-graph-defaults-and-constraints\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Field\u003c/th>\n\u003cth>Class default\u003c/th>\n\u003cth>Constraints\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>mode\u003c/td>\n\u003ctd>'off'\u003c/td>\n\u003ctd>'off' / save / load; quote each value\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>archive_dir\u003c/td>\n\u003ctd>''\u003c/td>\n\u003ctd>Required for save/load\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>batch_sizes\u003c/td>\n\u003ctd>[1,2,4,8]\u003c/td>\n\u003ctd>Nonempty positive integers, sorted and deduplicated\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>seq_len_buckets\u003c/td>\n\u003ctd>[128,256,512,1024,2048]\u003c/td>\n\u003ctd>Class accepts multiple; \u003cstrong>Worker save/load currently requires exactly one maximum-length bucket\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>strict\u003c/td>\n\u003ctd>true\u003c/td>\n\u003ctd>Controls strict checks such as initialization scratch bounds; ABI/layout/binding checks always run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>base_address\u003c/td>\n\u003ctd>0x400000000000\u003c/td>\n\u003ctd>Positive and 2 MiB aligned; accepts a quoted hexadecimal string\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>region_size_bytes\u003c/td>\n\u003ctd>274877906944\u003c/td>\n\u003ctd>256 GiB virtual address range; positive and 2 MiB aligned\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>scratch_size_bytes\u003c/td>\n\u003ctd>4294967296\u003c/td>\n\u003ctd>4 GiB; positive, 2 MiB aligned, and smaller than region_size_bytes\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>CUDA Graph save/load is opt-in and runs on P/D Decode Workers when \u003ccode>mode\u003c/code> is \u003ccode>'save'\u003c/code> or \u003ccode>'load'\u003c/code>. See \u003ca href=\"#/en/cuda-graphs\">CUDA Graphs\u003c/a>.\u003c/p>",

          "text": "Configuration Reference ¶ YAML has three sections: server defines engine topology and memory budgets, models registers model paths and profiles, and devices describes GPU capacity and bandwidth. The CLI supplies the bind address, port, and Ray address. See the examples . Filesystem paths ¶ The examples and several bundled tools assume a /srv directory layout by default: /srv/models for model weights, /srv/aegaeon-archives for CUDA Graph archives, and /srv/datasets for datasets. Before running an example, replace its paths with absolute paths on your machine. Set each models[].path to the corresponding checkpoint directory and, when using CUDA Graph save/load, set server.cuda_graph.archive_dir to your archive location. For tools, use their path arguments or documented environment variables where available; otherwise adjust the tool's path defaults. Ensure the service can read the inputs and write the outputs. In multi-node deployments, the configured paths must be accessible on every node that uses them. ServerConfig defaults ¶ Field Default Meaning / constraints cpu_num_slabs 128 CPU KV slabs per node cpu_slab_size_bytes 1073741824 1 GiB per slab, in bytes memory_utilization 0.775 GPU capacity estimate; the CUDA allocator manages actual allocations separately worker_num_cpus 16 Ray CPUs requested per Worker nnodes 1 Physical Ray node count num_prefill_engines 1 Prefill Engines per node num_decode_engines 1 Decode Engines per node num_engines 0 Simple Engines per node; mutually exclusive with P/D tensor_parallel_size 1 One Worker per Engine; 1 is the only supported value model_cache_size_gb 0 CPU weight cache in GiB; 0 selects automatic sizing dummy_weights false Placeholder weights for control-path tests only decode_work_stealing false Node-local Decode batch transfers decode_work_stealing_min_batch_gap 2 Minimum donor/receiver batch-count gap, at least 2 model_placement_policy least-loaded Also accepts round-robin request_routing_policy least-outstanding Also accepts round-robin startup_models null null=all models; []=empty service cuda_graph CudaGraphConfig() Disabled by default; see below CPU KV defaults to 128 GiB per node; size slabs and the weight cache for available host memory. Simple mode uses num_engines > 0 with both P/D counts set to 0. P/D mode uses num_engines: 0 with at least one engine of each stage. startup_models: null loads all configured models; [] starts empty; a list selects models. CLI --models overrides this selection. Model entries ¶ Field Default Meaning name Required Client-facing model name; need not match the profile folder path Empty string Local weights; when unset, ModelSpec.path() triggers download params null Input multiplied by 2^30 gives the parameter count; null infers it from local weight metadata profile Empty string Performance directory alias; otherwise normalized from the model name's last segment max_model_len null Total context length override, still subject to model capability id Unset Generated sequentially when all are omitted; when explicit, supply an ID for every model tool_parser null A supported vLLM parser name; overrides selection from the model name/path Device entries ¶ Field Meaning name Required logical device name matching detection/aliases memory Required; multiplied by 2^30 to obtain bytes bandwidth Optional; multiplied by 2^30 to obtain bytes/s; omission attempts NVML detection profile Retained in DeviceSpec.extra as a performance directory alias Other fields Retained in DeviceSpec.extra; only fields read by an implementation have an effect CUDA graph defaults and constraints ¶ Field Class default Constraints mode 'off' 'off' / save / load; quote each value archive_dir '' Required for save/load batch_sizes [1,2,4,8] Nonempty positive integers, sorted and deduplicated seq_len_buckets [128,256,512,1024,2048] Class accepts multiple; Worker save/load currently requires exactly one maximum-length bucket strict true Controls strict checks such as initialization scratch bounds; ABI/layout/binding checks always run base_address 0x400000000000 Positive and 2 MiB aligned; accepts a quoted hexadecimal string region_size_bytes 274877906944 256 GiB virtual address range; positive and 2 MiB aligned scratch_size_bytes 4294967296 4 GiB; positive, 2 MiB aligned, and smaller than region_size_bytes CUDA Graph save/load is opt-in and runs on P/D Decode Workers when mode is 'save' or 'load' . See CUDA Graphs ."
        },
        "environment": {
          "id": "environment",
          "label": "Environment Variables",
          "group": "group-4",
          "html": "\u003ch1 id=\"environment-variables\">Environment Variables\u003ca class=\"headerlink\" href=\"#/en/environment#environment-variables\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Environment variables configure process-level defaults and library paths. Values are read during startup or module import, so changes take effect after a restart. Worker-side settings also need to be available on the relevant Ray nodes.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Variable\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_WEB_DIR\u003c/code>\u003c/td>\n\u003ctd>Unset\u003c/td>\n\u003ctd>Optional external UI asset directory\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_LOG_FILE\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>output.log\u003c/code>\u003c/td>\n\u003ctd>Service log path\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_TTFT_SLO\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>10\u003c/code>\u003c/td>\n\u003ctd>TTFT target in seconds\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_TPOT_SLO\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0.1\u003c/code>\u003c/td>\n\u003ctd>TPOT target in seconds\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_DEFAULT_MODEL_REPO\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>modelscope\u003c/code>\u003c/td>\n\u003ctd>Model source: modelscope or huggingface\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_PROFILE_ROOT\u003c/code>\u003c/td>\n\u003ctd>Bundled profiles, then repository \u003ccode>profiles/\u003c/code>\u003c/td>\n\u003ctd>Model/device performance profiles\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_SHM_DIR\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>/dev/shm\u003c/code>\u003c/td>\n\u003ctd>Shared-memory cache directory\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_RAY_ADDRESS\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>RAY_ADDRESS\u003c/code> / \u003ccode>auto\u003c/code>\u003c/td>\n\u003ctd>Ray cluster address; CLI overrides it\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_RAY_TEMP_DIR\u003c/code>\u003c/td>\n\u003ctd>Unset\u003c/td>\n\u003ctd>Local Ray temporary directory\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_ARENA_FRACTION\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0.875\u003c/code>\u003c/td>\n\u003ctd>QuickLoader GPU arena fraction\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>CUDA_VISIBLE_DEVICES\u003c/code>\u003c/td>\n\u003ctd>Process environment\u003c/td>\n\u003ctd>Visible GPU set\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_MAX_REQUESTS_PER_SECOND\u003c/code>\u003c/td>\n\u003ctd>Unset\u003c/td>\n\u003ctd>Per-model requests/second, averaged over 60 seconds; includes the pending request\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_MAX_TOKENS_PER_SECOND\u003c/code>\u003c/td>\n\u003ctd>Unset\u003c/td>\n\u003ctd>Per-model generated tokens/second, averaged over 60 seconds; checked at request admission\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_FOUNDRY_HOOK_PATH\u003c/code>\u003c/td>\n\u003ctd>Unset\u003c/td>\n\u003ctd>Absolute path to \u003ccode>libcuda_hook.so\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_CUDA_COMPAT_PATH\u003c/code>\u003c/td>\n\u003ctd>Probed paths\u003c/td>\n\u003ctd>CUDA compatibility library directory\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LD_LIBRARY_PATH\u003c/code>\u003c/td>\n\u003ctd>Process environment\u003c/td>\n\u003ctd>Dynamic-library search path\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>HTTP_PROXY\u003c/code>, \u003ccode>HTTPS_PROXY\u003c/code>, \u003ccode>NO_PROXY\u003c/code>\u003c/td>\n\u003ctd>Process environment\u003c/td>\n\u003ctd>Download/network proxy configuration\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Graph settings belong in \u003ca href=\"#/en/configuration\">YAML configuration\u003c/a>; startup commands are in the \u003ca href=\"#/en/cli\">CLI reference\u003c/a>.\u003c/p>",
          "headings": [],
          "text": "Environment Variables ¶ Environment variables configure process-level defaults and library paths. Values are read during startup or module import, so changes take effect after a restart. Worker-side settings also need to be available on the relevant Ray nodes. Variable Default Purpose AEGAEON_WEB_DIR Unset Optional external UI asset directory AEGAEON_LOG_FILE output.log Service log path AEGAEON_TTFT_SLO 10 TTFT target in seconds AEGAEON_TPOT_SLO 0.1 TPOT target in seconds AEGAEON_DEFAULT_MODEL_REPO modelscope Model source: modelscope or huggingface AEGAEON_PROFILE_ROOT Bundled profiles, then repository profiles/ Model/device performance profiles AEGAEON_SHM_DIR /dev/shm Shared-memory cache directory AEGAEON_RAY_ADDRESS RAY_ADDRESS / auto Ray cluster address; CLI overrides it AEGAEON_RAY_TEMP_DIR Unset Local Ray temporary directory AEGAEON_ARENA_FRACTION 0.875 QuickLoader GPU arena fraction CUDA_VISIBLE_DEVICES Process environment Visible GPU set AEGAEON_MAX_REQUESTS_PER_SECOND Unset Per-model requests/second, averaged over 60 seconds; includes the pending request AEGAEON_MAX_TOKENS_PER_SECOND Unset Per-model generated tokens/second, averaged over 60 seconds; checked at request admission AEGAEON_FOUNDRY_HOOK_PATH Unset Absolute path to libcuda_hook.so AEGAEON_CUDA_COMPAT_PATH Probed paths CUDA compatibility library directory LD_LIBRARY_PATH Process environment Dynamic-library search path HTTP_PROXY , HTTPS_PROXY , NO_PROXY Process environment Download/network proxy configuration Graph settings belong in YAML configuration ; startup commands are in the CLI reference ."
        },
        "cli": {
          "id": "cli",
          "label": "Command-Line Interface",
          "group": "group-5",
          "html": "\u003ch1 id=\"cli-reference\">CLI Reference\u003ca class=\"headerlink\" href=\"#/en/cli#cli-reference\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Use \u003ccode>aegaeon\u003c/code> or \u003ccode>python -m aegaeon\u003c/code>.\u003c/p>\n\u003ch2 id=\"doctor\">doctor\u003ca class=\"headerlink\" href=\"#/en/cli#doctor\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>doctor\u003c/code> checks the active Python environment and local host prerequisites. A configuration file adds model-path, profile, topology, and memory-budget checks.\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>doctor\n\u003cspan class=\"nv\">CUDA_VISIBLE_DEVICES\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">0\u003c/span>\u003cspan class=\"w\"> \u003c/span>aegaeon\u003cspan class=\"w\"> \u003c/span>doctor\u003cspan class=\"w\"> \u003c/span>--check-cuda\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Option\u003c/th>\n\u003cth>Parser default\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>--config\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>YAML file for local model, profile, topology, and memory checks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--models\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Comma-separated startup models; requires --config\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--tensor-parallel-size\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Nonzero overrides YAML; 0 uses YAML; requires --config; the effective size must be 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--strict\u003c/td>\n\u003ctd>false\u003c/td>\n\u003ctd>Return a nonzero status for warnings as well as failures\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--check-cuda\u003c/td>\n\u003ctd>false\u003c/td>\n\u003ctd>Run small PyTorch/CuPy CUDA operations, import vLLM's native extension, inspect visible GPUs, and test one-page host registration\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"start\">start\u003ca class=\"headerlink\" href=\"#/en/cli#start\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--config\u003cspan class=\"w\"> \u003c/span>/srv/aegaeon/config.yaml\u003cspan class=\"w\"> \u003c/span>--host\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">127\u003c/span>.0.0.1\u003cspan class=\"w\"> \u003c/span>--port\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">8000\u003c/span>\u003cspan class=\"w\"> \u003c/span>--ray-address\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">127\u003c/span>.0.0.1:6789\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Option\u003c/th>\n\u003cth>Parser default\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>--config\u003c/td>\n\u003ctd>Required\u003c/td>\n\u003ctd>YAML file\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--host\u003c/td>\n\u003ctd>0.0.0.0\u003c/td>\n\u003ctd>Bind address\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--port\u003c/td>\n\u003ctd>8000\u003c/td>\n\u003ctd>Port\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--models\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Comma-separated startup models; overrides startup_models; an empty string starts without models\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--num-prefill-engines\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>Normal startup uses YAML ServerConfig\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--num-decode-engines\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>Same\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--num-engines\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>Same\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--tensor-parallel-size\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Explicit nonzero value overrides YAML; 0 falls back to YAML\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--model-cache-size-gb\u003c/td>\n\u003ctd>20\u003c/td>\n\u003ctd>Fallback CPU weight capacity in GiB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--cpu-num-slabs\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>Fallback slab count\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--cpu-slab-size-gb\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>Fallback size in GiB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--ray-address\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Cluster address, ahead of environment variables\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Set topology and memory budgets in \u003ca href=\"#/en/configuration\">YAML configuration\u003c/a>.\u003c/p>\n\u003ch2 id=\"deploy\">deploy\u003ca class=\"headerlink\" href=\"#/en/cli#deploy\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>deploy\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--path\u003cspan class=\"w\"> \u003c/span>/srv/models/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--replicas\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">2\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Option\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>model\u003c/td>\n\u003ctd>Required positional argument\u003c/td>\n\u003ctd>Service model name\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--path\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Local weights; otherwise registered path, then download\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--host\u003c/td>\n\u003ctd>localhost\u003c/td>\n\u003ctd>API host\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--port\u003c/td>\n\u003ctd>8000\u003c/td>\n\u003ctd>API port\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--max-model-len\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Context override\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--replicas\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>Minimum READY replica target for automatic placement\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--nodes\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Explicit node IDs; bypass automatic placement\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--tool-parser\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Supported vLLM tool-parser override for this model alias\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Partial operations exit with a nonzero status; see \u003ca href=\"#/en/model-management\">Model Management\u003c/a>.\u003c/p>\n\u003ch2 id=\"undeploy\">undeploy\u003ca class=\"headerlink\" href=\"#/en/cli#undeploy\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>undeploy\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--nodes\u003cspan class=\"w\"> \u003c/span>node_1\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Option\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>model\u003c/td>\n\u003ctd>Required positional argument\u003c/td>\n\u003ctd>Service model name\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--host\u003c/td>\n\u003ctd>localhost\u003c/td>\n\u003ctd>API host\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--port\u003c/td>\n\u003ctd>8000\u003c/td>\n\u003ctd>API port\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--nodes\u003c/td>\n\u003ctd>All known replicas\u003c/td>\n\u003ctd>Unload only the listed nodes\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"queries\">Queries\u003ca class=\"headerlink\" href=\"#/en/cli#queries\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Each command's help lists its options and parser defaults.\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>--help\naegaeon\u003cspan class=\"w\"> \u003c/span>doctor\u003cspan class=\"w\"> \u003c/span>--help\naegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--help\naegaeon\u003cspan class=\"w\"> \u003c/span>deploy\u003cspan class=\"w\"> \u003c/span>--help\naegaeon\u003cspan class=\"w\"> \u003c/span>undeploy\u003cspan class=\"w\"> \u003c/span>--help\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>For startup resources, YAML values and defaults take precedence over the legacy resource fallback options. \u003ccode>--models\u003c/code> and a nonzero \u003ccode>--tensor-parallel-size\u003c/code> override their YAML fields; \u003ccode>--ray-address\u003c/code> precedes \u003ccode>AEGAEON_RAY_ADDRESS\u003c/code>, \u003ccode>RAY_ADDRESS\u003c/code>, then \u003ccode>auto\u003c/code>.\u003c/p>",

</script><script>(() => {

  function route() {

  function highlight(text,query) {
