          "html": "\u003ch1 id=\"欢迎使用-aegaeon\">欢迎使用 Aegaeon\u003ca class=\"headerlink\" href=\"#/zh/index#欢迎使用-aegaeon\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cdiv class=\"home-hero\">\n\u003cdiv class=\"hero-wordmark\">\u003csvg viewBox=\"0 0 72 80\" aria-hidden=\"true\">\u003cpath d=\"M36 3 69 71H54L36 33 18 71H3Z\" fill=\"#5368d6\"/>\u003cpath d=\"M27 56h18l7 15H20Z\" fill=\"#91a1ef\"/>\u003cpath d=\"M36 3 45 22 36 33 27 22Z\" fill=\"#bdc8ff\"/>\u003c/svg>\u003cspan>Aegaeon\u003c/span>\u003c/div>\n\u003cp class=\"hero-tagline\">以 Token 级自动扩缩容驱动高效的模型即服务。\u003c/p>\n\u003cdiv class=\"hero-actions\">\u003ca class=\"primary-action\" href=\"#/zh/quickstart\">快速开始 \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003ca class=\"secondary-action\" href=\"#/zh/architecture\">系统架构 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\n\u003c/div>\n\n\u003cp>Aegaeon 是一个高速推理系统，可在共享 GPU 上部署多个 AI 模型，在本地和云环境中提供模型即服务（Model-as-a-Service，MaaS）。\u003c/p>\n\u003ch2 id=\"关键功能\">关键功能\u003ca class=\"headerlink\" href=\"#/zh/index#关键功能\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Token 级自动扩缩容\u003c/strong> — 在 Token 步骤之间切换模型，无需等待整个请求完成。\u003c/li>\n\u003cli>\u003cstrong>SLO 感知调度\u003c/strong> — 根据 TTFT 和 TPOT 目标协调 Prefill 与 Decode 工作。\u003c/li>\n\u003cli>\u003cstrong>快速模型切换\u003c/strong> — 结合主机侧权重缓存、预取、Rust 快速加载器和显式 KV-cache 搬移。\u003c/li>\n\u003cli>\u003cstrong>多模型运行时\u003c/strong> — 支持动态模型部署、多副本和负载感知的请求路由。\u003c/li>\n\u003cli>\u003cstrong>vLLM 后端\u003c/strong> — 继承 vLLM 对 Dense、Hybrid 和 MoE 架构的模型及算子支持。\u003c/li>\n\u003cli>\u003cstrong>服务与可观测性\u003c/strong> — 提供 OpenAI 风格的 Chat 和 Completion API、SSE 流式输出及运行状态遥测。\u003c/li>\n\u003c/ul>\n\u003cp>更多技术细节见我们的 \u003ca href=\"https://doi.org/10.1145/3731569.3764815\">SOSP '25 论文\u003c/a>。\u003c/p>\n\u003ch2 id=\"文档\">文档\u003ca class=\"headerlink\" href=\"#/zh/index#文档\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指南\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/zh/quickstart\">快速开始\u003c/a>\u003c/td>\n\u003ctd>安装、配置与发送请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/zh/deployment\">部署\u003c/a>\u003c/td>\n\u003ctd>单节点与多节点服务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/zh/architecture\">系统架构\u003c/a>\u003c/td>\n\u003ctd>请求流程与运行组件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/zh/benchmarking\">基准测试\u003c/a>\u003c/td>\n\u003ctd>指标、Profiling 和性能工具\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/zh/api\">HTTP API\u003c/a>\u003c/td>\n\u003ctd>端点、schema 与响应\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/zh/cli\">CLI\u003c/a>\u003c/td>\n\u003ctd>启动、部署与查询\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>配置范围见\u003ca href=\"#/zh/capabilities\">功能与兼容性\u003c/a>。\u003c/p>",

          "text": "欢迎使用 Aegaeon ¶ Aegaeon 以 Token 级自动扩缩容驱动高效的模型即服务。 快速开始 → 系统架构 ↗ Aegaeon 是一个高速推理系统，可在共享 GPU 上部署多个 AI 模型，在本地和云环境中提供模型即服务（Model-as-a-Service，MaaS）。 关键功能 ¶ Token 级自动扩缩容 — 在 Token 步骤之间切换模型，无需等待整个请求完成。 SLO 感知调度 — 根据 TTFT 和 TPOT 目标协调 Prefill 与 Decode 工作。 快速模型切换 — 结合主机侧权重缓存、预取、Rust 快速加载器和显式 KV-cache 搬移。 多模型运行时 — 支持动态模型部署、多副本和负载感知的请求路由。 vLLM 后端 — 继承 vLLM 对 Dense、Hybrid 和 MoE 架构的模型及算子支持。 服务与可观测性 — 提供 OpenAI 风格的 Chat 和 Completion API、SSE 流式输出及运行状态遥测。 更多技术细节见我们的 SOSP '25 论文 。 文档 ¶ 指南 内容 快速开始 安装、配置与发送请求 部署 单节点与多节点服务 系统架构 请求流程与运行组件 基准测试 指标、Profiling 和性能工具 HTTP API 端点、schema 与响应 CLI 启动、部署与查询 配置范围见 功能与兼容性 。"

3c/span>\u003cspan class=\"nv\">$PWD\u003c/span>\u003cspan class=\"s2\">/aegaeon.yaml\"\u003c/span>\n\u003cspan class=\"nv\">MODEL_DIR\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$HOME\u003c/span>\u003cspan class=\"s2\">/aegaeon-models/Qwen3-4B\"\u003c/span>\nhf\u003cspan class=\"w\"> \u003c/span>download\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--local-dir\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$MODEL_DIR\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\nsed\u003cspan class=\"w\"> \u003c/span>-i\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s2\">\"s|/srv/models/Qwen3-4B|\u003c/span>\u003cspan class=\"nv\">$MODEL_DIR\u003c/span>\u003cspan class=\"s2\">|\"\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CONFIG_FILE\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>其他 GPU 或模型需要匹配的设备条目、性能 profile 和内存预算。这些字段见\u003ca href=\"#/zh/configuration\">配置参考\u003c/a>。\u003c/p>\n\u003ch2 id=\"服务启动\">服务启动\u003ca class=\"headerlink\" href=\"#/zh/quickstart#服务启动\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_VISIBLE_DEVICES\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">0\u003c/span>\naegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--config\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CONFIG_FILE\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"w\"> \u003c/span>--host\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">127\u003c/span>.0.0.1\u003cspan class=\"w\"> \u003c/span>--port\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">8000\u003c/span>\u003cspan class=\"w\"> \u003c/span>--ray-address\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nb\">local\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>启动时会加载 \u003ccode>startup_models\u003c/code> 中列出的模型。日志显示 \u003ccode>Application startup complete\u003c/code> 后，服务就绪。\u003c/p>\n\u003ch2 id=\"首次请求\">首次请求\u003ca class=\"headerlink\" href=\"#/zh/quickstart#首次请求\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>在另一个终端中，使用配置里的模型名称指定请求目标：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>curl\u003cspan class=\"w\"> \u003c/span>-sS\u003cspan class=\"w\"> \u003c/span>http://127.0.0.1:8000/v1/chat/completions\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>-H\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'Content-Type: application/json'\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>-d\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'{\"model\":\"Qwen/Qwen3-4B\",\"messages\":[{\"role\":\"user\",\"content\":\"用一句话解释 KV Cache。\"}],\"temperature\":0,\"max_tokens\":64}'\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>响应包含 \u003ccode>choices[0].message.content\u003c/code>、\u003ccode>finish_reason\u003c/code> 和 \u003ccode>usage\u003c/code>。客户端接入与流式输出见\u003ca href=\"#/zh/serving\">在线推理\u003c/a>。\u003c/p>",

          "text": "快速开始 ¶ 本例在单张 GPU 上以 Simple 模式运行 Qwen3-4B，使用提供的 A100 40 GB profile，并假定已完成 安装 。 模型与配置 ¶ 单 GPU 配置 定义了模型、缓存预算和一个 Simple Engine。将它保存为工作目录下的 aegaeon.yaml 。源码仓库中的同一文件位于 docs/zh/examples/simple.yaml 。 示例采用 /srv/models 作为默认路径。请按下面的方法将其替换为实际使用的模型绝对路径；存档和数据集的路径约定见 文件系统路径 。 以下命令下载模型，并更新配置中的模型路径： CONFIG_FILE = \" $PWD /aegaeon.yaml\" MODEL_DIR = \" $HOME /aegaeon-models/Qwen3-4B\" hf download Qwen/Qwen3-4B --local-dir \" $MODEL_DIR \" sed -i \"s|/srv/models/Qwen3-4B| $MODEL_DIR |\" \" $CONFIG_FILE \" 其他 GPU 或模型需要匹配的设备条目、性能 profile 和内存预算。这些字段见 配置参考 。 服务启动 ¶ export CUDA_VISIBLE_DEVICES = 0 aegaeon start --config \" $CONFIG_FILE \" --host 127 .0.0.1 --port 8000 --ray-address local 启动时会加载 startup_models 中列出的模型。日志显示 Application startup complete 后，服务就绪。 首次请求 ¶ 在另一个终端中，使用配置里的模型名称指定请求目标： curl -sS http://127.0.0.1:8000/v1/chat/completions \\ -H 'Content-Type: application/json' \\ -d '{\"model\":\"Qwen/Qwen3-4B\",\"messages\":[{\"role\":\"user\",\"content\":\"用一句话解释 KV Cache。\"}],\"temperature\":0,\"max_tokens\":64}' 响应包含 choices[0].message.content 、 finish_reason 和 usage 。客户端接入与流式输出见 在线推理 。"
        },

          "html": "\u003ch1 id=\"安装\">安装\u003ca class=\"headerlink\" href=\"#/zh/installation#安装\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon 支持 Linux x86_64 和 aarch64，要求标准 CPython 3.10。x86_64 可使用 CUDA 12.9 或 13.0；aarch64（包括 DGX Spark）使用 CUDA 13.0。\u003c/p>\n\u003ch2 id=\"预编译-wheel\">预编译 wheel\u003ca class=\"headerlink\" href=\"#/zh/installation#预编译-wheel\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>wheel 包含 Aegaeon 的 CUDA 和 Rust 扩展。运行时内核编译仍需匹配的 CUDA Toolkit、C++ 编译器和 Ninja，工具链命令见\u003ca href=\"#/zh/installation#源码安装\">源码安装\u003c/a>。Rust/Cargo 仅用于源码构建。每种 CUDA 路线使用独立的 Python 3.10 环境。\u003c/p>\n\u003cp>从 \u003ca href=\"https://github.com/pkusys/aegaeon/releases\">GitHub Releases\u003c/a> 下载匹配 CUDA 版本、CPU 架构和 CPython 3.10 的 wheel。激活 Python 环境，在仅包含这一份 Aegaeon wheel 的目录中执行安装命令。\u003c/p>\n\u003ch3 id=\"cuda-129linux-x86_64\">CUDA 12.9：Linux x86_64\u003ca class=\"headerlink\" href=\"#/zh/installation#cuda-129linux-x86_64\" title=\"Permanent link\">¶\u003c/a>\u003c/h3>\n\u003cp>预编译发行版支持 Linux x86_64、标准 CPython 3.10，以及 glibc &gt;=2.31。\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>./aegaeon-*.whl\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--extra-index-url\u003cspan class=\"w\"> \u003c/span>https://download.pytorch.org/whl/cu129\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--extra-index-url\u003cspan class=\"w\"> \u003c/span>https://wheels.vllm.ai/0.26.0/cu129\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3 id=\"cuda-130dgx-spark--linux-aarch64\">CUDA 13.0：DGX Spark / Linux aarch64\u003ca class=\"headerlink\" href=\"#/zh/installation#cuda-130dgx-spark--linux-aarch64\" title=\"Permanent link\">¶\u003c/a>\u003c/h3>\n\u003cp>DGX Spark 预编译 wheel 支持 Linux aarch64、标准 CPython 3.10 和 glibc &gt;=2.31，需要兼容 CUDA 13.0 的 NVIDIA 驱动。\u003c/p>\n\u003cp>在 DGX Spark 的 Linux 终端安装 CUDA 13.0 aarch64 wheel：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>./aegaeon-*.whl\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"源码安装\">源码安装\u003ca class=\"headerlink\" href=\"#/zh/installation#源码安装\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>源码构建要求 glibc &gt;=2.28、匹配的 CUDA Toolkit（包含 \u003ccode>nvcc\u003c/code>）、C++ 编译器、Ninja 和 Rust/Cargo。在仓库根目录执行：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>conda\u003cspan class=\"w\"> \u003c/span>create\u003cspan class=\"w\"> \u003c/span>--solver\u003cspan class=\"w\"> \u003c/span>classic\u003cspan class=\"w\"> \u003c/span>-n\u003cspan class=\"w\"> \u003c/span>aegaeon\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">python\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">3\u003c/span>.10\u003cspan class=\"w\"> \u003c/span>-y\nconda\u003cspan class=\"w\"> \u003c/span>activate\u003cspan class=\"w\"> \u003c/span>aegaeon\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>选择\u003c/th>\n\u003cth>CUDA Toolkit\u003c/th>\n\u003cth>PyTorch\u003c/th>\n\u003cth>vLLM\u003c/th>\n\u003cth>平台\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>cu129\u003c/code>\u003c/td>\n\u003ctd>12.9\u003c/td>\n\u003ctd>2.11.0+cu129\u003c/td>\n\u003ctd>0.26.0+cu129\u003c/td>\n\u003ctd>Linux x86_64\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cu130\u003c/code>\u003c/td>\n\u003ctd>13.0\u003c/td>\n\u003ctd>2.11.0\u003c/td>\n\u003ctd>0.26.0\u003c/td>\n\u003ctd>Linux x86_64 / aarch64\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>需要兼容的 NVIDIA 驱动，见 NVIDIA 的 \u003ca href=\"https://docs.nvidia.com/deploy/cuda-compatibility/\">CUDA 兼容性指南\u003c/a>。\u003c/p>\n\u003ch3 id=\"cuda-129\">CUDA 12.9\u003ca class=\"headerlink\" href=\"#/zh/installation#cuda-129\" title=\"Permanent link\">¶\u003c/a>\u003c/h3>\n\u003cp>该路线支持 Linux x86_64。如果尚未准备匹配的工具链，可以在 Conda 环境中手动安装：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>conda\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--solver\u003cspan class=\"w\"> \u003c/span>classic\u003cspan class=\"w\"> \u003c/span>-c\u003cspan class=\"w\"> \u003c/span>nvidia\u003cspan class=\"w\"> \u003c/span>cuda-toolkit\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">12\u003c/span>.9\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>gcc_linux-64\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">11\u003c/span>.2.0\u003cspan class=\"w\"> \u003c/span>gxx_linux-64\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">11\u003c/span>.2.0\u003cspan class=\"w\"> \u003c/span>rust\u003cspan class=\"w\"> \u003c/span>ninja\u003cspan class=\"w\"> \u003c/span>-y\nconda\u003cspan class=\"w\"> \u003c/span>activate\u003cspan class=\"w\"> \u003c/span>aegaeon\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_HOME\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CONDA_PREFIX\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib:\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib64\u003c/span>\u003cspan class=\"si\">${\u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"p\">:+:\u003c/span>\u003cspan class=\"nv\">$LIBRARY_PATH\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>如果使用系统 Toolkit，将 \u003ccode>CUDA_HOME\u003c/code> 设为其根目录。上述 Conda 示例使用 GCC/G++ 11.2。\u003c/p>\n\u003cp>安装匹配的依赖，然后编译安装 Aegaeon：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>-r\u003cspan class=\"w\"> \u003c/span>requirements-cu129.txt\n\u003cspan class=\"nv\">AEGAEON_CUDA\u003c/span>\u003cspan class=\"o\">=\u003c/span>cu129\u003cspan class=\"w\"> \u003c/span>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--no-build-isolation\u003cspan class=\"w\"> \u003c/span>-e\u003cspan class=\"w\"> \u003c/span>.\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3 id=\"cuda-130\">CUDA 13.0\u003ca class=\"headerlink\" href=\"#/zh/installation#cuda-130\" title=\"Permanent link\">¶\u003c/a>\u003c/h3>\n\u003cp>Linux x86_64：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>conda\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--solver\u003cspan class=\"w\"> \u003c/span>classic\u003cspan class=\"w\"> \u003c/span>-c\u003cspan class=\"w\"> \u003c/span>nvidia\u003cspan class=\"w\"> \u003c/span>cuda-toolkit\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">13\u003c/span>.0.2\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>gcc_linux-64\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">11\u003c/span>.2.0\u003cspan class=\"w\"> \u003c/span>gxx_linux-64\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">11\u003c/span>.2.0\u003cspan class=\"w\"> \u003c/span>rust\u003cspan class=\"w\"> \u003c/span>ninja\u003cspan class=\"w\"> \u003c/span>-y\nconda\u003cspan class=\"w\"> \u003c/span>activate\u003cspan class=\"w\"> \u003c/span>aegaeon\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_HOME\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CONDA_PREFIX\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib:\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib64\u003c/span>\u003cspan class=\"si\">${\u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"p\">:+:\u003c/span>\u003cspan class=\"nv\">$LIBRARY_PATH\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Linux aarch64 / DGX Spark 使用系统 CUDA 13.0 Toolkit 和 GCC/G++ 13：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>conda\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--solver\u003cspan class=\"w\"> \u003c/span>classic\u003cspan class=\"w\"> \u003c/span>-c\u003cspan class=\"w\"> \u003c/span>conda-forge\u003cspan class=\"w\"> \u003c/span>rust\u003cspan class=\"w\"> \u003c/span>ninja\u003cspan class=\"w\"> \u003c/span>-y\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_HOME\u003c/span>\u003cspan class=\"o\">=\u003c/span>/usr/local/cuda-13.0\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/bin:\u003c/span>\u003cspan class=\"nv\">$PATH\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CC\u003c/span>\u003cspan class=\"o\">=\u003c/span>/usr/bin/gcc\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CXX\u003c/span>\u003cspan class=\"o\">=\u003c/span>/usr/bin/g++\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib:\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib64\u003c/span>\u003cspan class=\"si\">${\u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"p\">:+:\u003c/span>\u003cspan class=\"nv\">$LIBRARY_PATH\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>然后安装 CUDA 13.0 依赖并编译 Aegaeon：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>-r\u003cspan class=\"w\"> \u003c/span>requirements-cu130.txt\n\u003cspan class=\"nv\">AEGAEON_CUDA\u003c/span>\u003cspan class=\"o\">=\u003c/span>cu130\u003cspan class=\"w\"> \u003c/span>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--no-build-isolation\u003cspan class=\"w\"> \u003c/span>-e\u003cspan class=\"w\"> \u003c/span>.\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"环境检查\">环境检查\u003ca class=\"headerlink\" href=\"#/zh/installation#环境检查\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>check\naegaeon\u003cspan class=\"w\"> \u003c/span>doctor\naegaeon\u003cspan class=\"w\"> \u003c/span>doctor\u003cspan class=\"w\"> \u003c/span>--check-cuda\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>在 Linux aarch64 / CUDA 13.0 环境中，\u003ccode>pip check\u003c/code> 可能报 \u003ccode>nvidia-cusparselt-cu13 0.8.0 is not supported on this platform\u003c/code>。这是 NVIDIA 上游 wheel 的元数据问题：文件名中的平台标签为 \u003ccode>manylinux2014_aarch64\u003c/code>，内部却声明为 \u003ccode>manylinux2014_sbsa\u003c/code>，导致兼容性检查失败。\u003c/p>\n\u003cp>Foundry 图 SAVE/LOAD 为可选功能，需要另行安装 Foundry，见 \u003ca href=\"#/zh/cuda-graphs\">CUDA Graph\u003c/a>。接下来阅读\u003ca href=\"#/zh/quickstart\">快速开始\u003c/a>。安装错误见\u003ca href=\"#/zh/troubleshooting\">故障排查\u003c/a>。\u003c/p>",

          "text": "安装 ¶ Aegaeon 支持 Linux x86_64 和 aarch64，要求标准 CPython 3.10。x86_64 可使用 CUDA 12.9 或 13.0；aarch64（包括 DGX Spark）使用 CUDA 13.0。 预编译 wheel ¶ wheel 包含 Aegaeon 的 CUDA 和 Rust 扩展。运行时内核编译仍需匹配的 CUDA Toolkit、C++ 编译器和 Ninja，工具链命令见 源码安装 。Rust/Cargo 仅用于源码构建。每种 CUDA 路线使用独立的 Python 3.10 环境。 从 GitHub Releases 下载匹配 CUDA 版本、CPU 架构和 CPython 3.10 的 wheel。激活 Python 环境，在仅包含这一份 Aegaeon wheel 的目录中执行安装命令。 CUDA 12.9：Linux x86_64 ¶ 预编译发行版支持 Linux x86_64、标准 CPython 3.10，以及 glibc >=2.31。 python -m pip install ./aegaeon-*.whl \\ --extra-index-url https://download.pytorch.org/whl/cu129 \\ --extra-index-url https://wheels.vllm.ai/0.26.0/cu129 CUDA 13.0：DGX Spark / Linux aarch64 ¶ DGX Spark 预编译 wheel 支持 Linux aarch64、标准 CPython 3.10 和 glibc >=2.31，需要兼容 CUDA 13.0 的 NVIDIA 驱动。 在 DGX Spark 的 Linux 终端安装 CUDA 13.0 aarch64 wheel： python -m pip install ./aegaeon-*.whl 源码安装 ¶ 源码构建要求 glibc >=2.28、匹配的 CUDA Toolkit（包含 nvcc ）、C++ 编译器、Ninja 和 Rust/Cargo。在仓库根目录执行： conda create --solver classic -n aegaeon python = 3 .10 -y conda activate aegaeon 选择 CUDA Toolkit PyTorch vLLM 平台 cu129 12.9 2.11.0+cu129 0.26.0+cu129 Linux x86_64 cu130 13.0 2.11.0 0.26.0 Linux x86_64 / aarch64 需要兼容的 NVIDIA 驱动，见 NVIDIA 的 CUDA 兼容性指南 。 CUDA 12.9 ¶ 该路线支持 Linux x86_64。如果尚未准备匹配的工具链，可以在 Conda 环境中手动安装： conda install --solver classic -c nvidia cuda-toolkit = 12 .9 \\ gcc_linux-64 = 11 .2.0 gxx_linux-64 = 11 .2.0 rust ninja -y conda activate aegaeon export CUDA_HOME = \" $CONDA_PREFIX \" export CUDA_PATH = \" $CUDA_HOME \" export LIBRARY_PATH = \" $CUDA_HOME /lib: $CUDA_HOME /lib64 ${ LIBRARY_PATH :+: $LIBRARY_PATH } \" 如果使用系统 Toolkit，将 CUDA_HOME 设为其根目录。上述 Conda 示例使用 GCC/G++ 11.2。 安装匹配的依赖，然后编译安装 Aegaeon： python -m pip install -r requirements-cu129.txt AEGAEON_CUDA = cu129 python -m pip install --no-build-isolation -e . CUDA 13.0 ¶ Linux x86_64： conda install --solver classic -c nvidia cuda-toolkit = 13 .0.2 \\ gcc_linux-64 = 11 .2.0 gxx_linux-64 = 11 .2.0 rust ninja -y conda activate aegaeon export CUDA_HOME = \" $CONDA_PREFIX \" export CUDA_PATH = \" $CUDA_HOME \" export LIBRARY_PATH = \" $CUDA_HOME /lib: $CUDA_HOME /lib64 ${ LIBRARY_PATH :+: $LIBRARY_PATH } \" Linux aarch64 / DGX Spark 使用系统 CUDA 13.0 Toolkit 和 GCC/G++ 13： conda install --solver classic -c conda-forge rust ninja -y export CUDA_HOME = /usr/local/cuda-13.0 export CUDA_PATH = \" $CUDA_HOME \" export PATH = \" $CUDA_HOME /bin: $PATH \" export CC = /usr/bin/gcc export CXX = /usr/bin/g++ export LIBRARY_PATH = \" $CUDA_HOME /lib: $CUDA_HOME /lib64 ${ LIBRARY_PATH :+: $LIBRARY_PATH } \" 然后安装 CUDA 13.0 依赖并编译 Aegaeon： python -m pip install -r requirements-cu130.txt AEGAEON_CUDA = cu130 python -m pip install --no-build-isolation -e . 环境检查 ¶ python -m pip check aegaeon doctor aegaeon doctor --check-cuda 在 Linux aarch64 / CUDA 13.0 环境中， pip check 可能报 nvidia-cusparselt-cu13 0.8.0 is not supported on this platform 。这是 NVIDIA 上游 wheel 的元数据问题：文件名中的平台标签为 manylinux2014_aarch64 ，内部却声明为 manylinux2014_sbsa ，导致兼容性检查失败。 Foundry 图 SAVE/LOAD 为可选功能，需要另行安装 Foundry，见 CUDA Graph 。接下来阅读 快速开始 。安装错误见 故障排查 。"
        },

          "html": "\u003ch1 id=\"模型准备\">模型准备\u003ca class=\"headerlink\" href=\"#/zh/models#模型准备\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>模型 checkpoint 包含模型配置、tokenizer 文件及所有 safetensors 权重分片。聊天请求还需要 tokenizer 的聊天模板。多节点部署时，各节点必须能通过相同的绝对路径访问 checkpoint。\u003c/p>\n\u003ch2 id=\"模型下载\">模型下载\u003ca class=\"headerlink\" href=\"#/zh/models#模型下载\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>hf\u003cspan class=\"w\"> \u003c/span>download\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--local-dir\u003cspan class=\"w\"> \u003c/span>/srv/models/Qwen3-4B\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"模型注册\">模型注册\u003ca class=\"headerlink\" href=\"#/zh/models#模型注册\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nt\">models\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n\u003cspan class=\"p p-Indicator\">-\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nt\">name\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">Qwen/Qwen3-4B\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">path\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">/srv/models/Qwen3-4B\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">profile\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">Qwen/Qwen3-4B\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">max_model_len\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">4096\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cul>\n\u003cli>\u003ccode>name\u003c/code>：客户端请求中的模型标识。\u003c/li>\n\u003cli>\u003ccode>path\u003c/code>：checkpoint 路径。\u003c/li>\n\u003cli>\u003ccode>profile\u003c/code>：选择性能数据，见\u003ca href=\"#/zh/profiling\">性能数据采集\u003c/a>。\u003c/li>\n\u003cli>\u003ccode>max_model_len\u003c/code>：包含输入和生成 token 的总长度。\u003c/li>\n\u003c/ul>\n\u003cp>通常省略 \u003ccode>params\u003c/code>，由 Aegaeon 读取权重元数据中的参数量；显式填写时以 \u003ccode>2^30\u003c/code> 个参数为单位。\u003c/p>\n\u003cp>注册用于定义模型，本身不会创建 \u003ccode>ready\u003c/code> 副本。还需选择启动时缓存的模型，或\u003ca href=\"#/zh/model-management\">动态部署\u003c/a>。完整模型字段见\u003ca href=\"#/zh/configuration\">配置参考\u003c/a>。\u003c/p>",
          "headings": [

              "id": "模型下载",
              "title": "模型下载",

              "id": "模型注册",
              "title": "模型注册",
              "level": 2

          ],
          "text": "模型准备 ¶ 模型 checkpoint 包含模型配置、tokenizer 文件及所有 safetensors 权重分片。聊天请求还需要 tokenizer 的聊天模板。多节点部署时，各节点必须能通过相同的绝对路径访问 checkpoint。 模型下载 ¶ hf download Qwen/Qwen3-4B --local-dir /srv/models/Qwen3-4B 模型注册 ¶ models : - name : Qwen/Qwen3-4B path : /srv/models/Qwen3-4B profile : Qwen/Qwen3-4B max_model_len : 4096 name ：客户端请求中的模型标识。 path ：checkpoint 路径。 profile ：选择性能数据，见 性能数据采集 。 max_model_len ：包含输入和生成 token 的总长度。 通常省略 params ，由 Aegaeon 读取权重元数据中的参数量；显式填写时以 2^30 个参数为单位。 注册用于定义模型，本身不会创建 ready 副本。还需选择启动时缓存的模型，或 动态部署 。完整模型字段见 配置参考 。"

          "html": "\u003ch1 id=\"功能与兼容性\">功能与兼容性\u003ca class=\"headerlink\" href=\"#/zh/capabilities#功能与兼容性\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"支持范围\">支持范围\u003ca class=\"headerlink\" href=\"#/zh/capabilities#支持范围\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>功能\u003c/th>\n\u003cth>支持情况\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>多模型推理\u003c/td>\n\u003ctd>Token 级调度与模型切换\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>部署\u003c/td>\n\u003ctd>单节点或多节点的 Simple、Prefill/Decode 模式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型管理\u003c/td>\n\u003ctd>动态部署、卸载、多副本与请求路由\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP\u003c/td>\n\u003ctd>OpenAI 风格 Chat/Completion、SSE、分词及运行监控\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成\u003c/td>\n\u003ctd>单候选贪心解码\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>函数工具\u003c/td>\n\u003ctd>使用模型对应的 vLLM parser，客户端执行函数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Decode Work Stealing\u003c/td>\n\u003ctd>可选的节点内 batch 均衡\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CUDA Graph\u003c/td>\n\u003ctd>P/D Decode Worker 的 Foundry 保存与加载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多模态输入\u003c/td>\n\u003ctd>当前仅提供文本输入与文本生成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>量化、随机采样、beam search、logprobs\u003c/td>\n\u003ctd>当前配置范围之外\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>仅支持 \u003ccode>tensor_parallel_size=1\u003c/code>，Pipeline Parallel 固定为 1。多 GPU 通过增加 Engine 扩展。\u003c/p>\n\u003cp>用法见\u003ca href=\"#/zh/models\">模型准备\u003c/a>、\u003ca href=\"#/zh/generation\">生成参数\u003c/a>和 \u003ca href=\"#/zh/api\">HTTP API\u003c/a>。\u003c/p>",

          "text": "功能与兼容性 ¶ 支持范围 ¶ 功能 支持情况 多模型推理 Token 级调度与模型切换 部署 单节点或多节点的 Simple、Prefill/Decode 模式 模型管理 动态部署、卸载、多副本与请求路由 HTTP OpenAI 风格 Chat/Completion、SSE、分词及运行监控 生成 单候选贪心解码 函数工具 使用模型对应的 vLLM parser，客户端执行函数 Decode Work Stealing 可选的节点内 batch 均衡 CUDA Graph P/D Decode Worker 的 Foundry 保存与加载 多模态输入 当前仅提供文本输入与文本生成 量化、随机采样、beam search、logprobs 当前配置范围之外 仅支持 tensor_parallel_size=1 ，Pipeline Parallel 固定为 1。多 GPU 通过增加 Engine 扩展。 用法见 模型准备 、 生成参数 和 HTTP API 。"

        "serving": {

          "label": "在线推理",
          "group": "group-1",
          "html": "\u003ch1 id=\"在线推理\">在线推理\u003ca class=\"headerlink\" href=\"#/zh/serving#在线推理\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"openai-风格客户端\">OpenAI 风格客户端\u003ca class=\"headerlink\" href=\"#/zh/serving#openai-风格客户端\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>OpenAI 客户端通过服务的 \u003ccode>/v1\u003c/code> 地址连接。\u003ccode>model\u003c/code> 指定已部署模型，当前生成采用贪心解码：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">openai\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">OpenAI\u003c/span>\n\n\u003cspan class=\"n\">client\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">OpenAI\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">base_url\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'http://127.0.0.1:8000/v1'\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">api_key\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'local-placeholder'\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">response\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">client\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">chat\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">completions\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">create\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n    \u003cspan class=\"n\">model\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'Qwen/Qwen3-4B'\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">messages\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">[{\u003c/span>\u003cspan class=\"s1\">'role'\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s1\">'user'\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s1\">'content'\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s1\">'解释模型切换。'\u003c/span>\u003cspan class=\"p\">}],\u003c/span>\n    \u003cspan class=\"n\">temperature\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">max_tokens\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">128\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">response\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">choices\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">message\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">content\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>这里的 key 用于满足客户端构造要求；鉴权由部署侧网关配置。\u003c/p>\n\u003ch2 id=\"流式输出\">流式输出\u003ca class=\"headerlink\" href=\"#/zh/serving#流式输出\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>设置 \u003ccode>stream=True\u003c/code> 后，文本通过 \u003ccode>chunk.choices[0].delta.content\u003c/code> 返回。\u003ccode>stream_options.include_usage=true\u003c/code> 会在末尾添加 usage chunk，其 \u003ccode>choices\u003c/code> 为空：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"n\">stream\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">client\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">chat\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">completions\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">create\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n    \u003cspan class=\"n\">model\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'Qwen/Qwen3-4B'\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">messages\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">[{\u003c/span>\u003cspan class=\"s1\">'role'\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s1\">'user'\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s1\">'content'\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s1\">'你好'\u003c/span>\u003cspan class=\"p\">}],\u003c/span>\n    \u003cspan class=\"n\">temperature\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">stream\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">stream_options\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"s1\">'include_usage'\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">},\u003c/span>\n\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">chunk\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">stream\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">chunk\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">choices\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">chunk\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">choices\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">delta\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">content\u003c/span> \u003cspan class=\"ow\">or\u003c/span> \u003cspan class=\"s1\">''\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">end\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">''\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">flush\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>原始 SSE 响应以 \u003ccode>data: [DONE]\u003c/code> 结束。Completion 请求使用 \u003ccode>/v1/completions\u003c/code>，\u003ccode>prompt\u003c/code> 接受字符串或 token ID 列表。\u003c/p>\n\u003ch2 id=\"工具调用\">工具调用\u003ca class=\"headerlink\" href=\"#/zh/serving#工具调用\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Aegaeon 支持 OpenAI 风格的 \u003ccode>tools\u003c/code> 和 \u003ccode>tool_choice\u003c/code>。传入工具时，\u003ccode>tool_choice\u003c/code> 默认为 \u003ccode>auto\u003c/code>；\u003ccode>none\u003c/code> 关闭解析。工具调用需要受支持的 vLLM 解析器，可根据模型名称或路径推断，也可通过 YAML 模型条目或部署请求中的 \u003ccode>tool_parser\u003c/code> 显式指定。\u003c/p>\n\u003cp>客户端执行返回的 \u003ccode>tool_calls\u003c/code>，并将结果作为通过 \u003ccode>tool_call_id\u003c/code> 关联的 \u003ccode>tool\u003c/code> 消息提交。启用工具解析器时，流式响应会缓冲生成的输出，直到生成完成，再一起返回解析后的文本和工具调用。\u003c/p>\n\u003cp>可用取值见\u003ca href=\"#/zh/generation\">生成参数\u003c/a>，端点和请求结构见 \u003ca href=\"#/zh/api\">HTTP API\u003c/a>。\u003c/p>",

          "text": "在线推理 ¶ OpenAI 风格客户端 ¶ OpenAI 客户端通过服务的 /v1 地址连接。 model 指定已部署模型，当前生成采用贪心解码： from openai import OpenAI client = OpenAI ( base_url = 'http://127.0.0.1:8000/v1' , api_key = 'local-placeholder' ) response = client . chat . completions . create ( model = 'Qwen/Qwen3-4B' , messages = [{ 'role' : 'user' , 'content' : '解释模型切换。' }], temperature = 0 , max_tokens = 128 , ) print ( response . choices [ 0 ] . message . content ) 这里的 key 用于满足客户端构造要求；鉴权由部署侧网关配置。 流式输出 ¶ 设置 stream=True 后，文本通过 chunk.choices[0].delta.content 返回。 stream_options.include_usage=true 会在末尾添加 usage chunk，其 choices 为空： stream = client . chat . completions . create ( model = 'Qwen/Qwen3-4B' , messages = [{ 'role' : 'user' , 'content' : '你好' }], temperature = 0 , stream = True , stream_options = { 'include_usage' : True }, ) for chunk in stream : if chunk . choices : print ( chunk . choices [ 0 ] . delta . content or '' , end = '' , flush = True ) 原始 SSE 响应以 data: [DONE] 结束。Completion 请求使用 /v1/completions ， prompt 接受字符串或 token ID 列表。 工具调用 ¶ Aegaeon 支持 OpenAI 风格的 tools 和 tool_choice 。传入工具时， tool_choice 默认为 auto ； none 关闭解析。工具调用需要受支持的 vLLM 解析器，可根据模型名称或路径推断，也可通过 YAML 模型条目或部署请求中的 tool_parser 显式指定。 客户端执行返回的 tool_calls ，并将结果作为通过 tool_call_id 关联的 tool 消息提交。启用工具解析器时，流式响应会缓冲生成的输出，直到生成完成，再一起返回解析后的文本和工具调用。 可用取值见 生成参数 ，端点和请求结构见 HTTP API 。"
        },
        "generation": {
          "id": "generation",
          "label": "生成参数",
          "group": "group-1",
          "html": "\u003ch1 id=\"生成参数\">生成参数\u003ca class=\"headerlink\" href=\"#/zh/generation#生成参数\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"贪心解码\">贪心解码\u003ca class=\"headerlink\" href=\"#/zh/generation#贪心解码\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>当前 Worker 为每个请求生成一个贪心续写结果。采样控制参数仅接受下表中的取值，其他值返回 HTTP 400。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>可用取值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>n\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>temperature\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0\u003c/code> 或 \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>top_p\u003c/code>、\u003ccode>top_k\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code> 或 \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>min_p\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0\u003c/code> 或 \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>frequency_penalty\u003c/code>、\u003ccode>presence_penalty\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0\u003c/code> 或 \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>repetition_penalty\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code> 或 \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>logit_bias\u003c/code>\u003c/td>\n\u003ctd>空字典或 \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>use_beam_search\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>length_penalty\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>priority\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>seed\u003c/code>\u003c/td>\n\u003ctd>任意整数或 \u003ccode>null\u003c/code>；不影响贪心解码\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Chat \u003ccode>logprobs\u003c/code> / \u003ccode>top_logprobs\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code> 或 \u003ccode>null\u003c/code> / \u003ccode>0\u003c/code> 或 \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Completion \u003ccode>logprobs\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>null\u003c/code> 或省略\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"长度与停止\">长度与停止\u003ca class=\"headerlink\" href=\"#/zh/generation#长度与停止\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Chat 默认生成 128 个 token，Completion 默认为 16 个。Chat 接受 \u003ccode>max_tokens\u003c/code> 或 \u003ccode>max_completion_tokens\u003c/code>；同时提供时，两者必须一致。输出上限至少为 1，prompt 必须为至少一个输出 token 留出空间，生成的总长度受模型 \u003ccode>max_model_len\u003c/code> 限制。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>stop\u003c/code>\u003c/td>\n\u003ctd>在可见文本中匹配的一个或多个停止字符串\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>stop_token_ids\u003c/code>\u003c/td>\n\u003ctd>额外的非负停止 token ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ignore_eos\u003c/code>\u003c/td>\n\u003ctd>忽略 EOS；显式停止条件和长度上限仍然生效\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>min_tokens\u003c/code>\u003c/td>\n\u003ctd>接受停止条件前的最少输出 token 数，范围为 0 到输出上限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>include_stop_str_in_output\u003c/code>\u003c/td>\n\u003ctd>保留匹配的停止字符串\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>skip_special_tokens\u003c/code>\u003c/td>\n\u003ctd>解码时省略特殊 token\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>return_token_ids\u003c/code>\u003c/td>\n\u003ctd>在响应中返回 token ID\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>finish_reason\u003c/code> 为 \u003ccode>stop\u003c/code>、\u003ccode>length\u003c/code>，成功解析函数调用时为 \u003ccode>tool_calls\u003c/code>。\u003c/p>\n\u003ch2 id=\"prompt-格式\">Prompt 格式\u003ca class=\"headerlink\" href=\"#/zh/generation#prompt-格式\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>truncate_prompt_tokens\u003c/code> 接受正整数输入 token 上限或 \u003ccode>-1\u003c/code>。对于纯文本输入，\u003ccode>-1\u003c/code> 保持输入不变，截断默认保留末尾。\u003ccode>truncation_side='left'\u003c/code> 保留末尾，\u003ccode>'right'\u003c/code> 保留开头。\u003c/p>\n\u003cp>Chat 默认 \u003ccode>add_special_tokens=false\u003c/code>、\u003ccode>add_generation_prompt=true\u003c/code>。\u003ccode>continue_final_message=true\u003c/code> 表示续写最后一条消息，此时要求 \u003ccode>add_generation_prompt=false\u003c/code>。\u003c/p>\n\u003cp>完整请求类型和默认值见运行中服务的 \u003ccode>/docs\u003c/code> 和 \u003ccode>/openapi.json\u003c/code>。\u003c/p>",
          "headings": [
            {
              "id": "贪心解码",
              "title": "贪心解码",
              "level": 2
            },
            {
              "id": "长度与停止",
              "title": "长度与停止",
              "level": 2

            {
              "id": "prompt-格式",
              "title": "Prompt 格式",
              "level": 2
            }
          ],
          "text": "生成参数 ¶ 贪心解码 ¶ 当前 Worker 为每个请求生成一个贪心续写结果。采样控制参数仅接受下表中的取值，其他值返回 HTTP 400。 参数 可用取值 n 1 temperature 0 或 null top_p 、 top_k 1 或 null min_p 0 或 null frequency_penalty 、 presence_penalty 0 或 null repetition_penalty 1 或 null logit_bias 空字典或 null use_beam_search false length_penalty 1 priority 0 seed 任意整数或 null ；不影响贪心解码 Chat logprobs / top_logprobs false 或 null / 0 或 null Completion logprobs null 或省略 长度与停止 ¶ Chat 默认生成 128 个 token，Completion 默认为 16 个。Chat 接受 max_tokens 或 max_completion_tokens ；同时提供时，两者必须一致。输出上限至少为 1，prompt 必须为至少一个输出 token 留出空间，生成的总长度受模型 max_model_len 限制。 参数 含义 stop 在可见文本中匹配的一个或多个停止字符串 stop_token_ids 额外的非负停止 token ID ignore_eos 忽略 EOS；显式停止条件和长度上限仍然生效 min_tokens 接受停止条件前的最少输出 token 数，范围为 0 到输出上限 include_stop_str_in_output 保留匹配的停止字符串 skip_special_tokens 解码时省略特殊 token return_token_ids 在响应中返回 token ID finish_reason 为 stop 、 length ，成功解析函数调用时为 tool_calls 。 Prompt 格式 ¶ truncate_prompt_tokens 接受正整数输入 token 上限或 -1 。对于纯文本输入， -1 保持输入不变，截断默认保留末尾。 truncation_side='left' 保留末尾， 'right' 保留开头。 Chat 默认 add_special_tokens=false 、 add_generation_prompt=true 。 continue_final_message=true 表示续写最后一条消息，此时要求 add_generation_prompt=false 。 完整请求类型和默认值见运行中服务的 /docs 和 /openapi.json 。"
        },
        "model-management": {
          "id": "model-management",
          "label": "模型管理",
          "group": "group-1",
          "html": "\u003ch1 id=\"模型管理\">模型管理\u003ca class=\"headerlink\" href=\"#/zh/model-management#模型管理\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon 将模型副本保存在各节点的 CPU 权重缓存中，并在就绪副本之间路由请求。每个请求的 Prefill 和 Decode 生命周期始终位于同一个 Aegaeon 节点。\u003c/p>\n\u003ch2 id=\"副本状态\">副本状态\u003ca class=\"headerlink\" href=\"#/zh/model-management#副本状态\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>状态\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>absent\u003c/code>\u003c/td>\n\u003ctd>无副本；放置快照中省略此状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>loading\u003c/code>\u003c/td>\n\u003ctd>正在部署\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ready\u003c/code>\u003c/td>\n\u003ctd>接收新请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>draining\u003c/code>\u003c/td>\n\u003ctd>拒绝新请求；已有请求结束后重试卸载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>failed\u003c/code>\u003c/td>\n\u003ctd>部署失败\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"部署与路由\">部署与路由\u003ca class=\"headerlink\" href=\"#/zh/model-management#部署与路由\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>deploy\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--replicas\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">2\u003c/span>\naegaeon\u003cspan class=\"w\"> \u003c/span>undeploy\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--nodes\u003cspan class=\"w\"> \u003c/span>node_1\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>\u003ccode>--replicas\u003c/code>（HTTP 请求中的 \u003ccode>replica_count\u003c/code>）设置就绪副本数的下限目标。减少副本数使用 undeploy。\u003ccode>--nodes\u003c/code>（\u003ccode>node_ids\u003c/code>）直接选择节点，优先于副本数目标。\u003c/p>\n\u003cp>\u003ccode>server.model_placement_policy: least-loaded\u003c/code> 根据缓存容量、驱逐代价和请求负载选择节点；\u003ccode>server.request_routing_policy: least-outstanding\u003c/code> 在就绪节点中选择未完成请求最少的节点。两者均支持 \u003ccode>round-robin\u003c/code>。\u003c/p>\n\u003ch2 id=\"操作结果\">操作结果\u003ca class=\"headerlink\" href=\"#/zh/model-management#操作结果\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>部署和卸载响应包含 \u003ccode>status\u003c/code>、各节点结果及 \u003ccode>failed\u003c/code>。HTTP 200 仍可能包含 \u003ccode>status: partial\u003c/code>，需检查这些字段确认操作是否完成。部分成功时，CLI 退出码为 1。部署后没有任何就绪副本时，返回 HTTP 507。\u003c/p>\n\u003cp>通过 \u003ccode>GET /v1/aegaeon/runtime\u003c/code> 查看放置和路由状态。命令选项见 \u003ca href=\"#/zh/cli\">CLI 参考\u003c/a>，HTTP 字段见 \u003ca href=\"#/zh/api\">API 参考\u003c/a>。\u003c/p>",

          "text": "模型管理 ¶ Aegaeon 将模型副本保存在各节点的 CPU 权重缓存中，并在就绪副本之间路由请求。每个请求的 Prefill 和 Decode 生命周期始终位于同一个 Aegaeon 节点。 副本状态 ¶ 状态 含义 absent 无副本；放置快照中省略此状态 loading 正在部署 ready 接收新请求 draining 拒绝新请求；已有请求结束后重试卸载 failed 部署失败 部署与路由 ¶ aegaeon deploy Qwen/Qwen3-4B --replicas 2 aegaeon undeploy Qwen/Qwen3-4B --nodes node_1 --replicas （HTTP 请求中的 replica_count ）设置就绪副本数的下限目标。减少副本数使用 undeploy。 --nodes （ node_ids ）直接选择节点，优先于副本数目标。 server.model_placement_policy: least-loaded 根据缓存容量、驱逐代价和请求负载选择节点； server.request_routing_policy: least-outstanding 在就绪节点中选择未完成请求最少的节点。两者均支持 round-robin 。 操作结果 ¶ 部署和卸载响应包含 status 、各节点结果及 failed 。HTTP 200 仍可能包含 status: partial ，需检查这些字段确认操作是否完成。部分成功时，CLI 退出码为 1。部署后没有任何就绪副本时，返回 HTTP 507。 通过 GET /v1/aegaeon/runtime 查看放置和路由状态。命令选项见 CLI 参考 ，HTTP 字段见 API 参考 。"
        },
        "deployment": {
          "id": "deployment",
          "label": "分布式部署",
          "group": "group-1",
          "html": "\u003ch1 id=\"部署\">部署\u003ca class=\"headerlink\" href=\"#/zh/deployment#部署\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>每个已配置的 Aegaeon 节点运行一个 Controller，节点内的 Engine 共享 CPU 缓存。当前支持 TP=1，因此每个 Engine 使用一张 GPU。常规部署中，每个物理 Ray 节点对应一个 Aegaeon 节点；\u003ccode>server.nnodes\u003c/code> 统计节点数，而非 GPU 数。\u003c/p>\n\u003cp>多 GPU 主机通常设置 \u003ccode>nnodes: 1\u003c/code>。通过 Python 集成时，可分别设置 \u003ccode>NodeConfig.cuda_visible_devices\u003c/code> 和 \u003ccode>NodeConfig.shm_dir\u003c/code>，在同一主机上隔离多个逻辑节点。\u003c/p>\n\u003ch2 id=\"执行模式\">执行模式\u003ca class=\"headerlink\" href=\"#/zh/deployment#执行模式\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模式\u003c/th>\n\u003cth>Server 配置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Simple\u003c/td>\n\u003ctd>\u003ccode>num_engines &gt; 0\u003c/code>，P/D 数量均为 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P/D\u003c/td>\n\u003ctd>\u003ccode>num_engines: 0\u003c/code>，至少一个 Prefill 和一个 Decode Engine\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>单 GPU、P/D 和多节点布局见\u003ca href=\"#/zh/examples\">配置示例\u003c/a>。在各节点准备相同的模型文件和匹配的性能数据。\u003c/p>\n\u003ch2 id=\"ray-集群\">Ray 集群\u003ca class=\"headerlink\" href=\"#/zh/deployment#ray-集群\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>单机可使用 \u003ccode>--ray-address local\u003c/code>。两台主机分别启动 Ray：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"c1\"># Head node\u003c/span>\nray\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--head\u003cspan class=\"w\"> \u003c/span>--port\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">6789\u003c/span>\u003cspan class=\"w\"> \u003c/span>--resources\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'{\"node_0\":1}'\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"c1\"># Worker node\u003c/span>\nray\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--address\u003cspan class=\"o\">=\u003c/span>HEAD_IP:6789\u003cspan class=\"w\"> \u003c/span>--resources\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'{\"node_1\":1}'\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>在配置中设置 \u003ccode>server.nnodes: 2\u003c/code>，然后从 Head 节点启动 API：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--config\u003cspan class=\"w\"> \u003c/span>/srv/aegaeon/config.yaml\u003cspan class=\"w\"> \u003c/span>--ray-address\u003cspan class=\"w\"> \u003c/span>HEAD_IP:6789\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"资源\">资源\u003ca class=\"headerlink\" href=\"#/zh/deployment#资源\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>每个节点需要为每个配置的 Engine 提供一张可见 GPU。Ray CPU 预算需覆盖每个 Worker 的 \u003ccode>server.worker_num_cpus\u003c/code> 个逻辑 CPU，以及 Controller 所需的容量。\u003ccode>ray status\u003c/code> 显示集群的 CPU 和 GPU 资源。\u003c/p>\n\u003cp>如需覆盖默认 \u003ca href=\"#/zh/scheduling#slo-设置\">SLO 设置\u003c/a>，在启动前为 API 和所有 Ray 节点设置相应环境变量。独立服务使用各自的 Ray 实例和共享内存目录。停止前台服务会断开其 Ray driver；已有 Ray 集群需单独管理。\u003c/p>",
          "headings": [
            {
              "id": "执行模式",
              "title": "执行模式",
              "level": 2

            {
              "id": "ray-集群",
              "title": "Ray 集群",

          "text": "部署 ¶ 每个已配置的 Aegaeon 节点运行一个 Controller，节点内的 Engine 共享 CPU 缓存。当前支持 TP=1，因此每个 Engine 使用一张 GPU。常规部署中，每个物理 Ray 节点对应一个 Aegaeon 节点； server.nnodes 统计节点数，而非 GPU 数。 多 GPU 主机通常设置 nnodes: 1 。通过 Python 集成时，可分别设置 NodeConfig.cuda_visible_devices 和 NodeConfig.shm_dir ，在同一主机上隔离多个逻辑节点。 执行模式 ¶ 模式 Server 配置 Simple num_engines > 0 ，P/D 数量均为 0 P/D num_engines: 0 ，至少一个 Prefill 和一个 Decode Engine 单 GPU、P/D 和多节点布局见 配置示例 。在各节点准备相同的模型文件和匹配的性能数据。 Ray 集群 ¶ 单机可使用 --ray-address local 。两台主机分别启动 Ray： # Head node ray start --head --port = 6789 --resources = '{\"node_0\":1}' # Worker node ray start --address = HEAD_IP:6789 --resources = '{\"node_1\":1}' 在配置中设置 server.nnodes: 2 ，然后从 Head 节点启动 API： aegaeon start --config /srv/aegaeon/config.yaml --ray-address HEAD_IP:6789 资源 ¶ 每个节点需要为每个配置的 Engine 提供一张可见 GPU。Ray CPU 预算需覆盖每个 Worker 的 server.worker_num_cpus 个逻辑 CPU，以及 Controller 所需的容量。 ray status 显示集群的 CPU 和 GPU 资源。 如需覆盖默认 SLO 设置 ，在启动前为 API 和所有 Ray 节点设置相应环境变量。独立服务使用各自的 Ray 实例和共享内存目录。停止前台服务会断开其 Ray driver；已有 Ray 集群需单独管理。"
        },
        "memory": {
          "id": "memory",
          "label": "内存与KV Cache",
          "group": "group-1",
          "html": "\u003ch1 id=\"内存与-kv-cache\">内存与 KV Cache\u003ca class=\"headerlink\" href=\"#/zh/memory#内存与-kv-cache\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon 分别缓存模型权重和请求的 KV 状态，因此可以在保留未完成请求状态的同时切换模型。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>区域\u003c/th>\n\u003cth>内容\u003c/th>\n\u003cth>主要配置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>CPU 权重缓存\u003c/td>\n\u003ctd>节点内 Worker 共享的模型权重\u003c/td>\n\u003ctd>\u003ccode>model_cache_size_gb\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CPU KV 缓存\u003c/td>\n\u003ctd>执行步骤之间保存的请求状态\u003c/td>\n\u003ctd>\u003ccode>cpu_num_slabs\u003c/code> × \u003ccode>cpu_slab_size_bytes\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GPU KV 预算\u003c/td>\n\u003ctd>容量估算中扣除当前和预取权重后的空间\u003c/td>\n\u003ctd>\u003ccode>memory_utilization\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>QuickLoader GPU arena\u003c/td>\n\u003ctd>权重与 KV 的分配空间，在 QuickLoader 首次加载模型时分配\u003c/td>\n\u003ctd>\u003ccode>AEGAEON_ARENA_FRACTION\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>设置这些预算时，还需为 Ray、tokenizer、其他映射文件及临时张量留出余量。GB/GiB 配置以 \u003ccode>1024^3\u003c/code> 字节计。\u003c/p>\n\u003ch2 id=\"权重缓存\">权重缓存\u003ca class=\"headerlink\" href=\"#/zh/memory#权重缓存\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>model_cache_size_gb\u003c/code> 大于 0 时指定固定的 CPU 权重缓存预算；为 0 时根据启动模型估算，未加载启动模型时使用 20 GiB。部署新模型时，可以驱逐没有活跃请求的模型以腾出空间。\u003c/p>\n\u003ch2 id=\"kv-缓存\">KV 缓存\u003ca class=\"headerlink\" href=\"#/zh/memory#kv-缓存\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>BlockManager 分配请求的 KV block，并协调 CPU/GPU 搬运。P/D 模式下，Prefill 与 Decode 通过节点共享的 CPU KV 缓存交换请求状态。\u003ca href=\"#/zh/work-stealing\">Decode Work Stealing\u003c/a> 也通过这份缓存在 Decode 引擎之间转移 batch 的归属。\u003c/p>\n\u003ch2 id=\"共享内存\">共享内存\u003ca class=\"headerlink\" href=\"#/zh/memory#共享内存\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>CPU 缓存使用共享的页锁定主机内存，预算必须同时满足可用主机内存、承载缓存文件的文件系统容量（默认 \u003ccode>/dev/shm\u003c/code>）以及服务或容器的 memlock 限制。独立服务需要使用不同的共享内存目录，启动时通过 \u003ccode>AEGAEON_SHM_DIR\u003c/code> 选择。\u003c/p>\n\u003cp>预算字段见\u003ca href=\"#/zh/configuration\">配置参考\u003c/a>，分配错误见\u003ca href=\"#/zh/troubleshooting\">故障排查\u003c/a>。\u003c/p>",
          "headings": [
            {
              "id": "权重缓存",
              "title": "权重缓存",
              "level": 2
            },
            {
              "id": "kv-缓存",
              "title": "KV 缓存",
              "level": 2
            },
            {
              "id": "共享内存",
              "title": "共享内存",
              "level": 2
            }
          ],
          "text": "内存与 KV Cache ¶ Aegaeon 分别缓存模型权重和请求的 KV 状态，因此可以在保留未完成请求状态的同时切换模型。 区域 内容 主要配置 CPU 权重缓存 节点内 Worker 共享的模型权重 model_cache_size_gb CPU KV 缓存 执行步骤之间保存的请求状态 cpu_num_slabs × cpu_slab_size_bytes GPU KV 预算 容量估算中扣除当前和预取权重后的空间 memory_utilization QuickLoader GPU arena 权重与 KV 的分配空间，在 QuickLoader 首次加载模型时分配 AEGAEON_ARENA_FRACTION 设置这些预算时，还需为 Ray、tokenizer、其他映射文件及临时张量留出余量。GB/GiB 配置以 1024^3 字节计。 权重缓存 ¶ model_cache_size_gb 大于 0 时指定固定的 CPU 权重缓存预算；为 0 时根据启动模型估算，未加载启动模型时使用 20 GiB。部署新模型时，可以驱逐没有活跃请求的模型以腾出空间。 KV 缓存 ¶ BlockManager 分配请求的 KV block，并协调 CPU/GPU 搬运。P/D 模式下，Prefill 与 Decode 通过节点共享的 CPU KV 缓存交换请求状态。 Decode Work Stealing 也通过这份缓存在 Decode 引擎之间转移 batch 的归属。 共享内存 ¶ CPU 缓存使用共享的页锁定主机内存，预算必须同时满足可用主机内存、承载缓存文件的文件系统容量（默认 /dev/shm ）以及服务或容器的 memlock 限制。独立服务需要使用不同的共享内存目录，启动时通过 AEGAEON_SHM_DIR 选择。 预算字段见 配置参考 ，分配错误见 故障排查 。"
        },
        "work-stealing": {
          "id": "work-stealing",
          "label": "Decode Work Stealing",
          "group": "group-1",
          "html": "\u003ch1 id=\"decode-work-stealing\">Decode Work Stealing\u003ca class=\"headerlink\" href=\"#/zh/work-stealing#decode-work-stealing\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Work Stealing 在同一个 Controller 内均衡 Decode batch，默认关闭，需要至少两个 Decode 引擎才能转移任务。\u003c/p>\n\u003ch2 id=\"配置\">配置\u003ca class=\"headerlink\" href=\"#/zh/work-stealing#配置\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nt\">server\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">0\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_prefill_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">1\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_decode_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">2\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">decode_work_stealing\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">true\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">decode_work_stealing_min_batch_gap\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">2\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"转移规则\">转移规则\u003ca class=\"headerlink\" href=\"#/zh/work-stealing#转移规则\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>一轮调度结束后，供出方可以向队列为空的引擎转移一个完整的等待 batch，但不能转移队首 batch。候选 batch 没有正在执行的迭代或待合入的请求，KV 状态位于 CPU。\u003c/p>\n\u003cp>转移时，两端 batch 数量差必须达到配置值，且该值至少为 2。系统优先选择已驻留相同模型的接收方，以减少模型切换。\u003c/p>\n\u003cp>接收方从节点共享的 CPU KV 缓存恢复 batch。转移限于同一节点内，并沿用现有的 Decode 配额策略。\u003c/p>\n\u003ch2 id=\"监控\">监控\u003ca class=\"headerlink\" href=\"#/zh/work-stealing#监控\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>GET /v1/aegaeon/runtime\u003c/code> 中，\u003ccode>work_stealing\u003c/code> 提供转移计数，\u003ccode>decode_load\u003c/code> 提供各引擎的工作量和队列指标。接口用法见\u003ca href=\"#/zh/observability\">日志与监控\u003c/a>。\u003c/p>",

          "text": "Decode Work Stealing ¶ Work Stealing 在同一个 Controller 内均衡 Decode batch，默认关闭，需要至少两个 Decode 引擎才能转移任务。 配置 ¶ server : num_engines : 0 num_prefill_engines : 1 num_decode_engines : 2 decode_work_stealing : true decode_work_stealing_min_batch_gap : 2 转移规则 ¶ 一轮调度结束后，供出方可以向队列为空的引擎转移一个完整的等待 batch，但不能转移队首 batch。候选 batch 没有正在执行的迭代或待合入的请求，KV 状态位于 CPU。 转移时，两端 batch 数量差必须达到配置值，且该值至少为 2。系统优先选择已驻留相同模型的接收方，以减少模型切换。 接收方从节点共享的 CPU KV 缓存恢复 batch。转移限于同一节点内，并沿用现有的 Decode 配额策略。 监控 ¶ GET /v1/aegaeon/runtime 中， work_stealing 提供转移计数， decode_load 提供各引擎的工作量和队列指标。接口用法见 日志与监控 。"
        },
        "cuda-graphs": {
          "id": "cuda-graphs",
          "label": "CUDA Graph与Foundry",
          "group": "group-1",
          "html": "\u003ch1 id=\"cuda-graph\">CUDA Graph\u003ca class=\"headerlink\" href=\"#/zh/cuda-graphs#cuda-graph\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>可选的 CUDA Graph 集成使用仓库锁定的 \u003ca href=\"https://github.com/asceticism-pku/foundry\">Foundry fork\u003c/a>捕获和恢复 Decode 执行，以减少 CPU 提交开销。该功能默认关闭，支持 P/D 模式下 TP=1 的 Decode Worker。Prefill 和 Simple Worker 使用 eager 执行。\u003c/p>\n\u003ch2 id=\"foundry-安装\">Foundry 安装\u003ca class=\"headerlink\" href=\"#/zh/cuda-graphs#foundry-安装\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Foundry 需要单独安装在 Aegaeon 所在的环境中。从仓库根目录执行：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>git\u003cspan class=\"w\"> \u003c/span>submodule\u003cspan class=\"w\"> \u003c/span>update\u003cspan class=\"w\"> \u003c/span>--init\u003cspan class=\"w\"> \u003c/span>--recursive\u003cspan class=\"w\"> \u003c/span>foundry\nconda\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>-c\u003cspan class=\"w\"> \u003c/span>conda-forge\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'boost-cpp&gt;=1.83'\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'boost&gt;=1.83'\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'cmake&gt;=4.0'\u003c/span>\u003cspan class=\"w\"> \u003c/span>ninja\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">LD_LIBRARY_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CONDA_PREFIX\u003c/span>\u003cspan class=\"s2\">/lib\u003c/span>\u003cspan class=\"si\">${\u003c/span>\u003cspan class=\"nv\">LD_LIBRARY_PATH\u003c/span>\u003cspan class=\"p\">:+:\u003c/span>\u003cspan class=\"nv\">$LD_LIBRARY_PATH\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\npython\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--no-build-isolation\u003cspan class=\"w\"> \u003c/span>-e\u003cspan class=\"w\"> \u003c/span>./foundry\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_FOUNDRY_HOOK_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"k\">$(\u003c/span>python\u003cspan class=\"w\"> \u003c/span>-c\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'from pathlib import Path; import foundry.ops; print(Path(foundry.ops.__file__).resolve().parent / \"libcuda_hook.so\")'\u003c/span>\u003cspan class=\"k\">)\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>每个 Decode 节点都需在 Worker 启动前安装 Foundry，并设置有效的 hook 和动态库绝对路径。动态库加载错误见\u003ca href=\"#/zh/troubleshooting\">故障排查\u003c/a>。\u003c/p>\n\u003ch2 id=\"图配置\">图配置\u003ca class=\"headerlink\" href=\"#/zh/cuda-graphs#图配置\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nt\">server\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">0\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_prefill_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">1\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_decode_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">1\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">tensor_parallel_size\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">1\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">cuda_graph\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"nt\">mode\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s\">'save'\u003c/span>\n\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"nt\">archive_dir\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">/srv/aegaeon-archives/qwen3\u003c/span>\n\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"nt\">batch_sizes\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p p-Indicator\">[\u003c/span>\u003cspan class=\"nv\">1\u003c/span>\u003cspan class=\"p p-Indicator\">]\u003c/span>\n\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"nt\">seq_len_buckets\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p p-Indicator\">[\u003c/span>\u003cspan class=\"nv\">4096\u003c/span>\u003cspan class=\"p p-Indicator\">]\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>SAVE 和 LOAD 目前都要求只配置一个最大序列长度桶。只有 batch size 与配置值精确匹配，且序列长度不超过桶上限的 Decode batch 才会回放 graph，其余 batch 使用 eager 执行。LOAD 需要完整存档和兼容的内存布局；存档或布局校验错误会中止加载。\u003c/p>\n\u003ch2 id=\"存档创建与复用\">存档创建与复用\u003ca class=\"headerlink\" href=\"#/zh/cuda-graphs#存档创建与复用\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>SAVE 在模型加载到 Decode Worker 时捕获配置的 graph，LOAD 从存档恢复。\u003ca href=\"#/zh/examples\">SAVE 和 LOAD 示例\u003c/a>提供完整配置。调整模型路径和预算后启动 SAVE：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--config\u003cspan class=\"w\"> \u003c/span>docs/zh/examples/foundry-save.yaml\u003cspan class=\"w\"> \u003c/span>--ray-address\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nb\">local\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>出现 \u003ccode>Application startup complete\u003c/code> 后，在另一终端发送请求，将模型加载到 Decode Worker 并捕获 graph：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>curl\u003cspan class=\"w\"> \u003c/span>-sS\u003cspan class=\"w\"> \u003c/span>http://127.0.0.1:8000/v1/chat/completions\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>-H\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'Content-Type: application/json'\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--data-binary\u003cspan class=\"w\"> \u003c/span>@docs/zh/examples/chat-request.json\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>多模型配置需为每个配置的模型发送请求。等待请求完成，并确认 Worker 日志出现 \u003ccode>captured ... Foundry decode graphs during model load\u003c/code>，再停止服务，以相同的模型、内存布局和存档目录启动 LOAD：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--config\u003cspan class=\"w\"> \u003c/span>docs/zh/examples/foundry-load.yaml\u003cspan class=\"w\"> \u003c/span>--ray-address\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nb\">local\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Worker 日志中的 \u003ccode>Foundry decode replay active\u003c/code> 表示正在执行 graph。更改权重、graph 尺寸、内存布局或运行时依赖后，需要重新生成存档。\u003c/p>",
