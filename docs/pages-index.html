          "text": "Memory and KV Cache ¶ Aegaeon caches model weights separately from request KV state, so it can switch models while preserving in-progress requests. Region Contents Main setting CPU weight cache Model weights shared by node Workers model_cache_size_gb CPU KV cache Request state between execution steps cpu_num_slabs × cpu_slab_size_bytes GPU KV budget Capacity estimate after subtracting active and prefetched weights memory_utilization QuickLoader GPU arena Space for weights and KV allocations, allocated when QuickLoader first loads a model AEGAEON_ARENA_FRACTION These budgets still need headroom for Ray, tokenizers, other mapped files, and temporary tensors. Settings expressed in GB/GiB use 1024^3 bytes. Weight cache ¶ A positive model_cache_size_gb sets a fixed CPU weight-cache budget. With zero, Aegaeon estimates the budget from startup models, or uses 20 GiB if none are loaded at startup. Deployment can evict models with no active requests to make room for another model. KV cache ¶ BlockManager allocates request KV blocks and coordinates CPU/GPU transfers. In P/D mode, Prefill and Decode exchange request state through the node's shared CPU KV cache. Decode Work Stealing uses that same cache when transferring batch ownership between Decode engines. Shared memory ¶ CPU caches use shared, pinned host memory, so their budgets must fit both available host memory and the backing filesystem ( /dev/shm by default), with sufficient service or container memlock limits. Independent services need separate shared-memory directories; AEGAEON_SHM_DIR selects the directory at startup. Choose budgets in the configuration reference . For allocation errors, see Troubleshooting ."
        },
        "work-stealing": {
          "id": "work-stealing",
          "label": "Decode Work Stealing",
          "group": "group-1",
          "html": "\u003ch1 id=\"decode-work-stealing\">Decode Work Stealing\u003ca class=\"headerlink\" href=\"#/en/work-stealing#decode-work-stealing\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Work Stealing balances Decode batches within one Controller. It is disabled by default and needs at least two Decode engines to transfer work.\u003c/p>\n\u003ch2 id=\"configuration\">Configuration\u003ca class=\"headerlink\" href=\"#/en/work-stealing#configuration\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nt\">server\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">0\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_prefill_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">1\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_decode_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">2\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">decode_work_stealing\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">true\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">decode_work_stealing_min_batch_gap\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">2\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"transfer-rules\">Transfer rules\u003ca class=\"headerlink\" href=\"#/en/work-stealing#transfer-rules\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>After a scheduling round, a donor can transfer one complete waiting batch, excluding its queue head, to an engine with an empty queue. The batch has no active iteration or pending admissions, and its KV state is on CPU.\u003c/p>\n\u003cp>The transfer requires the configured batch-count gap, which is at least 2. A receiver whose resident model matches the batch is preferred to reduce switching.\u003c/p>\n\u003cp>The receiver resumes the batch from the node's shared CPU KV cache. Transfers remain within that node and use the existing Decode quota policy.\u003c/p>\n\u003ch2 id=\"monitoring\">Monitoring\u003ca class=\"headerlink\" href=\"#/en/work-stealing#monitoring\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>GET /v1/aegaeon/runtime\u003c/code> exposes \u003ccode>work_stealing\u003c/code> transfer counters and \u003ccode>decode_load\u003c/code> per-engine work and queue metrics. See \u003ca href=\"#/en/observability\">Monitoring\u003c/a> for runtime access.\u003c/p>",
          "headings": [
            {
              "id": "configuration",
              "title": "Configuration",
              "level": 2
            },
            {
              "id": "transfer-rules",
              "title": "Transfer rules",
              "level": 2
            },
            {
              "id": "monitoring",
              "title": "Monitoring",
              "level": 2
            }
          ],
          "text": "Decode Work Stealing ¶ Work Stealing balances Decode batches within one Controller. It is disabled by default and needs at least two Decode engines to transfer work. Configuration ¶ server : num_engines : 0 num_prefill_engines : 1 num_decode_engines : 2 decode_work_stealing : true decode_work_stealing_min_batch_gap : 2 Transfer rules ¶ After a scheduling round, a donor can transfer one complete waiting batch, excluding its queue head, to an engine with an empty queue. The batch has no active iteration or pending admissions, and its KV state is on CPU. The transfer requires the configured batch-count gap, which is at least 2. A receiver whose resident model matches the batch is preferred to reduce switching. The receiver resumes the batch from the node's shared CPU KV cache. Transfers remain within that node and use the existing Decode quota policy. Monitoring ¶ GET /v1/aegaeon/runtime exposes work_stealing transfer counters and decode_load per-engine work and queue metrics. See Monitoring for runtime access."
        },
        "cuda-graphs": {
          "id": "cuda-graphs",
          "label": "CUDA Graphs and Foundry",
          "group": "group-1",
          "html": "\u003ch1 id=\"cuda-graphs\">CUDA Graphs\u003ca class=\"headerlink\" href=\"#/en/cuda-graphs#cuda-graphs\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>The optional CUDA Graph integration uses the repository's pinned \u003ca href=\"https://github.com/asceticism-pku/foundry\">Foundry fork\u003c/a> to capture and restore Decode execution with less CPU launch overhead. It is disabled by default and supports P/D Decode Workers with TP=1. Prefill and Simple Workers use eager execution.\u003c/p>\n\u003ch2 id=\"foundry-installation\">Foundry installation\u003ca class=\"headerlink\" href=\"#/en/cuda-graphs#foundry-installation\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Foundry is installed separately in the same environment as Aegaeon. From the repository root:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>git\u003cspan class=\"w\"> \u003c/span>submodule\u003cspan class=\"w\"> \u003c/span>update\u003cspan class=\"w\"> \u003c/span>--init\u003cspan class=\"w\"> \u003c/span>--recursive\u003cspan class=\"w\"> \u003c/span>foundry\nconda\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>-c\u003cspan class=\"w\"> \u003c/span>conda-forge\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'boost-cpp&gt;=1.83'\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'boost&gt;=1.83'\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'cmake&gt;=4.0'\u003c/span>\u003cspan class=\"w\"> \u003c/span>ninja\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">LD_LIBRARY_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CONDA_PREFIX\u003c/span>\u003cspan class=\"s2\">/lib\u003c/span>\u003cspan class=\"si\">${\u003c/span>\u003cspan class=\"nv\">LD_LIBRARY_PATH\u003c/span>\u003cspan class=\"p\">:+:\u003c/span>\u003cspan class=\"nv\">$LD_LIBRARY_PATH\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\npython\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--no-build-isolation\u003cspan class=\"w\"> \u003c/span>-e\u003cspan class=\"w\"> \u003c/span>./foundry\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_FOUNDRY_HOOK_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"k\">$(\u003c/span>python\u003cspan class=\"w\"> \u003c/span>-c\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'from pathlib import Path; import foundry.ops; print(Path(foundry.ops.__file__).resolve().parent / \"libcuda_hook.so\")'\u003c/span>\u003cspan class=\"k\">)\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Each Decode node needs Foundry and valid absolute hook/library paths before its Workers start. For library loading errors, see \u003ca href=\"#/en/troubleshooting\">Troubleshooting\u003c/a>.\u003c/p>\n\u003ch2 id=\"graph-configuration\">Graph configuration\u003ca class=\"headerlink\" href=\"#/en/cuda-graphs#graph-configuration\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nt\">server\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">0\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_prefill_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">1\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">num_decode_engines\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">1\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">tensor_parallel_size\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">1\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">cuda_graph\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"nt\">mode\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s\">'save'\u003c/span>\n\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"nt\">archive_dir\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">/srv/aegaeon-archives/qwen3\u003c/span>\n\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"nt\">batch_sizes\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p p-Indicator\">[\u003c/span>\u003cspan class=\"nv\">1\u003c/span>\u003cspan class=\"p p-Indicator\">]\u003c/span>\n\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"nt\">seq_len_buckets\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"p p-Indicator\">[\u003c/span>\u003cspan class=\"nv\">4096\u003c/span>\u003cspan class=\"p p-Indicator\">]\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>SAVE and LOAD currently require one maximum sequence-length bucket. A Decode batch replays a graph only if its size exactly matches a configured batch size and its sequence length fits within that bucket. Other batches use eager execution. LOAD requires complete archives with a compatible memory layout; archive or layout validation errors stop loading.\u003c/p>\n\u003ch2 id=\"archive-creation-and-reuse\">Archive creation and reuse\u003ca class=\"headerlink\" href=\"#/en/cuda-graphs#archive-creation-and-reuse\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>SAVE captures the configured graphs when a model is loaded onto a Decode Worker; LOAD restores them from the archive. The \u003ca href=\"#/en/examples\">SAVE and LOAD examples\u003c/a> provide complete configurations. After adjusting model paths and budgets, start SAVE:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--config\u003cspan class=\"w\"> \u003c/span>docs/en/examples/foundry-save.yaml\u003cspan class=\"w\"> \u003c/span>--ray-address\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nb\">local\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>After \u003ccode>Application startup complete\u003c/code>, send a request from another terminal to load the model onto the Decode Worker and capture its graphs:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>curl\u003cspan class=\"w\"> \u003c/span>-sS\u003cspan class=\"w\"> \u003c/span>http://127.0.0.1:8000/v1/chat/completions\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>-H\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'Content-Type: application/json'\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--data-binary\u003cspan class=\"w\"> \u003c/span>@docs/en/examples/chat-request.json\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>For multiple models, send a request for each configured model. Wait for the request to finish and the Worker log \u003ccode>captured ... Foundry decode graphs during model load\u003c/code>. Then stop the service and start LOAD with the same model, memory layout, and archive directory:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--config\u003cspan class=\"w\"> \u003c/span>docs/en/examples/foundry-load.yaml\u003cspan class=\"w\"> \u003c/span>--ray-address\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nb\">local\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>\u003ccode>Foundry decode replay active\u003c/code> identifies graph execution in Worker logs. Changes to model weights, graph sizes, memory layout, or runtime dependencies require fresh archives.\u003c/p>",

          "text": "CUDA Graphs ¶ The optional CUDA Graph integration uses the repository's pinned Foundry fork to capture and restore Decode execution with less CPU launch overhead. It is disabled by default and supports P/D Decode Workers with TP=1. Prefill and Simple Workers use eager execution. Foundry installation ¶ Foundry is installed separately in the same environment as Aegaeon. From the repository root: git submodule update --init --recursive foundry conda install -c conda-forge 'boost-cpp>=1.83' 'boost>=1.83' 'cmake>=4.0' ninja export LD_LIBRARY_PATH = \" $CONDA_PREFIX /lib ${ LD_LIBRARY_PATH :+: $LD_LIBRARY_PATH } \" python -m pip install --no-build-isolation -e ./foundry export AEGAEON_FOUNDRY_HOOK_PATH = \" $( python -c 'from pathlib import Path; import foundry.ops; print(Path(foundry.ops.__file__).resolve().parent / \"libcuda_hook.so\")' ) \" Each Decode node needs Foundry and valid absolute hook/library paths before its Workers start. For library loading errors, see Troubleshooting . Graph configuration ¶ server : num_engines : 0 num_prefill_engines : 1 num_decode_engines : 1 tensor_parallel_size : 1 cuda_graph : mode : 'save' archive_dir : /srv/aegaeon-archives/qwen3 batch_sizes : [ 1 ] seq_len_buckets : [ 4096 ] SAVE and LOAD currently require one maximum sequence-length bucket. A Decode batch replays a graph only if its size exactly matches a configured batch size and its sequence length fits within that bucket. Other batches use eager execution. LOAD requires complete archives with a compatible memory layout; archive or layout validation errors stop loading. Archive creation and reuse ¶ SAVE captures the configured graphs when a model is loaded onto a Decode Worker; LOAD restores them from the archive. The SAVE and LOAD examples provide complete configurations. After adjusting model paths and budgets, start SAVE: aegaeon start --config docs/en/examples/foundry-save.yaml --ray-address local After Application startup complete , send a request from another terminal to load the model onto the Decode Worker and capture its graphs: curl -sS http://127.0.0.1:8000/v1/chat/completions \\ -H 'Content-Type: application/json' \\ --data-binary @docs/en/examples/chat-request.json For multiple models, send a request for each configured model. Wait for the request to finish and the Worker log captured ... Foundry decode graphs during model load . Then stop the service and start LOAD with the same model, memory layout, and archive directory: aegaeon start --config docs/en/examples/foundry-load.yaml --ray-address local Foundry decode replay active identifies graph execution in Worker logs. Changes to model weights, graph sizes, memory layout, or runtime dependencies require fresh archives."
        },
        "observability": {
          "id": "observability",
          "label": "Logs and Monitoring",
          "group": "group-1",
          "html": "\u003ch1 id=\"logs-and-monitoring\">Logs and Monitoring\u003ca class=\"headerlink\" href=\"#/en/observability#logs-and-monitoring\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"logs\">Logs\u003ca class=\"headerlink\" href=\"#/en/observability#logs\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Aegaeon writes INFO logs to stdout and to \u003ccode>AEGAEON_LOG_FILE\u003c/code>, which defaults to \u003ccode>output.log\u003c/code>. You can also set an absolute log path before startup:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>mkdir\u003cspan class=\"w\"> \u003c/span>-p\u003cspan class=\"w\"> \u003c/span>logs\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_LOG_FILE\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$PWD\u003c/span>\u003cspan class=\"s2\">/logs/server.log\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>The path is forwarded to Ray actors, so its parent directory must exist on every node. Ray actor stdout and stderr are also available in the Ray session log directory.\u003c/p>\n\u003ch2 id=\"runtime-interfaces\">Runtime interfaces\u003ca class=\"headerlink\" href=\"#/en/observability#runtime-interfaces\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Endpoint\u003c/th>\n\u003cth>Contents\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>/health\u003c/code>\u003c/td>\n\u003ctd>API liveness\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/v1/models\u003c/code>\u003c/td>\n\u003ctd>The service's deployed model list\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/v1/aegaeon/runtime\u003c/code>\u003c/td>\n\u003ctd>Nodes, engines, replicas, routing, caches, and Decode load\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/v1/aegaeon/events\u003c/code>\u003c/td>\n\u003ctd>Engine-state snapshots and model-switch events over SSE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/v1/aegaeon/metrics\u003c/code>\u003c/td>\n\u003ctd>Per-model request and generated-token rates, counts, and configured limits\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>curl\u003cspan class=\"w\"> \u003c/span>-sS\u003cspan class=\"w\"> \u003c/span>http://127.0.0.1:8000/v1/aegaeon/runtime\ncurl\u003cspan class=\"w\"> \u003c/span>-N\u003cspan class=\"w\"> \u003c/span>http://127.0.0.1:8000/v1/aegaeon/events\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Use replica state \u003ccode>ready\u003c/code> in the runtime snapshot to confirm model availability. Request rates and generated-token rates are per-model averages over a sliding 60-second window. Set \u003ccode>AEGAEON_MAX_REQUESTS_PER_SECOND\u003c/code> and \u003ccode>AEGAEON_MAX_TOKENS_PER_SECOND\u003c/code> before API startup to limit those rates; exceeding a limit returns HTTP 429.\u003c/p>",
          "headings": [
            {
              "id": "logs",
              "title": "Logs",
              "level": 2
            },
            {
              "id": "runtime-interfaces",
              "title": "Runtime interfaces",
              "level": 2
            }
          ],
          "text": "Logs and Monitoring ¶ Logs ¶ Aegaeon writes INFO logs to stdout and to AEGAEON_LOG_FILE , which defaults to output.log . You can also set an absolute log path before startup: mkdir -p logs export AEGAEON_LOG_FILE = \" $PWD /logs/server.log\" The path is forwarded to Ray actors, so its parent directory must exist on every node. Ray actor stdout and stderr are also available in the Ray session log directory. Runtime interfaces ¶ Endpoint Contents /health API liveness /v1/models The service's deployed model list /v1/aegaeon/runtime Nodes, engines, replicas, routing, caches, and Decode load /v1/aegaeon/events Engine-state snapshots and model-switch events over SSE /v1/aegaeon/metrics Per-model request and generated-token rates, counts, and configured limits curl -sS http://127.0.0.1:8000/v1/aegaeon/runtime curl -N http://127.0.0.1:8000/v1/aegaeon/events Use replica state ready in the runtime snapshot to confirm model availability. Request rates and generated-token rates are per-model averages over a sliding 60-second window. Set AEGAEON_MAX_REQUESTS_PER_SECOND and AEGAEON_MAX_TOKENS_PER_SECOND before API startup to limit those rates; exceeding a limit returns HTTP 429."
        },
        "troubleshooting": {
          "id": "troubleshooting",
          "label": "Troubleshooting",
          "group": "group-1",
          "html": "\u003ch1 id=\"troubleshooting\">Troubleshooting\u003ca class=\"headerlink\" href=\"#/en/troubleshooting#troubleshooting\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Start with \u003ccode>aegaeon doctor --check-cuda\u003c/code>, the service log, and \u003ccode>ray status\u003c/code>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Symptom\u003c/th>\n\u003cth>Check\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Dependency or extension import failure\u003c/td>\n\u003ctd>Activate the installation environment and rebuild extensions after changing Torch/CUDA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ray actors wait for resources\u003c/td>\n\u003ctd>Match node resources, visible GPUs, and \u003ccode>worker_num_cpus\u003c/code> to the topology\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CPU cache allocation fails\u003c/td>\n\u003ctd>Check shared memory and reduce cache/slab budgets\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GPU OOM\u003c/td>\n\u003ctd>Reduce batch/context sizes and leave room for weights, prefetch, and workspaces\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Missing profiles\u003c/td>\n\u003ctd>Match model/device aliases and collect \u003ca href=\"#/en/profiling\">profiles\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP 400 / 422\u003c/td>\n\u003ctd>Check model names, \u003ca href=\"#/en/generation\">generation values\u003c/a>, and \u003ccode>/docs\u003c/code> schemas\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP 503\u003c/td>\n\u003ctd>Check READY replicas in the runtime snapshot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP 507\u003c/td>\n\u003ctd>Check node cache capacity and deployment results\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"host-registration-and-memlock\">Host registration and memlock\u003ca class=\"headerlink\" href=\"#/en/troubleshooting#host-registration-and-memlock\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>For pinned-memory or host-registration errors:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>df\u003cspan class=\"w\"> \u003c/span>-h\u003cspan class=\"w\"> \u003c/span>/dev/shm\n\u003cspan class=\"nb\">ulimit\u003c/span>\u003cspan class=\"w\"> \u003c/span>-Sl\n\u003cspan class=\"nb\">ulimit\u003c/span>\u003cspan class=\"w\"> \u003c/span>-Hl\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Adjust service/container shared-memory capacity and memlock limits, then restart the service.\u003c/p>\n\u003ch2 id=\"foundry\">Foundry\u003ca class=\"headerlink\" href=\"#/en/troubleshooting#foundry\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>Set \u003ccode>AEGAEON_FOUNDRY_HOOK_PATH\u003c/code> to the installed \u003ccode>libcuda_hook.so\u003c/code> before startup.\u003c/li>\n\u003cli>Add Conda's \u003ccode>lib\u003c/code> directory to \u003ccode>LD_LIBRARY_PATH\u003c/code> for Boost and \u003ccode>libstdc++\u003c/code>.\u003c/li>\n\u003cli>For missing CUDA driver symbols, use a matching library from NVIDIA's \u003ca href=\"https://docs.nvidia.com/deploy/cuda-compatibility/forward-compatibility.html\">forward-compatibility packages\u003c/a>, set \u003ccode>AEGAEON_CUDA_COMPAT_PATH\u003c/code>, and prepend it to \u003ccode>LD_LIBRARY_PATH\u003c/code>.\u003c/li>\n\u003cli>Use one \u003ccode>seq_len_buckets\u003c/code> entry and matching SAVE/LOAD configurations. Recreate archives after runtime or layout changes.\u003c/li>\n\u003c/ul>\n\u003cp>When reporting a problem, include the command, configuration, dependency versions, and traceback.\u003c/p>",
          "headings": [
            {
              "id": "host-registration-and-memlock",
              "title": "Host registration and memlock",
              "level": 2
            },
            {
              "id": "foundry",
              "title": "Foundry",
              "level": 2
            }
          ],
          "text": "Troubleshooting ¶ Start with aegaeon doctor --check-cuda , the service log, and ray status . Symptom Check Dependency or extension import failure Activate the installation environment and rebuild extensions after changing Torch/CUDA Ray actors wait for resources Match node resources, visible GPUs, and worker_num_cpus to the topology CPU cache allocation fails Check shared memory and reduce cache/slab budgets GPU OOM Reduce batch/context sizes and leave room for weights, prefetch, and workspaces Missing profiles Match model/device aliases and collect profiles HTTP 400 / 422 Check model names, generation values , and /docs schemas HTTP 503 Check READY replicas in the runtime snapshot HTTP 507 Check node cache capacity and deployment results Host registration and memlock ¶ For pinned-memory or host-registration errors: df -h /dev/shm ulimit -Sl ulimit -Hl Adjust service/container shared-memory capacity and memlock limits, then restart the service. Foundry ¶ Set AEGAEON_FOUNDRY_HOOK_PATH to the installed libcuda_hook.so before startup. Add Conda's lib directory to LD_LIBRARY_PATH for Boost and libstdc++ . For missing CUDA driver symbols, use a matching library from NVIDIA's forward-compatibility packages , set AEGAEON_CUDA_COMPAT_PATH , and prepend it to LD_LIBRARY_PATH . Use one seq_len_buckets entry and matching SAVE/LOAD configurations. Recreate archives after runtime or layout changes. When reporting a problem, include the command, configuration, dependency versions, and traceback."
        },
        "examples": {
          "id": "examples",
          "label": "Configuration Examples",
          "group": "group-1",
          "html": "\u003ch1 id=\"configuration-examples\">Configuration Examples\u003ca class=\"headerlink\" href=\"#/en/examples#configuration-examples\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>These examples cover common service topologies. Model paths, GPU assignments, profile aliases, and memory budgets depend on the deployment environment.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>File\u003c/th>\n\u003cth>Topology\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>simple.yaml\u003c/td>\n\u003ctd>One node, 1 Simple Engine, TP=1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pd.yaml\u003c/td>\n\u003ctd>One node, 1P+1D, TP=1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>multi-node.yaml\u003c/td>\n\u003ctd>Two physical nodes, 1 Simple Engine per node\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>dynamic.yaml\u003c/td>\n\u003ctd>Empty startup followed by explicit deployment\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>work-stealing.yaml\u003c/td>\n\u003ctd>One node, 1P+2D\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>foundry-save.yaml / foundry-load.yaml\u003c/td>\n\u003ctd>P/D Decode, batch=1, one 4096 bucket; requires Foundry and the hook; SAVE creates archives, LOAD requires complete archives\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>chat-request.json\u003c/td>\n\u003ctd>Minimal nonstreaming greedy request\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>curl\u003cspan class=\"w\"> \u003c/span>-sS\u003cspan class=\"w\"> \u003c/span>http://127.0.0.1:8000/v1/chat/completions\u003cspan class=\"w\"> \u003c/span>-H\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'Content-Type: application/json'\u003c/span>\u003cspan class=\"w\"> \u003c/span>--data-binary\u003cspan class=\"w\"> \u003c/span>@docs/en/examples/chat-request.json\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Concurrent services need disjoint GPU assignments and separate shared-memory directories. SAVE and LOAD archives require matching layouts, models, and dependencies.\u003c/p>",
          "headings": [],
          "text": "Configuration Examples ¶ These examples cover common service topologies. Model paths, GPU assignments, profile aliases, and memory budgets depend on the deployment environment. File Topology simple.yaml One node, 1 Simple Engine, TP=1 pd.yaml One node, 1P+1D, TP=1 multi-node.yaml Two physical nodes, 1 Simple Engine per node dynamic.yaml Empty startup followed by explicit deployment work-stealing.yaml One node, 1P+2D foundry-save.yaml / foundry-load.yaml P/D Decode, batch=1, one 4096 bucket; requires Foundry and the hook; SAVE creates archives, LOAD requires complete archives chat-request.json Minimal nonstreaming greedy request curl -sS http://127.0.0.1:8000/v1/chat/completions -H 'Content-Type: application/json' --data-binary @docs/en/examples/chat-request.json Concurrent services need disjoint GPU assignments and separate shared-memory directories. SAVE and LOAD archives require matching layouts, models, and dependencies."
        },
        "architecture": {
          "id": "architecture",
          "label": "Architecture",
          "group": "group-2",
          "html": "\u003ch1 id=\"system-architecture\">System Architecture\u003ca class=\"headerlink\" href=\"#/en/architecture#system-architecture\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cfigure class=\"diagram\">\u003csvg viewBox=\"0 0 600 455\" role=\"img\" aria-label=\"Request routing, node control plane, and execution modes\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>\u003cmarker id=\"head\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\u003cpath d=\"M0 0 8 4 0 8\" fill=\"#a2accd\"/>\u003c/marker>\u003c/defs>\u003crect x=\"210\" y=\"10\" width=\"180\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"300.0\" y=\"35\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">FastAPI / LLMService\u003c/text>\u003ctext x=\"300.0\" y=\"53\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">API · Replica routing\u003c/text>\u003cpath d=\"M300 68 L300 96\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003crect x=\"210\" y=\"100\" width=\"180\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"300.0\" y=\"125\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">Controller\u003c/text>\u003ctext x=\"300.0\" y=\"143\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">Configured node control plane\u003c/text>\u003cpath d=\"M245 158 L145 194\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003cpath d=\"M355 158 L455 194\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003crect x=\"60\" y=\"198\" width=\"170\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"145.0\" y=\"223\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">Prefill → Decode\u003c/text>\u003ctext x=\"145.0\" y=\"241\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">P/D separation\u003c/text>\u003crect x=\"370\" y=\"198\" width=\"170\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"455.0\" y=\"223\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">Simple Engine\u003c/text>\u003ctext x=\"455.0\" y=\"241\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">Both stages in one engine\u003c/text>\u003cpath d=\"M145 256 L145 285\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003cpath d=\"M455 256 L455 285\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003crect x=\"60\" y=\"289\" width=\"170\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"145.0\" y=\"314\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">GPU Workers\u003c/text>\u003ctext x=\"145.0\" y=\"332\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">Forward · Per-worker GPU KV\u003c/text>\u003crect x=\"370\" y=\"289\" width=\"170\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"455.0\" y=\"314\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">GPU Workers\u003c/text>\u003ctext x=\"455.0\" y=\"332\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">Forward · Per-worker GPU KV\u003c/text>\u003crect x=\"205\" y=\"382\" width=\"190\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"300.0\" y=\"407\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">QuickCache / BlockManager\u003c/text>\u003ctext x=\"300.0\" y=\"425\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">Shared CPU weights and KV\u003c/text>\u003cpath d=\"M145 347 L235 380\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003cpath d=\"M455 347 L365 380\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003c/svg>\u003cfigcaption>Request routing, node control plane, and execution modes\u003c/figcaption>\u003c/figure>\n\n\u003cp>Simple and P/D are alternative execution modes. Each configured node has one Controller and shared CPU caches. Several configured nodes can share a physical host. Workers have separate GPU KV caches, coordinated by their node's BlockManager.\u003c/p>\n\u003ch2 id=\"components\">Components\u003ca class=\"headerlink\" href=\"#/en/architecture#components\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>API / LLMService:\u003c/strong> request formatting, replica placement, and routing.\u003c/li>\n\u003cli>\u003cstrong>Controller / Schedulers:\u003c/strong> node-local dispatch, batches, and model quotas.\u003c/li>\n\u003cli>\u003cstrong>StageEngine / Worker:\u003c/strong> GPU execution using vLLM models and kernels.\u003c/li>\n\u003cli>\u003cstrong>QuickCache / QuickLoader:\u003c/strong> shared CPU model weights and loading onto GPUs.\u003c/li>\n\u003cli>\u003cstrong>BlockManager:\u003c/strong> request KV state and CPU/GPU transfers.\u003c/li>\n\u003c/ul>\n\u003cp>A request is routed to a node with a READY replica of its model. In P/D mode, Prefill produces the first token and unfinished requests continue on a Decode engine. In Simple mode, the same engine handles both phases. The node's CPU KV cache preserves request state across model switches. See \u003ca href=\"#/en/scheduling\">Scheduling\u003c/a> and \u003ca href=\"#/en/memory\">Memory\u003c/a> for details.\u003c/p>",
          "headings": [
            {
              "id": "components",
              "title": "Components",
              "level": 2
            }
          ],
          "text": "System Architecture ¶ FastAPI / LLMService API · Replica routing Controller Configured node control plane Prefill → Decode P/D separation Simple Engine Both stages in one engine GPU Workers Forward · Per-worker GPU KV GPU Workers Forward · Per-worker GPU KV QuickCache / BlockManager Shared CPU weights and KV Request routing, node control plane, and execution modes Simple and P/D are alternative execution modes. Each configured node has one Controller and shared CPU caches. Several configured nodes can share a physical host. Workers have separate GPU KV caches, coordinated by their node's BlockManager. Components ¶ API / LLMService: request formatting, replica placement, and routing. Controller / Schedulers: node-local dispatch, batches, and model quotas. StageEngine / Worker: GPU execution using vLLM models and kernels. QuickCache / QuickLoader: shared CPU model weights and loading onto GPUs. BlockManager: request KV state and CPU/GPU transfers. A request is routed to a node with a READY replica of its model. In P/D mode, Prefill produces the first token and unfinished requests continue on a Decode engine. In Simple mode, the same engine handles both phases. The node's CPU KV cache preserves request state across model switches. See Scheduling and Memory for details."
        },
        "scheduling": {
          "id": "scheduling",
          "label": "Scheduling and SLOs",
          "group": "group-2",
          "html": "\u003ch1 id=\"scheduling-and-slos\">Scheduling and SLOs\u003ca class=\"headerlink\" href=\"#/en/scheduling#scheduling-and-slos\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon groups requests by model and switches models between batch turns. Decode time quotas use \u003ca href=\"#/en/profiling\">performance profiles\u003c/a> to balance switching overhead against token latency.\u003c/p>\n\u003cp>Simple mode schedules Prefill and Decode in one engine. P/D mode uses separate engine pools: Prefill dispatches by arrival order and queue load, while Decode schedules model batches with time quotas.\u003c/p>\n\u003ch2 id=\"slo-settings\">SLO settings\u003ca class=\"headerlink\" href=\"#/en/scheduling#slo-settings\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>TTFT and TPOT targets are expressed in seconds and read when the scheduling modules are imported. The API process and all Ray node environments need the same values before startup:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_TTFT_SLO\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">3\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_TPOT_SLO\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">0\u003c/span>.03\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Defaults are 10 seconds for TTFT and 0.1 seconds for TPOT.\u003c/p>\n\u003ch2 id=\"policy-scopes\">Policy scopes\u003ca class=\"headerlink\" href=\"#/en/scheduling#policy-scopes\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Policy\u003c/th>\n\u003cth>Scope\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>model_placement_policy\u003c/code>\u003c/td>\n\u003ctd>Selects replica nodes at deployment\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>request_routing_policy\u003c/code>\u003c/td>\n\u003ctd>Selects a READY node for a new request\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prefill/Decode scheduling\u003c/td>\n\u003ctd>Selects batches and model quotas within a node\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/en/work-stealing\">Decode Work Stealing\u003c/a>\u003c/td>\n\u003ctd>Balances waiting Decode batches within a node\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>For metric definitions and tools, see \u003ca href=\"#/en/benchmarking\">Benchmarking\u003c/a>.\u003c/p>",
          "headings": [
            {
              "id": "slo-settings",
              "title": "SLO settings",
              "level": 2
            },
            {
              "id": "policy-scopes",
              "title": "Policy scopes",
              "level": 2
            }
          ],
          "text": "Scheduling and SLOs ¶ Aegaeon groups requests by model and switches models between batch turns. Decode time quotas use performance profiles to balance switching overhead against token latency. Simple mode schedules Prefill and Decode in one engine. P/D mode uses separate engine pools: Prefill dispatches by arrival order and queue load, while Decode schedules model batches with time quotas. SLO settings ¶ TTFT and TPOT targets are expressed in seconds and read when the scheduling modules are imported. The API process and all Ray node environments need the same values before startup: export AEGAEON_TTFT_SLO = 3 export AEGAEON_TPOT_SLO = 0 .03 Defaults are 10 seconds for TTFT and 0.1 seconds for TPOT. Policy scopes ¶ Policy Scope model_placement_policy Selects replica nodes at deployment request_routing_policy Selects a READY node for a new request Prefill/Decode scheduling Selects batches and model quotas within a node Decode Work Stealing Balances waiting Decode batches within a node For metric definitions and tools, see Benchmarking ."
        },
        "benchmarking": {
          "id": "benchmarking",
          "label": "Benchmarking Guide",
          "group": "group-3",
          "html": "\u003ch1 id=\"benchmarking\">Benchmarking\u003ca class=\"headerlink\" href=\"#/en/benchmarking#benchmarking\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"metrics\">Metrics\u003ca class=\"headerlink\" href=\"#/en/benchmarking#metrics\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Metric\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>TTFT\u003c/td>\n\u003ctd>Request arrival to first token\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPOT\u003c/td>\n\u003ctd>Mean interval between output tokens after the first\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E2E\u003c/td>\n\u003ctd>Request arrival to completion\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Throughput\u003c/td>\n\u003ctd>Completed requests or generated tokens per second\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CV\u003c/td>\n\u003ctd>Population standard deviation divided by the mean\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Aegaeon's \u003ccode>qos\u003c/code> statistic uses a cumulative-time ratio based on TTFT and TPOT targets. The streaming demo below measures time to the first nonempty text chunk.\u003c/p>\n\u003ch2 id=\"tools\">Tools\u003ca class=\"headerlink\" href=\"#/en/benchmarking#tools\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>The API demo sends requests to an existing service. Run it from the repository root:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>benchmark/demo_api.py\u003cspan class=\"w\"> \u003c/span>--help\npython\u003cspan class=\"w\"> \u003c/span>benchmark/demo_api.py\u003cspan class=\"w\"> \u003c/span>--host\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">127\u003c/span>.0.0.1\u003cspan class=\"w\"> \u003c/span>--port\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">8000\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--model-config\u003cspan class=\"w\"> \u003c/span>/srv/aegaeon/config.yaml\u003cspan class=\"w\"> \u003c/span>--model\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tool\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>benchmark/work_stealing_gpu_smoke.py\u003c/code>\u003c/td>\n\u003ctd>Run a local 1P+2D Work Stealing workload\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>benchmark/compare_work_stealing_results.py\u003c/code>\u003c/td>\n\u003ctd>Compare saved Work Stealing results\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>benchmark/model_placement_gpu_smoke.py\u003c/code>\u003c/td>\n\u003ctd>Run local placement and routing workloads\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>benchmark/replay_workload.py\u003c/code>\u003c/td>\n\u003ctd>Replay CSV arrivals against an existing HTTP service\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tools/benchmark_foundry_three_model_latency.py\u003c/code>\u003c/td>\n\u003ctd>Replay a three-model CUDA Graph experiment from an existing run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sim/\u003c/code>\u003c/td>\n\u003ctd>CPU-only scheduling simulation; see \u003ccode>sim/README.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Each tool exposes \u003ccode>--help\u003c/code> for arguments. Use matching \u003ca href=\"#/en/profiling\">profiles\u003c/a> and distinguish startup, model switching, and steady-state measurements.\u003c/p>\n\u003cp>Replay a bundled trace with model aliases that are already deployed on the service:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>benchmark/replay_workload.py\u003cspan class=\"w\"> \u003c/span>--csv\u003cspan class=\"w\"> \u003c/span>workloads/synth-2-0.1-1.0-1.0.csv\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--host\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">127\u003c/span>.0.0.1\u003cspan class=\"w\"> \u003c/span>--port\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">8000\u003c/span>\u003cspan class=\"w\"> \u003c/span>--models\u003cspan class=\"w\"> \u003c/span>qwen2_5_7b\u003cspan class=\"w\"> \u003c/span>qwen2_1_5b\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>The three-model Foundry latency benchmark requires \u003ccode>--source-run /path/to/validated-run\u003c/code>.\nThat directory must contain a passing \u003ccode>report.json\u003c/code> with \u003ccode>archive_root\u003c/code> and a\n\u003ccode>multi-model-load.yaml\u003c/code> for Qwen3-4B, Qwen3.5-9B and Gemma-3-4B. Run with\n\u003ccode>--preflight-only\u003c/code> to check the source archives and local model paths before measuring.\u003c/p>\n\u003ch2 id=\"tuning\">Tuning\u003ca class=\"headerlink\" href=\"#/en/benchmarking#tuning\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>High TTFT can reflect queueing, loading, or limited Prefill capacity. Long Decode intervals can reflect model competition, transfers, or quota settings. Check these causes before adjusting engine counts and memory budgets. \u003ca href=\"#/en/work-stealing\">Work Stealing\u003c/a> addresses uneven Decode load; \u003ca href=\"#/en/cuda-graphs\">CUDA Graphs\u003c/a> reduce launch overhead.\u003c/p>",
          "headings": [
            {
              "id": "metrics",
              "title": "Metrics",
              "level": 2
            },
            {
              "id": "tools",
              "title": "Tools",
              "level": 2
            },
            {
              "id": "tuning",
              "title": "Tuning",
              "level": 2
            }
          ],
          "text": "Benchmarking ¶ Metrics ¶ Metric Meaning TTFT Request arrival to first token TPOT Mean interval between output tokens after the first E2E Request arrival to completion Throughput Completed requests or generated tokens per second CV Population standard deviation divided by the mean Aegaeon's qos statistic uses a cumulative-time ratio based on TTFT and TPOT targets. The streaming demo below measures time to the first nonempty text chunk. Tools ¶ The API demo sends requests to an existing service. Run it from the repository root: python benchmark/demo_api.py --help python benchmark/demo_api.py --host 127 .0.0.1 --port 8000 \\ --model-config /srv/aegaeon/config.yaml --model Qwen/Qwen3-4B Tool Purpose benchmark/work_stealing_gpu_smoke.py Run a local 1P+2D Work Stealing workload benchmark/compare_work_stealing_results.py Compare saved Work Stealing results benchmark/model_placement_gpu_smoke.py Run local placement and routing workloads benchmark/replay_workload.py Replay CSV arrivals against an existing HTTP service tools/benchmark_foundry_three_model_latency.py Replay a three-model CUDA Graph experiment from an existing run sim/ CPU-only scheduling simulation; see sim/README.md Each tool exposes --help for arguments. Use matching profiles and distinguish startup, model switching, and steady-state measurements. Replay a bundled trace with model aliases that are already deployed on the service: python benchmark/replay_workload.py --csv workloads/synth-2-0.1-1.0-1.0.csv \\ --host 127 .0.0.1 --port 8000 --models qwen2_5_7b qwen2_1_5b The three-model Foundry latency benchmark requires --source-run /path/to/validated-run . That directory must contain a passing report.json with archive_root and a multi-model-load.yaml for Qwen3-4B, Qwen3.5-9B and Gemma-3-4B. Run with --preflight-only to check the source archives and local model paths before measuring. Tuning ¶ High TTFT can reflect queueing, loading, or limited Prefill capacity. Long Decode intervals can reflect model competition, transfers, or quota settings. Check these causes before adjusting engine counts and memory budgets. Work Stealing addresses uneven Decode load; CUDA Graphs reduce launch overhead."
        },
        "profiling": {
          "id": "profiling",
          "label": "Profiling",
          "group": "group-3",
          "html": "\u003ch1 id=\"profiling\">Profiling\u003ca class=\"headerlink\" href=\"#/en/profiling#profiling\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon uses model/device latency profiles to estimate Prefill and Decode time. \u003ccode>AEGAEON_PROFILE_ROOT\u003c/code> overrides the profile root; otherwise Aegaeon uses bundled profiles when present, then the checkout's \u003ccode>profiles/\u003c/code> directory. Files follow this layout:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>profiles/Qwen/Qwen3-4B/A100-PCIE-40GB/i32b1.json\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"batch-collection\">Batch collection\u003ca class=\"headerlink\" href=\"#/en/profiling#batch-collection\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Run from the repository root:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_PROFILE_ROOT\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$PWD\u003c/span>\u003cspan class=\"s2\">/profiles\"\u003c/span>\n\u003cspan class=\"nv\">CUDA_VISIBLE_DEVICES\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">0\u003c/span>\u003cspan class=\"w\"> \u003c/span>python\u003cspan class=\"w\"> \u003c/span>profiles/do_profile.py\u003cspan class=\"w\"> \u003c/span>--model-config\u003cspan class=\"w\"> \u003c/span>/srv/aegaeon/config.yaml\u003cspan class=\"w\"> \u003c/span>--tp\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">1\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>The batch collector supports only \u003ccode>--tp 1\u003c/code> and uses eager bfloat16 execution with a requested context limit of 8192. It writes results below \u003ccode>AEGAEON_PROFILE_ROOT\u003c/code> and logs below \u003ccode>logs/\u003c/code>. You can also use the single-point command to choose other execution settings.\u003c/p>\n\u003ch2 id=\"single-point-collection\">Single-point collection\u003ca class=\"headerlink\" href=\"#/en/profiling#single-point-collection\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>For custom input lengths or context limits:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_PROFILE_ROOT\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$PWD\u003c/span>\u003cspan class=\"s2\">/profiles\"\u003c/span>\nmkdir\u003cspan class=\"w\"> \u003c/span>-p\u003cspan class=\"w\"> \u003c/span>profiles/Qwen/Qwen3-4B/A100-PCIE-40GB\n\u003cspan class=\"nv\">CUDA_VISIBLE_DEVICES\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">0\u003c/span>\u003cspan class=\"w\"> \u003c/span>python\u003cspan class=\"w\"> \u003c/span>benchmark/benchmark_latency.py\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--model\u003cspan class=\"w\"> \u003c/span>/srv/models/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--dtype\u003cspan class=\"w\"> \u003c/span>bfloat16\u003cspan class=\"w\"> \u003c/span>--enforce-eager\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--tensor-parallel-size\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">1\u003c/span>\u003cspan class=\"w\"> \u003c/span>--max-model-len\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">4096\u003c/span>\u003cspan class=\"w\"> \u003c/span>--gpu-memory-utilization\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">0\u003c/span>.90\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--input-len\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">32\u003c/span>\u003cspan class=\"w\"> \u003c/span>--output-len\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">10\u003c/span>\u003cspan class=\"w\"> \u003c/span>--batch-size\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">1\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--output-json\u003cspan class=\"w\"> \u003c/span>profiles/Qwen/Qwen3-4B/A100-PCIE-40GB/i32b1.json\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>The service uses the collected profiles when \u003ccode>AEGAEON_PROFILE_ROOT\u003c/code> points to their directory. Accurate latency estimates require measurements covering the expected input lengths and batch sizes. Changes to the model, hardware, or execution settings require new measurements.\u003c/p>",
          "headings": [
            {
              "id": "batch-collection",
              "title": "Batch collection",
              "level": 2
            },
            {
              "id": "single-point-collection",
              "title": "Single-point collection",
              "level": 2
            }
          ],
          "text": "Profiling ¶ Aegaeon uses model/device latency profiles to estimate Prefill and Decode time. AEGAEON_PROFILE_ROOT overrides the profile root; otherwise Aegaeon uses bundled profiles when present, then the checkout's profiles/ directory. Files follow this layout: profiles/Qwen/Qwen3-4B/A100-PCIE-40GB/i32b1.json Batch collection ¶ Run from the repository root: export AEGAEON_PROFILE_ROOT = \" $PWD /profiles\" CUDA_VISIBLE_DEVICES = 0 python profiles/do_profile.py --model-config /srv/aegaeon/config.yaml --tp 1 The batch collector supports only --tp 1 and uses eager bfloat16 execution with a requested context limit of 8192. It writes results below AEGAEON_PROFILE_ROOT and logs below logs/ . You can also use the single-point command to choose other execution settings. Single-point collection ¶ For custom input lengths or context limits: export AEGAEON_PROFILE_ROOT = \" $PWD /profiles\" mkdir -p profiles/Qwen/Qwen3-4B/A100-PCIE-40GB CUDA_VISIBLE_DEVICES = 0 python benchmark/benchmark_latency.py \\ --model /srv/models/Qwen3-4B --dtype bfloat16 --enforce-eager \\ --tensor-parallel-size 1 --max-model-len 4096 --gpu-memory-utilization 0 .90 \\ --input-len 32 --output-len 10 --batch-size 1 \\ --output-json profiles/Qwen/Qwen3-4B/A100-PCIE-40GB/i32b1.json The service uses the collected profiles when AEGAEON_PROFILE_ROOT points to their directory. Accurate latency estimates require measurements covering the expected input lengths and batch sizes. Changes to the model, hardware, or execution settings require new measurements."
        },
        "api": {
          "id": "api",
          "label": "HTTP API",
          "group": "group-4",
          "html": "\u003ch1 id=\"http-api\">HTTP API\u003ca class=\"headerlink\" href=\"#/en/api#http-api\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon exposes an OpenAI-style API for deployed models and listens on port 8000 by default. The running service publishes request schemas and defaults at \u003ccode>/docs\u003c/code>, \u003ccode>/redoc\u003c/code>, and \u003ccode>/openapi.json\u003c/code>. Authentication is configured at your gateway.\u003c/p>\n\u003ch2 id=\"endpoints\">Endpoints\u003ca class=\"headerlink\" href=\"#/en/api#endpoints\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Method\u003c/th>\n\u003cth>Path\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/health\u003c/td>\n\u003ctd>Fixed health response; no deep actor checks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/v1/models\u003c/td>\n\u003ctd>Deployed model list\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/v1/models/{model_name:path}\u003c/td>\n\u003ctd>Deployed model metadata; the path converter accepts names containing /\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/v1/models/deploy\u003c/td>\n\u003ctd>Deploy CPU weight cache replicas. See \u003ca href=\"#/en/model-management\">Model Management\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/v1/models/undeploy\u003c/td>\n\u003ctd>Unload selected or all replicas. See \u003ca href=\"#/en/model-management\">Model Management\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/v1/chat/completions\u003c/td>\n\u003ctd>Chat, nonstreaming or SSE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/v1/completions\u003c/td>\n\u003ctd>Legacy Completion, nonstreaming or SSE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/tokenize\u003c/td>\n\u003ctd>Tokenize a plain prompt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/detokenize\u003c/td>\n\u003ctd>Decode token IDs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/v1/aegaeon/runtime\u003c/td>\n\u003ctd>Cluster runtime snapshot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/v1/aegaeon/events\u003c/td>\n\u003ctd>Runtime SSE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/v1/aegaeon/metrics\u003c/td>\n\u003ctd>60-second access metrics and rate-limit settings\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"errors\">Errors\u003ca class=\"headerlink\" href=\"#/en/api#errors\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Status\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>400\u003c/td>\n\u003ctd>Invalid model or parameter, or insufficient KV-cache capacity for a request\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422\u003c/td>\n\u003ctd>Invalid request schema, including unsupported generation fields\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>429\u003c/td>\n\u003ctd>Access rate limit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>503\u003c/td>\n\u003ctd>No READY replica\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>507\u003c/td>\n\u003ctd>Deployment failed and no READY replica remains\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>500\u003c/td>\n\u003ctd>Server error; inspect service logs\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>A KV-cache capacity failure after streaming starts is returned as SSE data containing an \u003ccode>error\u003c/code> object, followed by \u003ccode>data: [DONE]\u003c/code>.\u003c/p>\n\u003cp>Runtime interfaces are described in \u003ca href=\"#/en/observability\">Monitoring\u003c/a>.\u003c/p>",
          "headings": [
            {
              "id": "endpoints",
              "title": "Endpoints",
              "level": 2
            },
            {
              "id": "errors",
              "title": "Errors",
              "level": 2
            }
          ],
          "text": "HTTP API ¶ Aegaeon exposes an OpenAI-style API for deployed models and listens on port 8000 by default. The running service publishes request schemas and defaults at /docs , /redoc , and /openapi.json . Authentication is configured at your gateway. Endpoints ¶ Method Path Purpose GET /health Fixed health response; no deep actor checks GET /v1/models Deployed model list GET /v1/models/{model_name:path} Deployed model metadata; the path converter accepts names containing / POST /v1/models/deploy Deploy CPU weight cache replicas. See Model Management POST /v1/models/undeploy Unload selected or all replicas. See Model Management POST /v1/chat/completions Chat, nonstreaming or SSE POST /v1/completions Legacy Completion, nonstreaming or SSE POST /tokenize Tokenize a plain prompt POST /detokenize Decode token IDs GET /v1/aegaeon/runtime Cluster runtime snapshot GET /v1/aegaeon/events Runtime SSE GET /v1/aegaeon/metrics 60-second access metrics and rate-limit settings Errors ¶ Status Meaning 400 Invalid model or parameter, or insufficient KV-cache capacity for a request 422 Invalid request schema, including unsupported generation fields 429 Access rate limit 503 No READY replica 507 Deployment failed and no READY replica remains 500 Server error; inspect service logs A KV-cache capacity failure after streaming starts is returned as SSE data containing an error object, followed by data: [DONE] . Runtime interfaces are described in Monitoring ."
        },

          "html": "\u003ch1 id=\"python-api\">Python API\u003ca class=\"headerlink\" href=\"#/en/python-api#python-api\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>\u003ccode>LLMService\u003c/code>, \u003ccode>NodeConfig\u003c/code>, and \u003ccode>Request\u003c/code> provide direct inference from token IDs. The YAML file supplies model and device metadata; \u003ccode>NodeConfig\u003c/code> defines each node's engines, caches, and initially cached models.\u003c/p>\n\u003cp>The example uses \u003ca href=\"data:application/octet-stream;base64,IyBBZGp1c3QgbW9kZWwgcGF0aHMsIEdQVSwgcHJvZmlsZXMsIGFuZCBtZW1vcnkgYnVkZ2V0cyBmb3IgeW91ciBlbnZpcm9ubWVudC4NCnNlcnZlcjoNCiAgbm5vZGVzOiAxDQogIG51bV9lbmdpbmVzOiAxDQogIG51bV9wcmVmaWxsX2VuZ2luZXM6IDANCiAgbnVtX2RlY29kZV9lbmdpbmVzOiAwDQogIHRlbnNvcl9wYXJhbGxlbF9zaXplOiAxDQogIHdvcmtlcl9udW1fY3B1czogNA0KICBjcHVfbnVtX3NsYWJzOiA4DQogIGNwdV9zbGFiX3NpemVfYnl0ZXM6IDEwNzM3NDE4MjQNCiAgbW9kZWxfY2FjaGVfc2l6ZV9nYjogMjANCiAgbWVtb3J5X3V0aWxpemF0aW9uOiAwLjc3NQ0KICBkdW1teV93ZWlnaHRzOiBmYWxzZQ0KICBzdGFydHVwX21vZGVsczoNCiAgLSBRd2VuL1F3ZW4zLTRCDQogIG1vZGVsX3BsYWNlbWVudF9wb2xpY3k6IGxlYXN0LWxvYWRlZA0KICByZXF1ZXN0X3JvdXRpbmdfcG9saWN5OiBsZWFzdC1vdXRzdGFuZGluZw0KICBjdWRhX2dyYXBoOg0KICAgIG1vZGU6ICdvZmYnDQptb2RlbHM6DQotIG5hbWU6IFF3ZW4vUXdlbjMtNEINCiAgcGF0aDogL3Nydi9tb2RlbHMvUXdlbjMtNEINCiAgcHJvZmlsZTogUXdlbi9Rd2VuMy00Qg0KICBtYXhfbW9kZWxfbGVuOiA0MDk2DQpkZXZpY2VzOg0KLSBuYW1lOiBBMTAwXzQwR0INCiAgbWVtb3J5OiAzOQ0KICBiYW5kd2lkdGg6IDMyDQogIHByb2ZpbGU6IEExMDAtUENJRS00MEdCDQo=\" download=\"simple.yaml\">the Simple-mode configuration\u003c/a>, with paths and profiles adapted to the host. Its relative \u003ccode>config_path\u003c/code> assumes a repository-root working directory; an installed-wheel application can use an absolute path to its own copy. The Ray runtime must already expose the \u003ccode>node_0\u003c/code> resource described in \u003ca href=\"#/en/deployment\">Deployment\u003c/a>.\u003c/p>\n\u003ch2 id=\"example\">Example\u003ca class=\"headerlink\" href=\"#/en/python-api#example\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">os\u003c/span>\n\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">time\u003c/span>\n\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">ray\u003c/span>\n\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">aegaeon\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">LLMService\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">NodeConfig\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">Request\u003c/span>\n\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">aegaeon.config\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">get_model_config\u003c/span>\n\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">aegaeon.models\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">set_model_registry\u003c/span>\n\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">aegaeon.model_registry\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">get_registry\u003c/span>\n\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">aegaeon.utils\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">get_tokenizer\u003c/span>\n\n\u003cspan class=\"n\">config_path\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">os\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">path\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">abspath\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s1\">'docs/en/examples/simple.yaml'\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">os\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">environ\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s1\">'AEGAEON_CONFIG_PATH'\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">config_path\u003c/span>\n\u003cspan class=\"n\">set_model_registry\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">config_path\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">ray\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">init\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">address\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'127.0.0.1:6789'\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">spec\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">get_registry\u003c/span>\u003cspan class=\"p\">()\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">get_by_name\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s1\">'Qwen/Qwen3-4B'\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"k\">assert\u003c/span> \u003cspan class=\"n\">spec\u003c/span> \u003cspan class=\"ow\">is\u003c/span> \u003cspan class=\"ow\">not\u003c/span> \u003cspan class=\"kc\">None\u003c/span>\n\u003cspan class=\"n\">model_config\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">get_model_config\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">spec\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">tokenizer\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">get_tokenizer\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">spec\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">path\u003c/span>\u003cspan class=\"p\">())\u003c/span>\n\n\u003cspan class=\"n\">service\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">LLMService\u003c/span>\u003cspan class=\"p\">([\u003c/span>\n    \u003cspan class=\"n\">NodeConfig\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n        \u003cspan class=\"n\">node_id\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'node_0'\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">num_prefill_engines\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">num_decode_engines\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">num_engines\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">tensor_parallel_size\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">cpu_num_slabs\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">8\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">cpu_slab_size_bytes\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">1024\u003c/span>\u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">model_cache_size\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">20\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"mi\">1024\u003c/span>\u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">cached_models\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">spec\u003c/span>\u003cspan class=\"p\">],\u003c/span>\n        \u003cspan class=\"n\">config_path\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">config_path\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"p\">])\u003c/span>\n\u003cspan class=\"n\">request\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">Request\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n    \u003cspan class=\"n\">model\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">spec\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">arrival_time\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"p\">(),\u003c/span>\n    \u003cspan class=\"n\">request_id\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">prompt_token_ids\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">tokenizer\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">encode\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s1\">'KV Cache is'\u003c/span>\u003cspan class=\"p\">),\u003c/span>\n    \u003cspan class=\"n\">decode_tokens\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">16\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">eos_token_ids\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">model_config\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">eos_token_ids\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">max_model_len\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">model_config\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">max_model_len\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"k\">try\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">outputs\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">service\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">serve\u003c/span>\u003cspan class=\"p\">([\u003c/span>\u003cspan class=\"n\">request\u003c/span>\u003cspan class=\"p\">])\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"nb\">isinstance\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">outputs\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">],\u003c/span> \u003cspan class=\"ne\">BaseException\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"k\">raise\u003c/span> \u003cspan class=\"n\">outputs\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n    \u003cspan class=\"n\">token_ids\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">step\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">new_token_id\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">step\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">outputs\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">]]\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">tokenizer\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">decode\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">token_ids\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">skip_special_tokens\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003cspan class=\"k\">finally\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">ray\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">shutdown\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"interfaces\">Interfaces\u003ca class=\"headerlink\" href=\"#/en/python-api#interfaces\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>NodeConfig\u003c/code> sets each node's engines, caches, and models; memory sizes use bytes.\u003c/li>\n\u003cli>\u003ccode>Request\u003c/code> supplies prompt token IDs, output length, EOS, and context limits. Apply a chat template before tokenizing Chat messages.\u003c/li>\n\u003cli>\u003ccode>LLMService.serve()\u003c/code> returns one \u003ccode>StepOutput\u003c/code> list or exception per request, in input order. It runs its own event loop and is called from synchronous code.\u003c/li>\n\u003cli>\u003ccode>deploy_model_replicas()\u003c/code> and \u003ccode>undeploy_model_replicas()\u003c/code> manage replicas asynchronously.\u003c/li>\n\u003c/ul>\n\u003cp>Use the \u003ca href=\"#/en/api\">HTTP API\u003c/a> for chat formatting, streaming, and response schemas.\u003c/p>",
          "headings": [
