          "text": "Welcome to Aegaeon ¶ Aegaeon Efficient Model-as-a-Service, powered by token-level autoscaling. Get Started → Architecture ↗ Aegaeon is a blazingly fast inference system for deploying multiple AI models on shared GPUs, enabling Model-as-a-Service (MaaS) both in local and cloud environments. Key Features ¶ Token-level autoscaling — switch models between token steps instead of waiting for whole requests to finish. SLO-aware scheduling — coordinates Prefill and Decode work against TTFT and TPOT objectives. Fast model switching — combines host-side weight caching, prefetching, a Rust quick loader, and explicit KV-cache movement. Multi-model runtime — supports dynamic model deployment, multiple replicas, and load-aware request routing. vLLM backend — inherits model and kernel support across dense, hybrid, and MoE architectures from vLLM. Serving and observability — provides OpenAI-style Chat and Completion APIs, SSE streaming, and runtime state telemetry. See our SOSP '25 paper for more technical details. Documentation ¶ Guide Contents Quickstart Install, configure, and send a request Deployment Single-node and multi-node serving Architecture Request flow and runtime components Benchmarking Metrics, profiling, and performance tools HTTP API Endpoints, schemas, and responses CLI Start, deploy, and query See Features and Compatibility for the supported configuration."
        },
        "quickstart": {
          "id": "quickstart",
          "label": "Quickstart",
          "group": "group-1",
          "html": "\u003ch1 id=\"quickstart\">Quickstart\u003ca class=\"headerlink\" href=\"#/en/quickstart#quickstart\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>This example runs Qwen3-4B on one GPU in Simple mode. It assumes \u003ca href=\"#/en/installation\">installation\u003c/a> is complete and uses the provided A100 40 GB profile.\u003c/p>\n\u003ch2 id=\"model-and-configuration\">Model and configuration\u003ca class=\"headerlink\" href=\"#/en/quickstart#model-and-configuration\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>The \u003ca href=\"data:application/octet-stream;base64,IyBBZGp1c3QgbW9kZWwgcGF0aHMsIEdQVSwgcHJvZmlsZXMsIGFuZCBtZW1vcnkgYnVkZ2V0cyBmb3IgeW91ciBlbnZpcm9ubWVudC4NCnNlcnZlcjoNCiAgbm5vZGVzOiAxDQogIG51bV9lbmdpbmVzOiAxDQogIG51bV9wcmVmaWxsX2VuZ2luZXM6IDANCiAgbnVtX2RlY29kZV9lbmdpbmVzOiAwDQogIHRlbnNvcl9wYXJhbGxlbF9zaXplOiAxDQogIHdvcmtlcl9udW1fY3B1czogNA0KICBjcHVfbnVtX3NsYWJzOiA4DQogIGNwdV9zbGFiX3NpemVfYnl0ZXM6IDEwNzM3NDE4MjQNCiAgbW9kZWxfY2FjaGVfc2l6ZV9nYjogMjANCiAgbWVtb3J5X3V0aWxpemF0aW9uOiAwLjc3NQ0KICBkdW1teV93ZWlnaHRzOiBmYWxzZQ0KICBzdGFydHVwX21vZGVsczoNCiAgLSBRd2VuL1F3ZW4zLTRCDQogIG1vZGVsX3BsYWNlbWVudF9wb2xpY3k6IGxlYXN0LWxvYWRlZA0KICByZXF1ZXN0X3JvdXRpbmdfcG9saWN5OiBsZWFzdC1vdXRzdGFuZGluZw0KICBjdWRhX2dyYXBoOg0KICAgIG1vZGU6ICdvZmYnDQptb2RlbHM6DQotIG5hbWU6IFF3ZW4vUXdlbjMtNEINCiAgcGF0aDogL3Nydi9tb2RlbHMvUXdlbjMtNEINCiAgcHJvZmlsZTogUXdlbi9Rd2VuMy00Qg0KICBtYXhfbW9kZWxfbGVuOiA0MDk2DQpkZXZpY2VzOg0KLSBuYW1lOiBBMTAwXzQwR0INCiAgbWVtb3J5OiAzOQ0KICBiYW5kd2lkdGg6IDMyDQogIHByb2ZpbGU6IEExMDAtUENJRS00MEdCDQo=\" download=\"simple.yaml\">single-GPU configuration\u003c/a> defines the model, its cache budgets, and one Simple Engine. Save it as \u003ccode>aegaeon.yaml\u003c/code> in your working directory. A source checkout contains the same file at \u003ccode>docs/en/examples/simple.yaml\u003c/code>.\u003c/p>\n\u003cp>The \u003ccode>/srv/models\u003c/code> path in the example is a default convention. Replace it with your own absolute model path as shown below; see \u003ca href=\"#/en/configuration#filesystem-paths\">filesystem paths\u003c/a> for the archive and dataset conventions.\u003c/p>\n\u003cp>The following commands download the model and update its path in that configuration:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nv\">CONFIG_FILE\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$PWD\u003c/span>\u003cspan class=\"s2\">/aegaeon.yaml\"\u003c/span>\n\u003cspan class=\"nv\">MODEL_DIR\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$HOME\u003c/span>\u003cspan class=\"s2\">/aegaeon-models/Qwen3-4B\"\u003c/span>\nhf\u003cspan class=\"w\"> \u003c/span>download\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--local-dir\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$MODEL_DIR\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\nsed\u003cspan class=\"w\"> \u003c/span>-i\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s2\">\"s|/srv/models/Qwen3-4B|\u003c/span>\u003cspan class=\"nv\">$MODEL_DIR\u003c/span>\u003cspan class=\"s2\">|\"\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CONFIG_FILE\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Another GPU or model needs matching device entries, performance profiles, and memory budgets. These fields are described in the \u003ca href=\"#/en/configuration\">Configuration Reference\u003c/a>.\u003c/p>\n\u003ch2 id=\"service-startup\">Service startup\u003ca class=\"headerlink\" href=\"#/en/quickstart#service-startup\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_VISIBLE_DEVICES\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">0\u003c/span>\naegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--config\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CONFIG_FILE\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"w\"> \u003c/span>--host\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">127\u003c/span>.0.0.1\u003cspan class=\"w\"> \u003c/span>--port\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">8000\u003c/span>\u003cspan class=\"w\"> \u003c/span>--ray-address\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nb\">local\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Startup loads the models listed in \u003ccode>startup_models\u003c/code>. The service is ready when the log reports \u003ccode>Application startup complete\u003c/code>.\u003c/p>\n\u003ch2 id=\"first-request\">First request\u003ca class=\"headerlink\" href=\"#/en/quickstart#first-request\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>In another terminal, the configured model name identifies the request’s destination:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>curl\u003cspan class=\"w\"> \u003c/span>-sS\u003cspan class=\"w\"> \u003c/span>http://127.0.0.1:8000/v1/chat/completions\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>-H\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'Content-Type: application/json'\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>-d\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'{\"model\":\"Qwen/Qwen3-4B\",\"messages\":[{\"role\":\"user\",\"content\":\"Explain KV Cache in one sentence.\"}],\"temperature\":0,\"max_tokens\":64}'\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>The response includes \u003ccode>choices[0].message.content\u003c/code>, \u003ccode>finish_reason\u003c/code>, and \u003ccode>usage\u003c/code>. \u003ca href=\"#/en/serving\">Online Inference\u003c/a> covers client integration and streaming.\u003c/p>",
          "headings": [
            {
              "id": "model-and-configuration",
              "title": "Model and configuration",
              "level": 2
            },
            {

              "title": "Service startup",

            {
              "id": "first-request",

              "level": 2

          "text": "Quickstart ¶ This example runs Qwen3-4B on one GPU in Simple mode. It assumes installation is complete and uses the provided A100 40 GB profile. Model and configuration ¶ The single-GPU configuration defines the model, its cache budgets, and one Simple Engine. Save it as aegaeon.yaml in your working directory. A source checkout contains the same file at docs/en/examples/simple.yaml . The /srv/models path in the example is a default convention. Replace it with your own absolute model path as shown below; see filesystem paths for the archive and dataset conventions. The following commands download the model and update its path in that configuration: CONFIG_FILE = \" $PWD /aegaeon.yaml\" MODEL_DIR = \" $HOME /aegaeon-models/Qwen3-4B\" hf download Qwen/Qwen3-4B --local-dir \" $MODEL_DIR \" sed -i \"s|/srv/models/Qwen3-4B| $MODEL_DIR |\" \" $CONFIG_FILE \" Another GPU or model needs matching device entries, performance profiles, and memory budgets. These fields are described in the Configuration Reference . Service startup ¶ export CUDA_VISIBLE_DEVICES = 0 aegaeon start --config \" $CONFIG_FILE \" --host 127 .0.0.1 --port 8000 --ray-address local Startup loads the models listed in startup_models . The service is ready when the log reports Application startup complete . First request ¶ In another terminal, the configured model name identifies the request’s destination: curl -sS http://127.0.0.1:8000/v1/chat/completions \\ -H 'Content-Type: application/json' \\ -d '{\"model\":\"Qwen/Qwen3-4B\",\"messages\":[{\"role\":\"user\",\"content\":\"Explain KV Cache in one sentence.\"}],\"temperature\":0,\"max_tokens\":64}' The response includes choices[0].message.content , finish_reason , and usage . Online Inference covers client integration and streaming."
        },
        "installation": {
          "id": "installation",
          "label": "Installation",
          "group": "group-1",
          "html": "\u003ch1 id=\"installation\">Installation\u003ca class=\"headerlink\" href=\"#/en/installation#installation\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon supports Linux x86_64 and aarch64 with standard CPython 3.10. Use CUDA 12.9 on x86_64, or CUDA 13.0 on x86_64 and aarch64, including DGX Spark.\u003c/p>\n\u003ch2 id=\"pre-built-wheels\">Pre-built wheels\u003ca class=\"headerlink\" href=\"#/en/installation#pre-built-wheels\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Wheels include Aegaeon's CUDA and Rust extensions. Runtime kernel compilation still requires a matching CUDA Toolkit, a C++ compiler, and Ninja; see the toolchain commands under \u003ca href=\"#/en/installation#from-source-installation\">From-source installation\u003c/a>. Rust/Cargo is required only for source builds. Install each CUDA route in a fresh Python 3.10 environment.\u003c/p>\n\u003cp>Download a wheel matching your CUDA version, CPU architecture, and CPython 3.10 from \u003ca href=\"https://github.com/pkusys/aegaeon/releases\">GitHub Releases\u003c/a>. Activate the Python environment and run the installation command from a directory containing only that Aegaeon wheel.\u003c/p>\n\u003ch3 id=\"cuda-129-linux-x86_64\">CUDA 12.9: Linux x86_64\u003ca class=\"headerlink\" href=\"#/en/installation#cuda-129-linux-x86_64\" title=\"Permanent link\">¶\u003c/a>\u003c/h3>\n\u003cp>The precompiled release supports Linux x86_64, standard CPython 3.10, and glibc &gt;=2.31.\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>./aegaeon-*.whl\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--extra-index-url\u003cspan class=\"w\"> \u003c/span>https://download.pytorch.org/whl/cu129\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--extra-index-url\u003cspan class=\"w\"> \u003c/span>https://wheels.vllm.ai/0.26.0/cu129\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3 id=\"cuda-130-dgx-spark--linux-aarch64\">CUDA 13.0: DGX Spark / Linux aarch64\u003ca class=\"headerlink\" href=\"#/en/installation#cuda-130-dgx-spark--linux-aarch64\" title=\"Permanent link\">¶\u003c/a>\u003c/h3>\n\u003cp>The precompiled DGX Spark wheel supports Linux aarch64, standard CPython 3.10, and glibc &gt;=2.31. A CUDA 13.0-compatible NVIDIA driver is required.\u003c/p>\n\u003cp>Install the CUDA 13.0 aarch64 wheel in a Linux terminal on DGX Spark:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>./aegaeon-*.whl\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"from-source-installation\">From-source installation\u003ca class=\"headerlink\" href=\"#/en/installation#from-source-installation\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Source builds require glibc &gt;=2.28, a matching CUDA Toolkit (including \u003ccode>nvcc\u003c/code>), a C++ compiler, Ninja, and Rust/Cargo. Run from the repository root:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>conda\u003cspan class=\"w\"> \u003c/span>create\u003cspan class=\"w\"> \u003c/span>--solver\u003cspan class=\"w\"> \u003c/span>classic\u003cspan class=\"w\"> \u003c/span>-n\u003cspan class=\"w\"> \u003c/span>aegaeon\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">python\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">3\u003c/span>.10\u003cspan class=\"w\"> \u003c/span>-y\nconda\u003cspan class=\"w\"> \u003c/span>activate\u003cspan class=\"w\"> \u003c/span>aegaeon\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Choice\u003c/th>\n\u003cth>CUDA Toolkit\u003c/th>\n\u003cth>PyTorch\u003c/th>\n\u003cth>vLLM\u003c/th>\n\u003cth>Platform\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>cu129\u003c/code>\u003c/td>\n\u003ctd>12.9\u003c/td>\n\u003ctd>2.11.0+cu129\u003c/td>\n\u003ctd>0.26.0+cu129\u003c/td>\n\u003ctd>Linux x86_64\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cu130\u003c/code>\u003c/td>\n\u003ctd>13.0\u003c/td>\n\u003ctd>2.11.0\u003c/td>\n\u003ctd>0.26.0\u003c/td>\n\u003ctd>Linux x86_64 / aarch64\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>A compatible NVIDIA driver is required; see NVIDIA's \u003ca href=\"https://docs.nvidia.com/deploy/cuda-compatibility/\">CUDA compatibility guide\u003c/a>.\u003c/p>\n\u003ch3 id=\"cuda-129\">CUDA 12.9\u003ca class=\"headerlink\" href=\"#/en/installation#cuda-129\" title=\"Permanent link\">¶\u003c/a>\u003c/h3>\n\u003cp>This route supports Linux x86_64. If you do not already have a matching toolchain, install it manually in the Conda environment:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>conda\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--solver\u003cspan class=\"w\"> \u003c/span>classic\u003cspan class=\"w\"> \u003c/span>-c\u003cspan class=\"w\"> \u003c/span>nvidia\u003cspan class=\"w\"> \u003c/span>cuda-toolkit\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">12\u003c/span>.9\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>gcc_linux-64\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">11\u003c/span>.2.0\u003cspan class=\"w\"> \u003c/span>gxx_linux-64\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">11\u003c/span>.2.0\u003cspan class=\"w\"> \u003c/span>rust\u003cspan class=\"w\"> \u003c/span>ninja\u003cspan class=\"w\"> \u003c/span>-y\nconda\u003cspan class=\"w\"> \u003c/span>activate\u003cspan class=\"w\"> \u003c/span>aegaeon\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_HOME\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CONDA_PREFIX\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib:\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib64\u003c/span>\u003cspan class=\"si\">${\u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"p\">:+:\u003c/span>\u003cspan class=\"nv\">$LIBRARY_PATH\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>With a system Toolkit, set \u003ccode>CUDA_HOME\u003c/code> to its root instead. The Conda example uses GCC/G++ 11.2.\u003c/p>\n\u003cp>Install the matching dependencies, then build and install Aegaeon:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>-r\u003cspan class=\"w\"> \u003c/span>requirements-cu129.txt\n\u003cspan class=\"nv\">AEGAEON_CUDA\u003c/span>\u003cspan class=\"o\">=\u003c/span>cu129\u003cspan class=\"w\"> \u003c/span>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--no-build-isolation\u003cspan class=\"w\"> \u003c/span>-e\u003cspan class=\"w\"> \u003c/span>.\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3 id=\"cuda-130\">CUDA 13.0\u003ca class=\"headerlink\" href=\"#/en/installation#cuda-130\" title=\"Permanent link\">¶\u003c/a>\u003c/h3>\n\u003cp>On Linux x86_64:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>conda\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--solver\u003cspan class=\"w\"> \u003c/span>classic\u003cspan class=\"w\"> \u003c/span>-c\u003cspan class=\"w\"> \u003c/span>nvidia\u003cspan class=\"w\"> \u003c/span>cuda-toolkit\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">13\u003c/span>.0.2\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>gcc_linux-64\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">11\u003c/span>.2.0\u003cspan class=\"w\"> \u003c/span>gxx_linux-64\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">11\u003c/span>.2.0\u003cspan class=\"w\"> \u003c/span>rust\u003cspan class=\"w\"> \u003c/span>ninja\u003cspan class=\"w\"> \u003c/span>-y\nconda\u003cspan class=\"w\"> \u003c/span>activate\u003cspan class=\"w\"> \u003c/span>aegaeon\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_HOME\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CONDA_PREFIX\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib:\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib64\u003c/span>\u003cspan class=\"si\">${\u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"p\">:+:\u003c/span>\u003cspan class=\"nv\">$LIBRARY_PATH\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>On Linux aarch64 / DGX Spark, use the system CUDA 13.0 Toolkit and GCC/G++ 13:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>conda\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--solver\u003cspan class=\"w\"> \u003c/span>classic\u003cspan class=\"w\"> \u003c/span>-c\u003cspan class=\"w\"> \u003c/span>conda-forge\u003cspan class=\"w\"> \u003c/span>rust\u003cspan class=\"w\"> \u003c/span>ninja\u003cspan class=\"w\"> \u003c/span>-y\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_HOME\u003c/span>\u003cspan class=\"o\">=\u003c/span>/usr/local/cuda-13.0\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CUDA_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/bin:\u003c/span>\u003cspan class=\"nv\">$PATH\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CC\u003c/span>\u003cspan class=\"o\">=\u003c/span>/usr/bin/gcc\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">CXX\u003c/span>\u003cspan class=\"o\">=\u003c/span>/usr/bin/g++\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib:\u003c/span>\u003cspan class=\"nv\">$CUDA_HOME\u003c/span>\u003cspan class=\"s2\">/lib64\u003c/span>\u003cspan class=\"si\">${\u003c/span>\u003cspan class=\"nv\">LIBRARY_PATH\u003c/span>\u003cspan class=\"p\">:+:\u003c/span>\u003cspan class=\"nv\">$LIBRARY_PATH\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Then install the CUDA 13.0 dependencies and build Aegaeon:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>-r\u003cspan class=\"w\"> \u003c/span>requirements-cu130.txt\n\u003cspan class=\"nv\">AEGAEON_CUDA\u003c/span>\u003cspan class=\"o\">=\u003c/span>cu130\u003cspan class=\"w\"> \u003c/span>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>--no-build-isolation\u003cspan class=\"w\"> \u003c/span>-e\u003cspan class=\"w\"> \u003c/span>.\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"check-the-environment\">Check the environment\u003ca class=\"headerlink\" href=\"#/en/installation#check-the-environment\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>-m\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>check\naegaeon\u003cspan class=\"w\"> \u003c/span>doctor\naegaeon\u003cspan class=\"w\"> \u003c/span>doctor\u003cspan class=\"w\"> \u003c/span>--check-cuda\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>On Linux aarch64 with CUDA 13.0, \u003ccode>pip check\u003c/code> may report \u003ccode>nvidia-cusparselt-cu13 0.8.0 is not supported on this platform\u003c/code>. This is an upstream NVIDIA wheel metadata issue: the filename uses \u003ccode>manylinux2014_aarch64\u003c/code>, but the internal tag declares \u003ccode>manylinux2014_sbsa\u003c/code>, causing the compatibility check to fail.\u003c/p>\n\u003cp>Foundry graph SAVE/LOAD is optional and requires a separate Foundry installation; see \u003ca href=\"#/en/cuda-graphs\">CUDA graphs\u003c/a>. Continue with the \u003ca href=\"#/en/quickstart\">Quickstart\u003c/a>. For installation errors, see \u003ca href=\"#/en/troubleshooting\">Troubleshooting\u003c/a>.\u003c/p>",

          "text": "Installation ¶ Aegaeon supports Linux x86_64 and aarch64 with standard CPython 3.10. Use CUDA 12.9 on x86_64, or CUDA 13.0 on x86_64 and aarch64, including DGX Spark. Pre-built wheels ¶ Wheels include Aegaeon's CUDA and Rust extensions. Runtime kernel compilation still requires a matching CUDA Toolkit, a C++ compiler, and Ninja; see the toolchain commands under From-source installation . Rust/Cargo is required only for source builds. Install each CUDA route in a fresh Python 3.10 environment. Download a wheel matching your CUDA version, CPU architecture, and CPython 3.10 from GitHub Releases . Activate the Python environment and run the installation command from a directory containing only that Aegaeon wheel. CUDA 12.9: Linux x86_64 ¶ The precompiled release supports Linux x86_64, standard CPython 3.10, and glibc >=2.31. python -m pip install ./aegaeon-*.whl \\ --extra-index-url https://download.pytorch.org/whl/cu129 \\ --extra-index-url https://wheels.vllm.ai/0.26.0/cu129 CUDA 13.0: DGX Spark / Linux aarch64 ¶ The precompiled DGX Spark wheel supports Linux aarch64, standard CPython 3.10, and glibc >=2.31. A CUDA 13.0-compatible NVIDIA driver is required. Install the CUDA 13.0 aarch64 wheel in a Linux terminal on DGX Spark: python -m pip install ./aegaeon-*.whl From-source installation ¶ Source builds require glibc >=2.28, a matching CUDA Toolkit (including nvcc ), a C++ compiler, Ninja, and Rust/Cargo. Run from the repository root: conda create --solver classic -n aegaeon python = 3 .10 -y conda activate aegaeon Choice CUDA Toolkit PyTorch vLLM Platform cu129 12.9 2.11.0+cu129 0.26.0+cu129 Linux x86_64 cu130 13.0 2.11.0 0.26.0 Linux x86_64 / aarch64 A compatible NVIDIA driver is required; see NVIDIA's CUDA compatibility guide . CUDA 12.9 ¶ This route supports Linux x86_64. If you do not already have a matching toolchain, install it manually in the Conda environment: conda install --solver classic -c nvidia cuda-toolkit = 12 .9 \\ gcc_linux-64 = 11 .2.0 gxx_linux-64 = 11 .2.0 rust ninja -y conda activate aegaeon export CUDA_HOME = \" $CONDA_PREFIX \" export CUDA_PATH = \" $CUDA_HOME \" export LIBRARY_PATH = \" $CUDA_HOME /lib: $CUDA_HOME /lib64 ${ LIBRARY_PATH :+: $LIBRARY_PATH } \" With a system Toolkit, set CUDA_HOME to its root instead. The Conda example uses GCC/G++ 11.2. Install the matching dependencies, then build and install Aegaeon: python -m pip install -r requirements-cu129.txt AEGAEON_CUDA = cu129 python -m pip install --no-build-isolation -e . CUDA 13.0 ¶ On Linux x86_64: conda install --solver classic -c nvidia cuda-toolkit = 13 .0.2 \\ gcc_linux-64 = 11 .2.0 gxx_linux-64 = 11 .2.0 rust ninja -y conda activate aegaeon export CUDA_HOME = \" $CONDA_PREFIX \" export CUDA_PATH = \" $CUDA_HOME \" export LIBRARY_PATH = \" $CUDA_HOME /lib: $CUDA_HOME /lib64 ${ LIBRARY_PATH :+: $LIBRARY_PATH } \" On Linux aarch64 / DGX Spark, use the system CUDA 13.0 Toolkit and GCC/G++ 13: conda install --solver classic -c conda-forge rust ninja -y export CUDA_HOME = /usr/local/cuda-13.0 export CUDA_PATH = \" $CUDA_HOME \" export PATH = \" $CUDA_HOME /bin: $PATH \" export CC = /usr/bin/gcc export CXX = /usr/bin/g++ export LIBRARY_PATH = \" $CUDA_HOME /lib: $CUDA_HOME /lib64 ${ LIBRARY_PATH :+: $LIBRARY_PATH } \" Then install the CUDA 13.0 dependencies and build Aegaeon: python -m pip install -r requirements-cu130.txt AEGAEON_CUDA = cu130 python -m pip install --no-build-isolation -e . Check the environment ¶ python -m pip check aegaeon doctor aegaeon doctor --check-cuda On Linux aarch64 with CUDA 13.0, pip check may report nvidia-cusparselt-cu13 0.8.0 is not supported on this platform . This is an upstream NVIDIA wheel metadata issue: the filename uses manylinux2014_aarch64 , but the internal tag declares manylinux2014_sbsa , causing the compatibility check to fail. Foundry graph SAVE/LOAD is optional and requires a separate Foundry installation; see CUDA graphs . Continue with the Quickstart . For installation errors, see Troubleshooting ."
        },

          "html": "\u003ch1 id=\"model-preparation\">Model Preparation\u003ca class=\"headerlink\" href=\"#/en/models#model-preparation\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>A model checkpoint contains the model configuration, tokenizer assets, and all safetensors weight shards. Chat requests also need the tokenizer's chat template. In multi-node deployments, the checkpoint must be available at the same absolute path on every node.\u003c/p>\n\u003ch2 id=\"model-download\">Model download\u003ca class=\"headerlink\" href=\"#/en/models#model-download\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>hf\u003cspan class=\"w\"> \u003c/span>download\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--local-dir\u003cspan class=\"w\"> \u003c/span>/srv/models/Qwen3-4B\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"model-registration\">Model registration\u003ca class=\"headerlink\" href=\"#/en/models#model-registration\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nt\">models\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n\u003cspan class=\"p p-Indicator\">-\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nt\">name\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">Qwen/Qwen3-4B\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">path\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">/srv/models/Qwen3-4B\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">profile\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">Qwen/Qwen3-4B\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>\u003cspan class=\"nt\">max_model_len\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"l l-Scalar l-Scalar-Plain\">4096\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cul>\n\u003cli>\u003ccode>name\u003c/code> identifies the model in client requests.\u003c/li>\n\u003cli>\u003ccode>path\u003c/code> locates the checkpoint.\u003c/li>\n\u003cli>\u003ccode>profile\u003c/code> selects performance data; see \u003ca href=\"#/en/profiling\">Profiling\u003c/a>.\u003c/li>\n\u003cli>\u003ccode>max_model_len\u003c/code> includes both prompt and generated tokens.\u003c/li>\n\u003c/ul>\n\u003cp>Usually omit \u003ccode>params\u003c/code> so Aegaeon reads parameter counts from the weight metadata. Explicit values use units of \u003ccode>2^30\u003c/code> parameters.\u003c/p>\n\u003cp>Registration defines a model; it does not by itself create a \u003ccode>ready\u003c/code> replica. Select models for startup caching or \u003ca href=\"#/en/model-management\">deploy them dynamically\u003c/a>. The \u003ca href=\"#/en/configuration\">configuration reference\u003c/a> lists all model fields.\u003c/p>",
          "headings": [
            {
              "id": "model-download",
              "title": "Model download",
              "level": 2
            },
            {
              "id": "model-registration",
              "title": "Model registration",
              "level": 2
            }
          ],
          "text": "Model Preparation ¶ A model checkpoint contains the model configuration, tokenizer assets, and all safetensors weight shards. Chat requests also need the tokenizer's chat template. In multi-node deployments, the checkpoint must be available at the same absolute path on every node. Model download ¶ hf download Qwen/Qwen3-4B --local-dir /srv/models/Qwen3-4B Model registration ¶ models : - name : Qwen/Qwen3-4B path : /srv/models/Qwen3-4B profile : Qwen/Qwen3-4B max_model_len : 4096 name identifies the model in client requests. path locates the checkpoint. profile selects performance data; see Profiling . max_model_len includes both prompt and generated tokens. Usually omit params so Aegaeon reads parameter counts from the weight metadata. Explicit values use units of 2^30 parameters. Registration defines a model; it does not by itself create a ready replica. Select models for startup caching or deploy them dynamically . The configuration reference lists all model fields."
        },
        "capabilities": {

          "group": "group-1",
          "html": "\u003ch1 id=\"features-and-compatibility\">Features and Compatibility\u003ca class=\"headerlink\" href=\"#/en/capabilities#features-and-compatibility\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"supported-scope\">Supported scope\u003ca class=\"headerlink\" href=\"#/en/capabilities#supported-scope\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Capability\u003c/th>\n\u003cth>Support\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Multi-model inference\u003c/td>\n\u003ctd>Token-level scheduling and model switching\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Deployment\u003c/td>\n\u003ctd>Simple or Prefill/Decode mode across one or more nodes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Model management\u003c/td>\n\u003ctd>Dynamic deployment, unloading, replicas, and request routing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Serving\u003c/td>\n\u003ctd>OpenAI-style Chat/Completion, tokenization, and runtime monitoring\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Function tools\u003c/td>\n\u003ctd>Model-specific vLLM parsers; client-side execution\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CUDA Graphs\u003c/td>\n\u003ctd>Foundry save/load on P/D Decode Workers\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Coming Next\u003c/strong>:\n- Multimodal input\n- Quantization\n- Advanced sampling / logprobs options\n- Tensor Parallelism (TP) and Pipeline Parallelism (PP)\u003c/p>\n\u003cp>See \u003ca href=\"#/en/models\">Model Preparation\u003c/a>, \u003ca href=\"#/en/generation\">Generation Parameters\u003c/a>, and the \u003ca href=\"#/en/api\">HTTP API\u003c/a> for detailed usage.\u003c/p>",

          "text": "Features and Compatibility ¶ Supported scope ¶ Capability Support Multi-model inference Token-level scheduling and model switching Deployment Simple or Prefill/Decode mode across one or more nodes Model management Dynamic deployment, unloading, replicas, and request routing Serving OpenAI-style Chat/Completion, tokenization, and runtime monitoring Function tools Model-specific vLLM parsers; client-side execution CUDA Graphs Foundry save/load on P/D Decode Workers Coming Next : - Multimodal input - Quantization - Advanced sampling / logprobs options - Tensor Parallelism (TP) and Pipeline Parallelism (PP) See Model Preparation , Generation Parameters , and the HTTP API for detailed usage."

        "serving": {
          "id": "serving",
          "label": "Online Inference",
          "group": "group-1",
          "html": "\u003ch1 id=\"online-inference\">Online Inference\u003ca class=\"headerlink\" href=\"#/en/serving#online-inference\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"openai-style-client\">OpenAI-style client\u003ca class=\"headerlink\" href=\"#/en/serving#openai-style-client\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>OpenAI clients connect through the service's \u003ccode>/v1\u003c/code> URL. The \u003ccode>model\u003c/code> value identifies a deployed model, and generation currently uses greedy decoding:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">openai\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">OpenAI\u003c/span>\n\n\u003cspan class=\"n\">client\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">OpenAI\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">base_url\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'http://127.0.0.1:8000/v1'\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">api_key\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'local-placeholder'\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">response\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">client\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">chat\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">completions\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">create\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n    \u003cspan class=\"n\">model\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'Qwen/Qwen3-4B'\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">messages\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">[{\u003c/span>\u003cspan class=\"s1\">'role'\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s1\">'user'\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s1\">'content'\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s1\">'Explain model switching.'\u003c/span>\u003cspan class=\"p\">}],\u003c/span>\n    \u003cspan class=\"n\">temperature\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">max_tokens\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">128\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">response\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">choices\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">message\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">content\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>The key satisfies the client constructor; configure authentication at your gateway.\u003c/p>\n\u003ch2 id=\"streaming\">Streaming\u003ca class=\"headerlink\" href=\"#/en/serving#streaming\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>With \u003ccode>stream=True\u003c/code>, text arrives through \u003ccode>chunk.choices[0].delta.content\u003c/code>. Setting \u003ccode>stream_options.include_usage=true\u003c/code> adds a final usage chunk with empty \u003ccode>choices\u003c/code>:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"n\">stream\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">client\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">chat\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">completions\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">create\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n    \u003cspan class=\"n\">model\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'Qwen/Qwen3-4B'\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">messages\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">[{\u003c/span>\u003cspan class=\"s1\">'role'\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s1\">'user'\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s1\">'content'\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s1\">'Hello'\u003c/span>\u003cspan class=\"p\">}],\u003c/span>\n    \u003cspan class=\"n\">temperature\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">stream\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">stream_options\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"s1\">'include_usage'\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">},\u003c/span>\n\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">chunk\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">stream\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">chunk\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">choices\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">chunk\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">choices\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">delta\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">content\u003c/span> \u003cspan class=\"ow\">or\u003c/span> \u003cspan class=\"s1\">''\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">end\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">''\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">flush\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Raw SSE responses end with \u003ccode>data: [DONE]\u003c/code>. Completion requests use \u003ccode>/v1/completions\u003c/code> with a string or token-ID list as \u003ccode>prompt\u003c/code>.\u003c/p>\n\u003ch2 id=\"tool-calling\">Tool calling\u003ca class=\"headerlink\" href=\"#/en/serving#tool-calling\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Aegaeon supports OpenAI-style \u003ccode>tools\u003c/code> and \u003ccode>tool_choice\u003c/code>. With tools present, \u003ccode>tool_choice\u003c/code> defaults to \u003ccode>auto\u003c/code>; \u003ccode>none\u003c/code> disables parsing. Tool calling requires a supported vLLM parser, inferred from the model name/path or set explicitly through \u003ccode>tool_parser\u003c/code> in the model's YAML entry or deployment request.\u003c/p>\n\u003cp>Clients execute the returned \u003ccode>tool_calls\u003c/code> and submit results as \u003ccode>tool\u003c/code> messages linked by \u003ccode>tool_call_id\u003c/code>. With a tool parser active, streaming buffers generated output until completion, then emits the parsed content and tool calls together.\u003c/p>\n\u003cp>See \u003ca href=\"#/en/generation\">Generation Parameters\u003c/a> for accepted values and \u003ca href=\"#/en/api\">HTTP API\u003c/a> for endpoints and schemas.\u003c/p>",
          "headings": [
            {
              "id": "openai-style-client",
              "title": "OpenAI-style client",
              "level": 2
            },
            {
              "id": "streaming",
              "title": "Streaming",
              "level": 2
            },
            {
              "id": "tool-calling",
              "title": "Tool calling",
              "level": 2
            }
          ],
          "text": "Online Inference ¶ OpenAI-style client ¶ OpenAI clients connect through the service's /v1 URL. The model value identifies a deployed model, and generation currently uses greedy decoding: from openai import OpenAI client = OpenAI ( base_url = 'http://127.0.0.1:8000/v1' , api_key = 'local-placeholder' ) response = client . chat . completions . create ( model = 'Qwen/Qwen3-4B' , messages = [{ 'role' : 'user' , 'content' : 'Explain model switching.' }], temperature = 0 , max_tokens = 128 , ) print ( response . choices [ 0 ] . message . content ) The key satisfies the client constructor; configure authentication at your gateway. Streaming ¶ With stream=True , text arrives through chunk.choices[0].delta.content . Setting stream_options.include_usage=true adds a final usage chunk with empty choices : stream = client . chat . completions . create ( model = 'Qwen/Qwen3-4B' , messages = [{ 'role' : 'user' , 'content' : 'Hello' }], temperature = 0 , stream = True , stream_options = { 'include_usage' : True }, ) for chunk in stream : if chunk . choices : print ( chunk . choices [ 0 ] . delta . content or '' , end = '' , flush = True ) Raw SSE responses end with data: [DONE] . Completion requests use /v1/completions with a string or token-ID list as prompt . Tool calling ¶ Aegaeon supports OpenAI-style tools and tool_choice . With tools present, tool_choice defaults to auto ; none disables parsing. Tool calling requires a supported vLLM parser, inferred from the model name/path or set explicitly through tool_parser in the model's YAML entry or deployment request. Clients execute the returned tool_calls and submit results as tool messages linked by tool_call_id . With a tool parser active, streaming buffers generated output until completion, then emits the parsed content and tool calls together. See Generation Parameters for accepted values and HTTP API for endpoints and schemas."
        },
        "generation": {
          "id": "generation",
          "label": "Generation Parameters",
          "group": "group-1",
          "html": "\u003ch1 id=\"generation-parameters\">Generation Parameters\u003ca class=\"headerlink\" href=\"#/en/generation#generation-parameters\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"greedy-decoding\">Greedy decoding\u003ca class=\"headerlink\" href=\"#/en/generation#greedy-decoding\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>The current Worker generates one greedy continuation per request. Sampling controls are accepted only at the values below; other values return HTTP 400.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Parameter\u003c/th>\n\u003cth>Accepted values\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>n\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>temperature\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0\u003c/code> or \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>top_p\u003c/code>, \u003ccode>top_k\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code> or \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>min_p\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0\u003c/code> or \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>frequency_penalty\u003c/code>, \u003ccode>presence_penalty\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0\u003c/code> or \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>repetition_penalty\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code> or \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>logit_bias\u003c/code>\u003c/td>\n\u003ctd>Empty dictionary or \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>use_beam_search\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>length_penalty\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>priority\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>seed\u003c/code>\u003c/td>\n\u003ctd>Any integer or \u003ccode>null\u003c/code>; has no effect on greedy decoding\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Chat \u003ccode>logprobs\u003c/code> / \u003ccode>top_logprobs\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code> or \u003ccode>null\u003c/code> / \u003ccode>0\u003c/code> or \u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Completion \u003ccode>logprobs\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>null\u003c/code> or omitted\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"length-and-stopping\">Length and stopping\u003ca class=\"headerlink\" href=\"#/en/generation#length-and-stopping\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Chat defaults to 128 output tokens, and Completion defaults to 16. Chat accepts either \u003ccode>max_tokens\u003c/code> or \u003ccode>max_completion_tokens\u003c/code>; if both are supplied, their values must match. The output limit must be at least 1. The prompt must leave room for at least one output token, and generation is bounded by the model's total \u003ccode>max_model_len\u003c/code>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Parameter\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>stop\u003c/code>\u003c/td>\n\u003ctd>Stop string or strings applied to visible text\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>stop_token_ids\u003c/code>\u003c/td>\n\u003ctd>Additional nonnegative token IDs that end generation\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ignore_eos\u003c/code>\u003c/td>\n\u003ctd>Ignore EOS; explicit stop conditions and length limits still apply\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>min_tokens\u003c/code>\u003c/td>\n\u003ctd>Minimum output before accepting stop conditions; from 0 to the output limit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>include_stop_str_in_output\u003c/code>\u003c/td>\n\u003ctd>Retain the matched stop string\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>skip_special_tokens\u003c/code>\u003c/td>\n\u003ctd>Omit special tokens when decoding\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>return_token_ids\u003c/code>\u003c/td>\n\u003ctd>Include token IDs in the response\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>finish_reason\u003c/code> is \u003ccode>stop\u003c/code>, \u003ccode>length\u003c/code>, or \u003ccode>tool_calls\u003c/code> for a parsed function call.\u003c/p>\n\u003ch2 id=\"prompt-formatting\">Prompt formatting\u003ca class=\"headerlink\" href=\"#/en/generation#prompt-formatting\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>truncate_prompt_tokens\u003c/code> accepts a positive input-token limit or \u003ccode>-1\u003c/code>. For plain-text input, \u003ccode>-1\u003c/code> leaves the input unchanged, and truncation defaults to keeping the end. \u003ccode>truncation_side='left'\u003c/code> keeps the end; \u003ccode>'right'\u003c/code> keeps the beginning.\u003c/p>\n\u003cp>Chat defaults to \u003ccode>add_special_tokens=false\u003c/code> and \u003ccode>add_generation_prompt=true\u003c/code>. \u003ccode>continue_final_message=true\u003c/code> continues the last message and requires \u003ccode>add_generation_prompt=false\u003c/code>.\u003c/p>\n\u003cp>Complete request types and defaults are available at the running service's \u003ccode>/docs\u003c/code> and \u003ccode>/openapi.json\u003c/code>.\u003c/p>",

              "id": "greedy-decoding",
              "title": "Greedy decoding",
              "level": 2
            },
            {
              "id": "length-and-stopping",
              "title": "Length and stopping",
              "level": 2

            {
              "id": "prompt-formatting",
              "title": "Prompt formatting",
              "level": 2
            }
          ],
          "text": "Generation Parameters ¶ Greedy decoding ¶ The current Worker generates one greedy continuation per request. Sampling controls are accepted only at the values below; other values return HTTP 400. Parameter Accepted values n 1 temperature 0 or null top_p , top_k 1 or null min_p 0 or null frequency_penalty , presence_penalty 0 or null repetition_penalty 1 or null logit_bias Empty dictionary or null use_beam_search false length_penalty 1 priority 0 seed Any integer or null ; has no effect on greedy decoding Chat logprobs / top_logprobs false or null / 0 or null Completion logprobs null or omitted Length and stopping ¶ Chat defaults to 128 output tokens, and Completion defaults to 16. Chat accepts either max_tokens or max_completion_tokens ; if both are supplied, their values must match. The output limit must be at least 1. The prompt must leave room for at least one output token, and generation is bounded by the model's total max_model_len . Parameter Meaning stop Stop string or strings applied to visible text stop_token_ids Additional nonnegative token IDs that end generation ignore_eos Ignore EOS; explicit stop conditions and length limits still apply min_tokens Minimum output before accepting stop conditions; from 0 to the output limit include_stop_str_in_output Retain the matched stop string skip_special_tokens Omit special tokens when decoding return_token_ids Include token IDs in the response finish_reason is stop , length , or tool_calls for a parsed function call. Prompt formatting ¶ truncate_prompt_tokens accepts a positive input-token limit or -1 . For plain-text input, -1 leaves the input unchanged, and truncation defaults to keeping the end. truncation_side='left' keeps the end; 'right' keeps the beginning. Chat defaults to add_special_tokens=false and add_generation_prompt=true . continue_final_message=true continues the last message and requires add_generation_prompt=false . Complete request types and defaults are available at the running service's /docs and /openapi.json ."
        },
        "model-management": {
          "id": "model-management",
          "label": "Model Management",
          "group": "group-1",
          "html": "\u003ch1 id=\"model-management\">Model Management\u003ca class=\"headerlink\" href=\"#/en/model-management#model-management\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon stores model replicas in each node's CPU weight cache and routes requests among ready replicas. Each request stays on one configured node for its Prefill and Decode lifecycle.\u003c/p>\n\u003ch2 id=\"replica-states\">Replica states\u003ca class=\"headerlink\" href=\"#/en/model-management#replica-states\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>State\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>absent\u003c/code>\u003c/td>\n\u003ctd>No replica; omitted from placement snapshots\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>loading\u003c/code>\u003c/td>\n\u003ctd>Deployment in progress\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ready\u003c/code>\u003c/td>\n\u003ctd>Accepts new requests\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>draining\u003c/code>\u003c/td>\n\u003ctd>Rejects new requests; retry unloading after active requests finish\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>failed\u003c/code>\u003c/td>\n\u003ctd>Deployment failed\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"deployment-and-routing\">Deployment and routing\u003ca class=\"headerlink\" href=\"#/en/model-management#deployment-and-routing\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>deploy\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--replicas\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">2\u003c/span>\naegaeon\u003cspan class=\"w\"> \u003c/span>undeploy\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--nodes\u003cspan class=\"w\"> \u003c/span>node_1\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>\u003ccode>--replicas\u003c/code> (\u003ccode>replica_count\u003c/code> in HTTP requests) sets a minimum ready-replica target. Use undeploy to reduce the replica count. \u003ccode>--nodes\u003c/code> (\u003ccode>node_ids\u003c/code>) selects nodes directly and takes precedence over the replica target.\u003c/p>\n\u003cp>\u003ccode>server.model_placement_policy: least-loaded\u003c/code> selects nodes using cache capacity, eviction cost, and request load. \u003ccode>server.request_routing_policy: least-outstanding\u003c/code> selects a ready node with the fewest outstanding requests. Both accept \u003ccode>round-robin\u003c/code> as an alternative.\u003c/p>\n\u003ch2 id=\"operation-results\">Operation results\u003ca class=\"headerlink\" href=\"#/en/model-management#operation-results\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Deploy and undeploy return \u003ccode>status\u003c/code>, per-node results, and \u003ccode>failed\u003c/code>. HTTP 200 can contain \u003ccode>status: partial\u003c/code>; check these fields before treating the operation as complete. The CLI exits with status 1 for partial operations. A deployment that leaves no ready replica returns HTTP 507.\u003c/p>\n\u003cp>Inspect placements and routing with \u003ccode>GET /v1/aegaeon/runtime\u003c/code>. See the \u003ca href=\"#/en/cli\">CLI reference\u003c/a> for command options and the \u003ca href=\"#/en/api\">API reference\u003c/a> for HTTP fields.\u003c/p>",
          "headings": [
            {
              "id": "replica-states",
              "title": "Replica states",
              "level": 2
            },
            {
              "id": "deployment-and-routing",
              "title": "Deployment and routing",
              "level": 2
            },
            {
              "id": "operation-results",
              "title": "Operation results",
              "level": 2
            }
          ],
          "text": "Model Management ¶ Aegaeon stores model replicas in each node's CPU weight cache and routes requests among ready replicas. Each request stays on one configured node for its Prefill and Decode lifecycle. Replica states ¶ State Meaning absent No replica; omitted from placement snapshots loading Deployment in progress ready Accepts new requests draining Rejects new requests; retry unloading after active requests finish failed Deployment failed Deployment and routing ¶ aegaeon deploy Qwen/Qwen3-4B --replicas 2 aegaeon undeploy Qwen/Qwen3-4B --nodes node_1 --replicas ( replica_count in HTTP requests) sets a minimum ready-replica target. Use undeploy to reduce the replica count. --nodes ( node_ids ) selects nodes directly and takes precedence over the replica target. server.model_placement_policy: least-loaded selects nodes using cache capacity, eviction cost, and request load. server.request_routing_policy: least-outstanding selects a ready node with the fewest outstanding requests. Both accept round-robin as an alternative. Operation results ¶ Deploy and undeploy return status , per-node results, and failed . HTTP 200 can contain status: partial ; check these fields before treating the operation as complete. The CLI exits with status 1 for partial operations. A deployment that leaves no ready replica returns HTTP 507. Inspect placements and routing with GET /v1/aegaeon/runtime . See the CLI reference for command options and the API reference for HTTP fields."
        },
        "deployment": {
          "id": "deployment",
          "label": "Distributed Deployment",
          "group": "group-1",
          "html": "\u003ch1 id=\"deployment\">Deployment\u003ca class=\"headerlink\" href=\"#/en/deployment#deployment\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Each configured Aegaeon node runs one Controller and shares its CPU caches among that node's engines. Currently supported configuration assumes TP=1, so each engine uses one GPU. Standard deployments use one Aegaeon node per physical Ray node.\u003c/p>\n\u003cp>A multi-GPU host normally uses \u003ccode>nnodes: 1\u003c/code>. Python integrations can isolate multiple logical nodes on one host with separate \u003ccode>NodeConfig.cuda_visible_devices\u003c/code> and \u003ccode>NodeConfig.shm_dir\u003c/code> settings.\u003c/p>\n\u003ch2 id=\"execution-modes\">Execution modes\u003ca class=\"headerlink\" href=\"#/en/deployment#execution-modes\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Mode\u003c/th>\n\u003cth>Server settings\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Simple\u003c/td>\n\u003ctd>\u003ccode>num_engines &gt; 0\u003c/code>; both P/D counts are 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P/D\u003c/td>\n\u003ctd>\u003ccode>num_engines: 0\u003c/code>; at least one Prefill and one Decode Engine\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Use the \u003ca href=\"#/en/examples\">configuration examples\u003c/a> for single-GPU, P/D, or multi-node layouts. Make the same model files and matching profiles available on every node.\u003c/p>\n\u003ch2 id=\"ray-cluster\">Ray cluster\u003ca class=\"headerlink\" href=\"#/en/deployment#ray-cluster\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>For a single host, pass \u003ccode>--ray-address local\u003c/code>. For two hosts, start Ray on each:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"c1\"># Head node\u003c/span>\nray\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--head\u003cspan class=\"w\"> \u003c/span>--port\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">6789\u003c/span>\u003cspan class=\"w\"> \u003c/span>--resources\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'{\"node_0\":1}'\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"c1\"># Worker node\u003c/span>\nray\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--address\u003cspan class=\"o\">=\u003c/span>HEAD_IP:6789\u003cspan class=\"w\"> \u003c/span>--resources\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'{\"node_1\":1}'\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>Then start the API from the head node with \u003ccode>server.nnodes: 2\u003c/code> in its configuration:\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--config\u003cspan class=\"w\"> \u003c/span>/srv/aegaeon/config.yaml\u003cspan class=\"w\"> \u003c/span>--ray-address\u003cspan class=\"w\"> \u003c/span>HEAD_IP:6789\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"resources\">Resources\u003ca class=\"headerlink\" href=\"#/en/deployment#resources\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Each node needs one visible GPU per configured engine. Its Ray CPU budget must cover \u003ccode>server.worker_num_cpus\u003c/code> logical CPUs per Worker, plus capacity for the Controller. \u003ccode>ray status\u003c/code> reports the cluster's CPU and GPU resources.\u003c/p>\n\u003cp>To override the default \u003ca href=\"#/en/scheduling#slo-settings\">SLO settings\u003c/a>, set the variables in the API and all Ray node environments before startup. Independent services need separate Ray instances and shared-memory directories. Stopping the foreground service disconnects its Ray driver; manage an existing Ray cluster separately.\u003c/p>",
          "headings": [
            {
              "id": "execution-modes",
              "title": "Execution modes",
              "level": 2
            },
            {
              "id": "ray-cluster",
              "title": "Ray cluster",
              "level": 2
            },
            {
              "id": "resources",
              "title": "Resources",
              "level": 2
            }
          ],
          "text": "Deployment ¶ Each configured Aegaeon node runs one Controller and shares its CPU caches among that node's engines. Currently supported configuration assumes TP=1, so each engine uses one GPU. Standard deployments use one Aegaeon node per physical Ray node. A multi-GPU host normally uses nnodes: 1 . Python integrations can isolate multiple logical nodes on one host with separate NodeConfig.cuda_visible_devices and NodeConfig.shm_dir settings. Execution modes ¶ Mode Server settings Simple num_engines > 0 ; both P/D counts are 0 P/D num_engines: 0 ; at least one Prefill and one Decode Engine Use the configuration examples for single-GPU, P/D, or multi-node layouts. Make the same model files and matching profiles available on every node. Ray cluster ¶ For a single host, pass --ray-address local . For two hosts, start Ray on each: # Head node ray start --head --port = 6789 --resources = '{\"node_0\":1}' # Worker node ray start --address = HEAD_IP:6789 --resources = '{\"node_1\":1}' Then start the API from the head node with server.nnodes: 2 in its configuration: aegaeon start --config /srv/aegaeon/config.yaml --ray-address HEAD_IP:6789 Resources ¶ Each node needs one visible GPU per configured engine. Its Ray CPU budget must cover server.worker_num_cpus logical CPUs per Worker, plus capacity for the Controller. ray status reports the cluster's CPU and GPU resources. To override the default SLO settings , set the variables in the API and all Ray node environments before startup. Independent services need separate Ray instances and shared-memory directories. Stopping the foreground service disconnects its Ray driver; manage an existing Ray cluster separately."
        },
        "memory": {
          "id": "memory",
          "label": "Memory and KV Cache",
          "group": "group-1",
          "html": "\u003ch1 id=\"memory-and-kv-cache\">Memory and KV Cache\u003ca class=\"headerlink\" href=\"#/en/memory#memory-and-kv-cache\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon caches model weights separately from request KV state, so it can switch models while preserving in-progress requests.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Region\u003c/th>\n\u003cth>Contents\u003c/th>\n\u003cth>Main setting\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>CPU weight cache\u003c/td>\n\u003ctd>Model weights shared by node Workers\u003c/td>\n\u003ctd>\u003ccode>model_cache_size_gb\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CPU KV cache\u003c/td>\n\u003ctd>Request state between execution steps\u003c/td>\n\u003ctd>\u003ccode>cpu_num_slabs\u003c/code> × \u003ccode>cpu_slab_size_bytes\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GPU KV budget\u003c/td>\n\u003ctd>Capacity estimate after subtracting active and prefetched weights\u003c/td>\n\u003ctd>\u003ccode>memory_utilization\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>QuickLoader GPU arena\u003c/td>\n\u003ctd>Space for weights and KV allocations, allocated when QuickLoader first loads a model\u003c/td>\n\u003ctd>\u003ccode>AEGAEON_ARENA_FRACTION\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>These budgets still need headroom for Ray, tokenizers, other mapped files, and temporary tensors. Settings expressed in GB/GiB use \u003ccode>1024^3\u003c/code> bytes.\u003c/p>\n\u003ch2 id=\"weight-cache\">Weight cache\u003ca class=\"headerlink\" href=\"#/en/memory#weight-cache\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>A positive \u003ccode>model_cache_size_gb\u003c/code> sets a fixed CPU weight-cache budget. With zero, Aegaeon estimates the budget from startup models, or uses 20 GiB if none are loaded at startup. Deployment can evict models with no active requests to make room for another model.\u003c/p>\n\u003ch2 id=\"kv-cache\">KV cache\u003ca class=\"headerlink\" href=\"#/en/memory#kv-cache\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>BlockManager allocates request KV blocks and coordinates CPU/GPU transfers. In P/D mode, Prefill and Decode exchange request state through the node's shared CPU KV cache. \u003ca href=\"#/en/work-stealing\">Decode Work Stealing\u003c/a> uses that same cache when transferring batch ownership between Decode engines.\u003c/p>\n\u003ch2 id=\"shared-memory\">Shared memory\u003ca class=\"headerlink\" href=\"#/en/memory#shared-memory\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>CPU caches use shared, pinned host memory, so their budgets must fit both available host memory and the backing filesystem (\u003ccode>/dev/shm\u003c/code> by default), with sufficient service or container memlock limits. Independent services need separate shared-memory directories; \u003ccode>AEGAEON_SHM_DIR\u003c/code> selects the directory at startup.\u003c/p>\n\u003cp>Choose budgets in the \u003ca href=\"#/en/configuration\">configuration reference\u003c/a>. For allocation errors, see \u003ca href=\"#/en/troubleshooting\">Troubleshooting\u003c/a>.\u003c/p>",
