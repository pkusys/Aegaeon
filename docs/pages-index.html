          "text": "CUDA Graph ¶ 可选的 CUDA Graph 集成使用仓库锁定的 Foundry fork 捕获和恢复 Decode 执行，以减少 CPU 提交开销。该功能默认关闭，支持 P/D 模式下 TP=1 的 Decode Worker。Prefill 和 Simple Worker 使用 eager 执行。 Foundry 安装 ¶ Foundry 需要单独安装在 Aegaeon 所在的环境中。从仓库根目录执行： git submodule update --init --recursive foundry conda install -c conda-forge 'boost-cpp>=1.83' 'boost>=1.83' 'cmake>=4.0' ninja export LD_LIBRARY_PATH = \" $CONDA_PREFIX /lib ${ LD_LIBRARY_PATH :+: $LD_LIBRARY_PATH } \" python -m pip install --no-build-isolation -e ./foundry export AEGAEON_FOUNDRY_HOOK_PATH = \" $( python -c 'from pathlib import Path; import foundry.ops; print(Path(foundry.ops.__file__).resolve().parent / \"libcuda_hook.so\")' ) \" 每个 Decode 节点都需在 Worker 启动前安装 Foundry，并设置有效的 hook 和动态库绝对路径。动态库加载错误见 故障排查 。 图配置 ¶ server : num_engines : 0 num_prefill_engines : 1 num_decode_engines : 1 tensor_parallel_size : 1 cuda_graph : mode : 'save' archive_dir : /srv/aegaeon-archives/qwen3 batch_sizes : [ 1 ] seq_len_buckets : [ 4096 ] SAVE 和 LOAD 目前都要求只配置一个最大序列长度桶。只有 batch size 与配置值精确匹配，且序列长度不超过桶上限的 Decode batch 才会回放 graph，其余 batch 使用 eager 执行。LOAD 需要完整存档和兼容的内存布局；存档或布局校验错误会中止加载。 存档创建与复用 ¶ SAVE 在模型加载到 Decode Worker 时捕获配置的 graph，LOAD 从存档恢复。 SAVE 和 LOAD 示例 提供完整配置。调整模型路径和预算后启动 SAVE： aegaeon start --config docs/zh/examples/foundry-save.yaml --ray-address local 出现 Application startup complete 后，在另一终端发送请求，将模型加载到 Decode Worker 并捕获 graph： curl -sS http://127.0.0.1:8000/v1/chat/completions \\ -H 'Content-Type: application/json' \\ --data-binary @docs/zh/examples/chat-request.json 多模型配置需为每个配置的模型发送请求。等待请求完成，并确认 Worker 日志出现 captured ... Foundry decode graphs during model load ，再停止服务，以相同的模型、内存布局和存档目录启动 LOAD： aegaeon start --config docs/zh/examples/foundry-load.yaml --ray-address local Worker 日志中的 Foundry decode replay active 表示正在执行 graph。更改权重、graph 尺寸、内存布局或运行时依赖后，需要重新生成存档。"
        },
        "observability": {
          "id": "observability",
          "label": "日志与监控",
          "group": "group-1",
          "html": "\u003ch1 id=\"日志与监控\">日志与监控\u003ca class=\"headerlink\" href=\"#/zh/observability#日志与监控\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"日志\">日志\u003ca class=\"headerlink\" href=\"#/zh/observability#日志\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>Aegaeon 将 INFO 日志写入标准输出和 \u003ccode>AEGAEON_LOG_FILE\u003c/code> 指定的文件，默认文件为 \u003ccode>output.log\u003c/code>。也可在启动前设置绝对路径：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>mkdir\u003cspan class=\"w\"> \u003c/span>-p\u003cspan class=\"w\"> \u003c/span>logs\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_LOG_FILE\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$PWD\u003c/span>\u003cspan class=\"s2\">/logs/server.log\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>该路径会传给 Ray actor，因此每个节点上都必须存在其父目录。Ray actor 的标准输出和错误输出也可在对应 Ray session 的日志目录中查看。\u003c/p>\n\u003ch2 id=\"运行时接口\">运行时接口\u003ca class=\"headerlink\" href=\"#/zh/observability#运行时接口\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>接口\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>/health\u003c/code>\u003c/td>\n\u003ctd>API 存活状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/v1/models\u003c/code>\u003c/td>\n\u003ctd>服务的已部署模型列表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/v1/aegaeon/runtime\u003c/code>\u003c/td>\n\u003ctd>节点、Engine、副本、路由、缓存及 Decode 负载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/v1/aegaeon/events\u003c/code>\u003c/td>\n\u003ctd>通过 SSE 提供 Engine 状态快照和模型切换事件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/v1/aegaeon/metrics\u003c/code>\u003c/td>\n\u003ctd>各模型的请求速率、生成 token 速率、计数及限流设置\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>curl\u003cspan class=\"w\"> \u003c/span>-sS\u003cspan class=\"w\"> \u003c/span>http://127.0.0.1:8000/v1/aegaeon/runtime\ncurl\u003cspan class=\"w\"> \u003c/span>-N\u003cspan class=\"w\"> \u003c/span>http://127.0.0.1:8000/v1/aegaeon/events\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>通过运行时快照中的副本状态 \u003ccode>ready\u003c/code> 确认模型可用性。请求速率和生成 token 速率是各模型在 60 秒滑动窗口内的平均值。启动 API 前设置 \u003ccode>AEGAEON_MAX_REQUESTS_PER_SECOND\u003c/code> 和 \u003ccode>AEGAEON_MAX_TOKENS_PER_SECOND\u003c/code> 可限制对应速率；超限返回 HTTP 429。\u003c/p>",
          "headings": [
            {
              "id": "日志",
              "title": "日志",
              "level": 2
            },
            {
              "id": "运行时接口",
              "title": "运行时接口",
              "level": 2
            }
          ],
          "text": "日志与监控 ¶ 日志 ¶ Aegaeon 将 INFO 日志写入标准输出和 AEGAEON_LOG_FILE 指定的文件，默认文件为 output.log 。也可在启动前设置绝对路径： mkdir -p logs export AEGAEON_LOG_FILE = \" $PWD /logs/server.log\" 该路径会传给 Ray actor，因此每个节点上都必须存在其父目录。Ray actor 的标准输出和错误输出也可在对应 Ray session 的日志目录中查看。 运行时接口 ¶ 接口 内容 /health API 存活状态 /v1/models 服务的已部署模型列表 /v1/aegaeon/runtime 节点、Engine、副本、路由、缓存及 Decode 负载 /v1/aegaeon/events 通过 SSE 提供 Engine 状态快照和模型切换事件 /v1/aegaeon/metrics 各模型的请求速率、生成 token 速率、计数及限流设置 curl -sS http://127.0.0.1:8000/v1/aegaeon/runtime curl -N http://127.0.0.1:8000/v1/aegaeon/events 通过运行时快照中的副本状态 ready 确认模型可用性。请求速率和生成 token 速率是各模型在 60 秒滑动窗口内的平均值。启动 API 前设置 AEGAEON_MAX_REQUESTS_PER_SECOND 和 AEGAEON_MAX_TOKENS_PER_SECOND 可限制对应速率；超限返回 HTTP 429。"
        },
        "troubleshooting": {
          "id": "troubleshooting",
          "label": "故障排查",
          "group": "group-1",
          "html": "\u003ch1 id=\"故障排查\">故障排查\u003ca class=\"headerlink\" href=\"#/zh/troubleshooting#故障排查\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>先运行 \u003ccode>aegaeon doctor --check-cuda\u003c/code>，并检查服务日志及 \u003ccode>ray status\u003c/code>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>检查项\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>依赖或扩展导入失败\u003c/td>\n\u003ctd>激活安装环境，更换 Torch/CUDA 后重新编译扩展\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ray actor 等待资源\u003c/td>\n\u003ctd>核对节点资源、可见 GPU 和 \u003ccode>worker_num_cpus\u003c/code> 与拓扑是否匹配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CPU 缓存分配失败\u003c/td>\n\u003ctd>检查共享内存，减小缓存或 slab 预算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GPU OOM\u003c/td>\n\u003ctd>减小 batch 或上下文长度，为权重、预取和工作区留出空间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缺少性能数据\u003c/td>\n\u003ctd>核对模型与设备别名，采集\u003ca href=\"#/zh/profiling\">性能数据\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP 400 / 422\u003c/td>\n\u003ctd>检查模型名称、\u003ca href=\"#/zh/generation\">生成参数\u003c/a>及 \u003ccode>/docs\u003c/code> 中的 schema\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP 503\u003c/td>\n\u003ctd>在运行时快照中检查 READY 副本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP 507\u003c/td>\n\u003ctd>检查节点缓存容量和部署结果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"主机内存注册与-memlock\">主机内存注册与 memlock\u003ca class=\"headerlink\" href=\"#/zh/troubleshooting#主机内存注册与-memlock\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>出现锁页内存或主机内存注册错误时：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>df\u003cspan class=\"w\"> \u003c/span>-h\u003cspan class=\"w\"> \u003c/span>/dev/shm\n\u003cspan class=\"nb\">ulimit\u003c/span>\u003cspan class=\"w\"> \u003c/span>-Sl\n\u003cspan class=\"nb\">ulimit\u003c/span>\u003cspan class=\"w\"> \u003c/span>-Hl\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>调整服务或容器的共享内存容量及 memlock 限制，然后重启服务。\u003c/p>\n\u003ch2 id=\"foundry\">Foundry\u003ca class=\"headerlink\" href=\"#/zh/troubleshooting#foundry\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>启动前将 \u003ccode>AEGAEON_FOUNDRY_HOOK_PATH\u003c/code> 设置为已安装的 \u003ccode>libcuda_hook.so\u003c/code> 路径。\u003c/li>\n\u003cli>将 Conda 的 \u003ccode>lib\u003c/code> 目录加入 \u003ccode>LD_LIBRARY_PATH\u003c/code>，以提供 Boost 和 \u003ccode>libstdc++\u003c/code>。\u003c/li>\n\u003cli>缺少 CUDA driver 符号时，使用 NVIDIA \u003ca href=\"https://docs.nvidia.com/deploy/cuda-compatibility/forward-compatibility.html\">前向兼容软件包\u003c/a>中的匹配动态库，设置 \u003ccode>AEGAEON_CUDA_COMPAT_PATH\u003c/code>，并将其加到 \u003ccode>LD_LIBRARY_PATH\u003c/code> 首位。\u003c/li>\n\u003cli>\u003ccode>seq_len_buckets\u003c/code> 使用一个条目，SAVE/LOAD 配置保持一致。运行时或布局更改后重新生成存档。\u003c/li>\n\u003c/ul>\n\u003cp>反馈问题时附上执行命令、配置、依赖版本和 traceback。\u003c/p>",
          "headings": [
            {
              "id": "主机内存注册与-memlock",
              "title": "主机内存注册与 memlock",
              "level": 2
            },
            {
              "id": "foundry",
              "title": "Foundry",
              "level": 2
            }
          ],
          "text": "故障排查 ¶ 先运行 aegaeon doctor --check-cuda ，并检查服务日志及 ray status 。 现象 检查项 依赖或扩展导入失败 激活安装环境，更换 Torch/CUDA 后重新编译扩展 Ray actor 等待资源 核对节点资源、可见 GPU 和 worker_num_cpus 与拓扑是否匹配 CPU 缓存分配失败 检查共享内存，减小缓存或 slab 预算 GPU OOM 减小 batch 或上下文长度，为权重、预取和工作区留出空间 缺少性能数据 核对模型与设备别名，采集 性能数据 HTTP 400 / 422 检查模型名称、 生成参数 及 /docs 中的 schema HTTP 503 在运行时快照中检查 READY 副本 HTTP 507 检查节点缓存容量和部署结果 主机内存注册与 memlock ¶ 出现锁页内存或主机内存注册错误时： df -h /dev/shm ulimit -Sl ulimit -Hl 调整服务或容器的共享内存容量及 memlock 限制，然后重启服务。 Foundry ¶ 启动前将 AEGAEON_FOUNDRY_HOOK_PATH 设置为已安装的 libcuda_hook.so 路径。 将 Conda 的 lib 目录加入 LD_LIBRARY_PATH ，以提供 Boost 和 libstdc++ 。 缺少 CUDA driver 符号时，使用 NVIDIA 前向兼容软件包 中的匹配动态库，设置 AEGAEON_CUDA_COMPAT_PATH ，并将其加到 LD_LIBRARY_PATH 首位。 seq_len_buckets 使用一个条目，SAVE/LOAD 配置保持一致。运行时或布局更改后重新生成存档。 反馈问题时附上执行命令、配置、依赖版本和 traceback。"
        },
        "examples": {
          "id": "examples",
          "label": "配置示例",
          "group": "group-1",
          "html": "\u003ch1 id=\"配置示例\">配置示例\u003ca class=\"headerlink\" href=\"#/zh/examples#配置示例\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>这些示例涵盖常见的服务拓扑。模型路径、GPU 分配、profile 别名和内存预算取决于部署环境。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件\u003c/th>\n\u003cth>拓扑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>simple.yaml\u003c/td>\n\u003ctd>单节点、1 Simple Engine、TP=1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pd.yaml\u003c/td>\n\u003ctd>单节点、1P+1D、TP=1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>multi-node.yaml\u003c/td>\n\u003ctd>两个物理节点，每节点 1 Simple Engine\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>dynamic.yaml\u003c/td>\n\u003ctd>空服务启动后显式部署\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>work-stealing.yaml\u003c/td>\n\u003ctd>单节点、1P+2D\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>foundry-save.yaml / foundry-load.yaml\u003c/td>\n\u003ctd>P/D Decode、batch=1、单个 4096 桶；需要 Foundry 和 hook；SAVE 创建存档，LOAD 要求完整存档\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>chat-request.json\u003c/td>\n\u003ctd>最小非流式贪心请求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>curl\u003cspan class=\"w\"> \u003c/span>-sS\u003cspan class=\"w\"> \u003c/span>http://127.0.0.1:8000/v1/chat/completions\u003cspan class=\"w\"> \u003c/span>-H\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s1\">'Content-Type: application/json'\u003c/span>\u003cspan class=\"w\"> \u003c/span>--data-binary\u003cspan class=\"w\"> \u003c/span>@docs/zh/examples/chat-request.json\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>并发服务需要分配互不重叠的 GPU，并使用独立的共享内存目录。SAVE 与 LOAD 存档需要匹配的布局、模型和依赖。\u003c/p>",
          "headings": [],
          "text": "配置示例 ¶ 这些示例涵盖常见的服务拓扑。模型路径、GPU 分配、profile 别名和内存预算取决于部署环境。 文件 拓扑 simple.yaml 单节点、1 Simple Engine、TP=1 pd.yaml 单节点、1P+1D、TP=1 multi-node.yaml 两个物理节点，每节点 1 Simple Engine dynamic.yaml 空服务启动后显式部署 work-stealing.yaml 单节点、1P+2D foundry-save.yaml / foundry-load.yaml P/D Decode、batch=1、单个 4096 桶；需要 Foundry 和 hook；SAVE 创建存档，LOAD 要求完整存档 chat-request.json 最小非流式贪心请求 curl -sS http://127.0.0.1:8000/v1/chat/completions -H 'Content-Type: application/json' --data-binary @docs/zh/examples/chat-request.json 并发服务需要分配互不重叠的 GPU，并使用独立的共享内存目录。SAVE 与 LOAD 存档需要匹配的布局、模型和依赖。"
        },
        "architecture": {
          "id": "architecture",
          "label": "系统架构",
          "group": "group-2",
          "html": "\u003ch1 id=\"系统架构\">系统架构\u003ca class=\"headerlink\" href=\"#/zh/architecture#系统架构\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cfigure class=\"diagram\">\u003csvg viewBox=\"0 0 600 455\" role=\"img\" aria-label=\"请求路由、节点控制面与两种执行模式\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>\u003cmarker id=\"head\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\u003cpath d=\"M0 0 8 4 0 8\" fill=\"#a2accd\"/>\u003c/marker>\u003c/defs>\u003crect x=\"210\" y=\"10\" width=\"180\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"300.0\" y=\"35\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">FastAPI / LLMService\u003c/text>\u003ctext x=\"300.0\" y=\"53\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">请求接入 · 副本路由\u003c/text>\u003cpath d=\"M300 68 L300 96\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003crect x=\"210\" y=\"100\" width=\"180\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"300.0\" y=\"125\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">Controller\u003c/text>\u003ctext x=\"300.0\" y=\"143\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">配置节点控制面\u003c/text>\u003cpath d=\"M245 158 L145 194\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003cpath d=\"M355 158 L455 194\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003crect x=\"60\" y=\"198\" width=\"170\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"145.0\" y=\"223\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">Prefill → Decode\u003c/text>\u003ctext x=\"145.0\" y=\"241\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">P/D 分离\u003c/text>\u003crect x=\"370\" y=\"198\" width=\"170\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"455.0\" y=\"223\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">Simple Engine\u003c/text>\u003ctext x=\"455.0\" y=\"241\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">同一引擎执行两阶段\u003c/text>\u003cpath d=\"M145 256 L145 285\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003cpath d=\"M455 256 L455 285\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003crect x=\"60\" y=\"289\" width=\"170\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"145.0\" y=\"314\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">GPU Workers\u003c/text>\u003ctext x=\"145.0\" y=\"332\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">模型前向 · 独立 GPU KV\u003c/text>\u003crect x=\"370\" y=\"289\" width=\"170\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"455.0\" y=\"314\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">GPU Workers\u003c/text>\u003ctext x=\"455.0\" y=\"332\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">模型前向 · 独立 GPU KV\u003c/text>\u003crect x=\"205\" y=\"382\" width=\"190\" height=\"58\" rx=\"6\" fill=\"#fff\" stroke=\"#d7ddec\"/>\u003ctext x=\"300.0\" y=\"407\" text-anchor=\"middle\" font-size=\"12\" fill=\"#4b5481\">QuickCache / BlockManager\u003c/text>\u003ctext x=\"300.0\" y=\"425\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8991ae\">共享 CPU 权重与 KV\u003c/text>\u003cpath d=\"M145 347 L235 380\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003cpath d=\"M455 347 L365 380\" stroke=\"#a2accd\" fill=\"none\" stroke-width=\"1.4\" marker-end=\"url(#head)\"/>\u003c/svg>\u003cfigcaption>请求路由、节点控制面与两种执行模式\u003c/figcaption>\u003c/figure>\n\n\u003cp>Simple 与 P/D 是两种可选执行模式。配置中的每个节点都有一个 Controller 和共享 CPU 缓存；同一台物理机可以运行多个这样的节点。各 Worker 持有独立的 GPU KV 缓存，由所属节点的 BlockManager 协调。\u003c/p>\n\u003ch2 id=\"组件\">组件\u003ca class=\"headerlink\" href=\"#/zh/architecture#组件\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>API / LLMService：\u003c/strong> 请求格式处理、副本放置与路由。\u003c/li>\n\u003cli>\u003cstrong>Controller / Schedulers：\u003c/strong> 节点内分发、batch 和模型配额调度。\u003c/li>\n\u003cli>\u003cstrong>StageEngine / Worker：\u003c/strong> 使用 vLLM 模型与内核执行 GPU 计算。\u003c/li>\n\u003cli>\u003cstrong>QuickCache / QuickLoader：\u003c/strong> 共享 CPU 模型权重，并将其加载到 GPU。\u003c/li>\n\u003cli>\u003cstrong>BlockManager：\u003c/strong> 请求 KV 状态及 CPU/GPU 搬运。\u003c/li>\n\u003c/ul>\n\u003cp>请求被路由到模型副本处于 READY 状态的节点。P/D 模式下，Prefill 产生首个 token，未结束的请求继续由 Decode 引擎处理；Simple 模式下，同一个引擎处理两个阶段。节点的 CPU KV 缓存在模型切换期间保留请求状态。详见\u003ca href=\"#/zh/scheduling\">调度\u003c/a>和\u003ca href=\"#/zh/memory\">内存管理\u003c/a>。\u003c/p>",

              "title": "组件",

          "text": "系统架构 ¶ FastAPI / LLMService 请求接入 · 副本路由 Controller 配置节点控制面 Prefill → Decode P/D 分离 Simple Engine 同一引擎执行两阶段 GPU Workers 模型前向 · 独立 GPU KV GPU Workers 模型前向 · 独立 GPU KV QuickCache / BlockManager 共享 CPU 权重与 KV 请求路由、节点控制面与两种执行模式 Simple 与 P/D 是两种可选执行模式。配置中的每个节点都有一个 Controller 和共享 CPU 缓存；同一台物理机可以运行多个这样的节点。各 Worker 持有独立的 GPU KV 缓存，由所属节点的 BlockManager 协调。 组件 ¶ API / LLMService： 请求格式处理、副本放置与路由。 Controller / Schedulers： 节点内分发、batch 和模型配额调度。 StageEngine / Worker： 使用 vLLM 模型与内核执行 GPU 计算。 QuickCache / QuickLoader： 共享 CPU 模型权重，并将其加载到 GPU。 BlockManager： 请求 KV 状态及 CPU/GPU 搬运。 请求被路由到模型副本处于 READY 状态的节点。P/D 模式下，Prefill 产生首个 token，未结束的请求继续由 Decode 引擎处理；Simple 模式下，同一个引擎处理两个阶段。节点的 CPU KV 缓存在模型切换期间保留请求状态。详见 调度 和 内存管理 。"
        },
        "scheduling": {
          "id": "scheduling",
          "label": "调度与SLO",
          "group": "group-2",
          "html": "\u003ch1 id=\"调度与-slo\">调度与 SLO\u003ca class=\"headerlink\" href=\"#/zh/scheduling#调度与-slo\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon 按模型组织请求，在 batch 的执行轮次之间切换模型。Decode 结合\u003ca href=\"#/zh/profiling\">性能 profile\u003c/a>分配时间配额，平衡切换开销与 token 时延。\u003c/p>\n\u003cp>Simple 模式在同一个引擎中调度 Prefill 和 Decode。P/D 模式使用独立的引擎池：Prefill 按到达顺序和队列负载分发，Decode 按时间配额调度各模型的 batch。\u003c/p>\n\u003ch2 id=\"slo-设置\">SLO 设置\u003ca class=\"headerlink\" href=\"#/zh/scheduling#slo-设置\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>TTFT 和 TPOT 目标以秒为单位，在调度模块导入时读取。API 进程和所有 Ray 节点环境都需要在启动前设置相同的值：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_TTFT_SLO\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">3\u003c/span>\n\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_TPOT_SLO\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">0\u003c/span>.03\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>TTFT 默认 10 秒，TPOT 默认 0.1 秒。\u003c/p>\n\u003ch2 id=\"策略作用域\">策略作用域\u003ca class=\"headerlink\" href=\"#/zh/scheduling#策略作用域\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>策略\u003c/th>\n\u003cth>作用域\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>model_placement_policy\u003c/code>\u003c/td>\n\u003ctd>部署时选择副本节点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>request_routing_policy\u003c/code>\u003c/td>\n\u003ctd>为新请求选择 READY 节点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prefill/Decode 调度\u003c/td>\n\u003ctd>在节点内选择 batch 和模型配额\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/zh/work-stealing\">Decode Work Stealing\u003c/a>\u003c/td>\n\u003ctd>在节点内均衡等待中的 Decode batch\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>指标定义和工具见\u003ca href=\"#/zh/benchmarking\">基准测试\u003c/a>。\u003c/p>",
          "headings": [
            {
              "id": "slo-设置",
              "title": "SLO 设置",
              "level": 2

            {
              "id": "策略作用域",
              "title": "策略作用域",

            }
          ],
          "text": "调度与 SLO ¶ Aegaeon 按模型组织请求，在 batch 的执行轮次之间切换模型。Decode 结合 性能 profile 分配时间配额，平衡切换开销与 token 时延。 Simple 模式在同一个引擎中调度 Prefill 和 Decode。P/D 模式使用独立的引擎池：Prefill 按到达顺序和队列负载分发，Decode 按时间配额调度各模型的 batch。 SLO 设置 ¶ TTFT 和 TPOT 目标以秒为单位，在调度模块导入时读取。API 进程和所有 Ray 节点环境都需要在启动前设置相同的值： export AEGAEON_TTFT_SLO = 3 export AEGAEON_TPOT_SLO = 0 .03 TTFT 默认 10 秒，TPOT 默认 0.1 秒。 策略作用域 ¶ 策略 作用域 model_placement_policy 部署时选择副本节点 request_routing_policy 为新请求选择 READY 节点 Prefill/Decode 调度 在节点内选择 batch 和模型配额 Decode Work Stealing 在节点内均衡等待中的 Decode batch 指标定义和工具见 基准测试 。"
        },
        "benchmarking": {
          "id": "benchmarking",
          "label": "基准测试指南",
          "group": "group-3",
          "html": "\u003ch1 id=\"基准测试\">基准测试\u003ca class=\"headerlink\" href=\"#/zh/benchmarking#基准测试\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"指标\">指标\u003ca class=\"headerlink\" href=\"#/zh/benchmarking#指标\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指标\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>TTFT\u003c/td>\n\u003ctd>请求到达到首个 token 的时间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPOT\u003c/td>\n\u003ctd>首个输出 token 之后的平均 token 间隔\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E2E\u003c/td>\n\u003ctd>请求到达到完成的时间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>吞吐量\u003c/td>\n\u003ctd>每秒完成的请求数或生成的 token 数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CV\u003c/td>\n\u003ctd>总体标准差除以均值\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Aegaeon 的 \u003ccode>qos\u003c/code> 统计采用基于 TTFT 和 TPOT 目标的累计时间比值。下方流式示例测量到首个非空文本 chunk 的时间。\u003c/p>\n\u003ch2 id=\"工具\">工具\u003ca class=\"headerlink\" href=\"#/zh/benchmarking#工具\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>API 示例向已运行的服务发送请求。在仓库根目录执行：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>benchmark/demo_api.py\u003cspan class=\"w\"> \u003c/span>--help\npython\u003cspan class=\"w\"> \u003c/span>benchmark/demo_api.py\u003cspan class=\"w\"> \u003c/span>--host\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">127\u003c/span>.0.0.1\u003cspan class=\"w\"> \u003c/span>--port\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">8000\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--model-config\u003cspan class=\"w\"> \u003c/span>/srv/aegaeon/config.yaml\u003cspan class=\"w\"> \u003c/span>--model\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>工具\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>benchmark/work_stealing_gpu_smoke.py\u003c/code>\u003c/td>\n\u003ctd>运行本地 1P+2D Work Stealing 负载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>benchmark/compare_work_stealing_results.py\u003c/code>\u003c/td>\n\u003ctd>比较已保存的 Work Stealing 结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>benchmark/model_placement_gpu_smoke.py\u003c/code>\u003c/td>\n\u003ctd>运行本地放置与路由负载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>benchmark/replay_workload.py\u003c/code>\u003c/td>\n\u003ctd>按 CSV 到达时间向已有 HTTP 服务回放请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tools/benchmark_foundry_three_model_latency.py\u003c/code>\u003c/td>\n\u003ctd>从已有运行记录重放三模型 CUDA Graph 实验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sim/\u003c/code>\u003c/td>\n\u003ctd>纯 CPU 调度仿真，见 \u003ccode>sim/README.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>各工具通过 \u003ccode>--help\u003c/code> 提供参数说明。使用匹配的\u003ca href=\"#/zh/profiling\">性能数据\u003c/a>，并区分启动、模型切换和稳态测量。\u003c/p>\n\u003cp>使用服务上已部署的模型别名，回放仓库内的负载：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>python\u003cspan class=\"w\"> \u003c/span>benchmark/replay_workload.py\u003cspan class=\"w\"> \u003c/span>--csv\u003cspan class=\"w\"> \u003c/span>workloads/synth-2-0.1-1.0-1.0.csv\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--host\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">127\u003c/span>.0.0.1\u003cspan class=\"w\"> \u003c/span>--port\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">8000\u003c/span>\u003cspan class=\"w\"> \u003c/span>--models\u003cspan class=\"w\"> \u003c/span>qwen2_5_7b\u003cspan class=\"w\"> \u003c/span>qwen2_1_5b\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>三模型 Foundry 延迟工具要求显式传入 \u003ccode>--source-run /path/to/validated-run\u003c/code>。\n该目录须包含验证通过且带有 \u003ccode>archive_root\u003c/code> 的 \u003ccode>report.json\u003c/code>，以及配置了\nQwen3-4B、Qwen3.5-9B 和 Gemma-3-4B 的 \u003ccode>multi-model-load.yaml\u003c/code>。\n正式测量前可用 \u003ccode>--preflight-only\u003c/code> 检查来源归档和本地模型路径。\u003c/p>\n\u003ch2 id=\"调优\">调优\u003ca class=\"headerlink\" href=\"#/zh/benchmarking#调优\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>TTFT 较高可能源于排队、加载或 Prefill 容量不足。Decode 间隔较长可能源于模型竞争、数据搬运或配额设置。先检查这些原因，再调整 Engine 数量和内存预算。\u003ca href=\"#/zh/work-stealing\">Work Stealing\u003c/a> 用于改善 Decode 负载不均，\u003ca href=\"#/zh/cuda-graphs\">CUDA Graph\u003c/a> 用于减少提交开销。\u003c/p>",

          "text": "基准测试 ¶ 指标 ¶ 指标 含义 TTFT 请求到达到首个 token 的时间 TPOT 首个输出 token 之后的平均 token 间隔 E2E 请求到达到完成的时间 吞吐量 每秒完成的请求数或生成的 token 数 CV 总体标准差除以均值 Aegaeon 的 qos 统计采用基于 TTFT 和 TPOT 目标的累计时间比值。下方流式示例测量到首个非空文本 chunk 的时间。 工具 ¶ API 示例向已运行的服务发送请求。在仓库根目录执行： python benchmark/demo_api.py --help python benchmark/demo_api.py --host 127 .0.0.1 --port 8000 \\ --model-config /srv/aegaeon/config.yaml --model Qwen/Qwen3-4B 工具 用途 benchmark/work_stealing_gpu_smoke.py 运行本地 1P+2D Work Stealing 负载 benchmark/compare_work_stealing_results.py 比较已保存的 Work Stealing 结果 benchmark/model_placement_gpu_smoke.py 运行本地放置与路由负载 benchmark/replay_workload.py 按 CSV 到达时间向已有 HTTP 服务回放请求 tools/benchmark_foundry_three_model_latency.py 从已有运行记录重放三模型 CUDA Graph 实验 sim/ 纯 CPU 调度仿真，见 sim/README.md 各工具通过 --help 提供参数说明。使用匹配的 性能数据 ，并区分启动、模型切换和稳态测量。 使用服务上已部署的模型别名，回放仓库内的负载： python benchmark/replay_workload.py --csv workloads/synth-2-0.1-1.0-1.0.csv \\ --host 127 .0.0.1 --port 8000 --models qwen2_5_7b qwen2_1_5b 三模型 Foundry 延迟工具要求显式传入 --source-run /path/to/validated-run 。 该目录须包含验证通过且带有 archive_root 的 report.json ，以及配置了 Qwen3-4B、Qwen3.5-9B 和 Gemma-3-4B 的 multi-model-load.yaml 。 正式测量前可用 --preflight-only 检查来源归档和本地模型路径。 调优 ¶ TTFT 较高可能源于排队、加载或 Prefill 容量不足。Decode 间隔较长可能源于模型竞争、数据搬运或配额设置。先检查这些原因，再调整 Engine 数量和内存预算。 Work Stealing 用于改善 Decode 负载不均， CUDA Graph 用于减少提交开销。"
        },
        "profiling": {
          "id": "profiling",

          "group": "group-3",
          "html": "\u003ch1 id=\"性能数据采集\">性能数据采集\u003ca class=\"headerlink\" href=\"#/zh/profiling#性能数据采集\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon 使用模型与设备的时延数据估计 Prefill 和 Decode 时间。\u003ccode>AEGAEON_PROFILE_ROOT\u003c/code> 优先指定数据根目录；未设置时，优先使用包内附带的数据，否则使用仓库的 \u003ccode>profiles/\u003c/code> 目录。文件布局如下：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>profiles/Qwen/Qwen3-4B/A100-PCIE-40GB/i32b1.json\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"批量采集\">批量采集\u003ca class=\"headerlink\" href=\"#/zh/profiling#批量采集\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>在仓库根目录执行：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_PROFILE_ROOT\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$PWD\u003c/span>\u003cspan class=\"s2\">/profiles\"\u003c/span>\n\u003cspan class=\"nv\">CUDA_VISIBLE_DEVICES\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">0\u003c/span>\u003cspan class=\"w\"> \u003c/span>python\u003cspan class=\"w\"> \u003c/span>profiles/do_profile.py\u003cspan class=\"w\"> \u003c/span>--model-config\u003cspan class=\"w\"> \u003c/span>/srv/aegaeon/config.yaml\u003cspan class=\"w\"> \u003c/span>--tp\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">1\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>批量采集器仅支持 \u003ccode>--tp 1\u003c/code>，采用 eager bfloat16 执行，传入的上下文长度上限为 8192。结果写入 \u003ccode>AEGAEON_PROFILE_ROOT\u003c/code> 下，日志写入 \u003ccode>logs/\u003c/code> 下。也可通过单点采集命令选择其他执行设置。\u003c/p>\n\u003ch2 id=\"单点采集\">单点采集\u003ca class=\"headerlink\" href=\"#/zh/profiling#单点采集\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>需要自定义输入长度或上下文限制时：\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"nb\">export\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nv\">AEGAEON_PROFILE_ROOT\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"nv\">$PWD\u003c/span>\u003cspan class=\"s2\">/profiles\"\u003c/span>\nmkdir\u003cspan class=\"w\"> \u003c/span>-p\u003cspan class=\"w\"> \u003c/span>profiles/Qwen/Qwen3-4B/A100-PCIE-40GB\n\u003cspan class=\"nv\">CUDA_VISIBLE_DEVICES\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">0\u003c/span>\u003cspan class=\"w\"> \u003c/span>python\u003cspan class=\"w\"> \u003c/span>benchmark/benchmark_latency.py\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--model\u003cspan class=\"w\"> \u003c/span>/srv/models/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--dtype\u003cspan class=\"w\"> \u003c/span>bfloat16\u003cspan class=\"w\"> \u003c/span>--enforce-eager\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--tensor-parallel-size\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">1\u003c/span>\u003cspan class=\"w\"> \u003c/span>--max-model-len\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">4096\u003c/span>\u003cspan class=\"w\"> \u003c/span>--gpu-memory-utilization\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">0\u003c/span>.90\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--input-len\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">32\u003c/span>\u003cspan class=\"w\"> \u003c/span>--output-len\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">10\u003c/span>\u003cspan class=\"w\"> \u003c/span>--batch-size\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">1\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"se\">\\\u003c/span>\n\u003cspan class=\"w\">  \u003c/span>--output-json\u003cspan class=\"w\"> \u003c/span>profiles/Qwen/Qwen3-4B/A100-PCIE-40GB/i32b1.json\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>\u003ccode>AEGAEON_PROFILE_ROOT\u003c/code> 指向采集结果所在目录时，服务会使用这些 profile。准确的时延估计依赖于覆盖预期输入长度和 batch size 的测量数据。模型、硬件或执行设置发生变化后，需要重新测量。\u003c/p>",

          "text": "性能数据采集 ¶ Aegaeon 使用模型与设备的时延数据估计 Prefill 和 Decode 时间。 AEGAEON_PROFILE_ROOT 优先指定数据根目录；未设置时，优先使用包内附带的数据，否则使用仓库的 profiles/ 目录。文件布局如下： profiles/Qwen/Qwen3-4B/A100-PCIE-40GB/i32b1.json 批量采集 ¶ 在仓库根目录执行： export AEGAEON_PROFILE_ROOT = \" $PWD /profiles\" CUDA_VISIBLE_DEVICES = 0 python profiles/do_profile.py --model-config /srv/aegaeon/config.yaml --tp 1 批量采集器仅支持 --tp 1 ，采用 eager bfloat16 执行，传入的上下文长度上限为 8192。结果写入 AEGAEON_PROFILE_ROOT 下，日志写入 logs/ 下。也可通过单点采集命令选择其他执行设置。 单点采集 ¶ 需要自定义输入长度或上下文限制时： export AEGAEON_PROFILE_ROOT = \" $PWD /profiles\" mkdir -p profiles/Qwen/Qwen3-4B/A100-PCIE-40GB CUDA_VISIBLE_DEVICES = 0 python benchmark/benchmark_latency.py \\ --model /srv/models/Qwen3-4B --dtype bfloat16 --enforce-eager \\ --tensor-parallel-size 1 --max-model-len 4096 --gpu-memory-utilization 0 .90 \\ --input-len 32 --output-len 10 --batch-size 1 \\ --output-json profiles/Qwen/Qwen3-4B/A100-PCIE-40GB/i32b1.json AEGAEON_PROFILE_ROOT 指向采集结果所在目录时，服务会使用这些 profile。准确的时延估计依赖于覆盖预期输入长度和 batch size 的测量数据。模型、硬件或执行设置发生变化后，需要重新测量。"
        },
        "api": {
          "id": "api",
          "label": "HTTP API",
          "group": "group-4",
          "html": "\u003ch1 id=\"http-api\">HTTP API\u003ca class=\"headerlink\" href=\"#/zh/api#http-api\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>Aegaeon 为已部署模型提供 OpenAI 风格的 API，默认监听 8000 端口。运行中服务的 \u003ccode>/docs\u003c/code>、\u003ccode>/redoc\u003c/code> 和 \u003ccode>/openapi.json\u003c/code> 提供请求结构和默认值。鉴权由部署侧网关配置。\u003c/p>\n\u003ch2 id=\"接口清单\">接口清单\u003ca class=\"headerlink\" href=\"#/zh/api#接口清单\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>路径\u003c/th>\n\u003cth>功能\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/health\u003c/td>\n\u003ctd>固定健康响应；不深入检查 actor 状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/v1/models\u003c/td>\n\u003ctd>已部署模型列表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/v1/models/{model_name:path}\u003c/td>\n\u003ctd>已部署模型元信息；路径转换器接受名称中的 /\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/v1/models/deploy\u003c/td>\n\u003ctd>部署 CPU 权重缓存副本，见\u003ca href=\"#/zh/model-management\">模型管理\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/v1/models/undeploy\u003c/td>\n\u003ctd>卸载指定或全部副本，见\u003ca href=\"#/zh/model-management\">模型管理\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/v1/chat/completions\u003c/td>\n\u003ctd>Chat，非流式或 SSE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/v1/completions\u003c/td>\n\u003ctd>Legacy Completion，非流式或 SSE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/tokenize\u003c/td>\n\u003ctd>将纯文本 prompt 编码为 token ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>/detokenize\u003c/td>\n\u003ctd>将 token ID 解码为文本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/v1/aegaeon/runtime\u003c/td>\n\u003ctd>集群运行状态快照\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/v1/aegaeon/events\u003c/td>\n\u003ctd>运行状态 SSE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>/v1/aegaeon/metrics\u003c/td>\n\u003ctd>60 秒窗口访问统计与限流设置\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"错误\">错误\u003ca class=\"headerlink\" href=\"#/zh/api#错误\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>状态码\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>400\u003c/td>\n\u003ctd>模型或参数无效，或请求所需的 KV 缓存容量不足\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>422\u003c/td>\n\u003ctd>请求结构无效，包括不支持的生成字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>429\u003c/td>\n\u003ctd>访问限流\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>503\u003c/td>\n\u003ctd>没有 READY 副本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>507\u003c/td>\n\u003ctd>部署失败，且没有剩余的 READY 副本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>500\u003c/td>\n\u003ctd>服务端错误，详见服务日志\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>流式输出开始后，KV 缓存容量不足的错误通过含有 \u003ccode>error\u003c/code> 对象的 SSE 数据返回，随后发送 \u003ccode>data: [DONE]\u003c/code>。\u003c/p>\n\u003cp>运行状态接口见\u003ca href=\"#/zh/observability\">日志与监控\u003c/a>。\u003c/p>",
          "headings": [
            {
              "id": "接口清单",
              "title": "接口清单",
              "level": 2
            },
            {
              "id": "错误",
              "title": "错误",
              "level": 2

          ],
          "text": "HTTP API ¶ Aegaeon 为已部署模型提供 OpenAI 风格的 API，默认监听 8000 端口。运行中服务的 /docs 、 /redoc 和 /openapi.json 提供请求结构和默认值。鉴权由部署侧网关配置。 接口清单 ¶ 方法 路径 功能 GET /health 固定健康响应；不深入检查 actor 状态 GET /v1/models 已部署模型列表 GET /v1/models/{model_name:path} 已部署模型元信息；路径转换器接受名称中的 / POST /v1/models/deploy 部署 CPU 权重缓存副本，见 模型管理 POST /v1/models/undeploy 卸载指定或全部副本，见 模型管理 POST /v1/chat/completions Chat，非流式或 SSE POST /v1/completions Legacy Completion，非流式或 SSE POST /tokenize 将纯文本 prompt 编码为 token ID POST /detokenize 将 token ID 解码为文本 GET /v1/aegaeon/runtime 集群运行状态快照 GET /v1/aegaeon/events 运行状态 SSE GET /v1/aegaeon/metrics 60 秒窗口访问统计与限流设置 错误 ¶ 状态码 含义 400 模型或参数无效，或请求所需的 KV 缓存容量不足 422 请求结构无效，包括不支持的生成字段 429 访问限流 503 没有 READY 副本 507 部署失败，且没有剩余的 READY 副本 500 服务端错误，详见服务日志 流式输出开始后，KV 缓存容量不足的错误通过含有 error 对象的 SSE 数据返回，随后发送 data: [DONE] 。 运行状态接口见 日志与监控 。"
        },
        "python-api": {

          "html": "\u003ch1 id=\"python-api\">Python API\u003ca class=\"headerlink\" href=\"#/zh/python-api#python-api\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>\u003ccode>LLMService\u003c/code>、\u003ccode>NodeConfig\u003c/code> 和 \u003ccode>Request\u003c/code> 提供直接传入 token ID 的推理接口。YAML 文件提供模型和设备元数据；\u003ccode>NodeConfig\u003c/code> 定义各节点的 Engine、缓存和初始缓存模型。\u003c/p>\n\u003cp>示例使用 \u003ca href=\"data:application/octet-stream;base64,IyDmoLnmja7lrp7pmYXnjq/looPkv67mlLnmqKHlnovot6/lvoTjgIFHUFXjgIFwcm9maWxlIOWSjOWGheWtmOmihOeul+OAgg0Kc2VydmVyOg0KICBubm9kZXM6IDENCiAgbnVtX2VuZ2luZXM6IDENCiAgbnVtX3ByZWZpbGxfZW5naW5lczogMA0KICBudW1fZGVjb2RlX2VuZ2luZXM6IDANCiAgdGVuc29yX3BhcmFsbGVsX3NpemU6IDENCiAgd29ya2VyX251bV9jcHVzOiA0DQogIGNwdV9udW1fc2xhYnM6IDgNCiAgY3B1X3NsYWJfc2l6ZV9ieXRlczogMTA3Mzc0MTgyNA0KICBtb2RlbF9jYWNoZV9zaXplX2diOiAyMA0KICBtZW1vcnlfdXRpbGl6YXRpb246IDAuNzc1DQogIGR1bW15X3dlaWdodHM6IGZhbHNlDQogIHN0YXJ0dXBfbW9kZWxzOg0KICAtIFF3ZW4vUXdlbjMtNEINCiAgbW9kZWxfcGxhY2VtZW50X3BvbGljeTogbGVhc3QtbG9hZGVkDQogIHJlcXVlc3Rfcm91dGluZ19wb2xpY3k6IGxlYXN0LW91dHN0YW5kaW5nDQogIGN1ZGFfZ3JhcGg6DQogICAgbW9kZTogJ29mZicNCm1vZGVsczoNCi0gbmFtZTogUXdlbi9Rd2VuMy00Qg0KICBwYXRoOiAvc3J2L21vZGVscy9Rd2VuMy00Qg0KICBwcm9maWxlOiBRd2VuL1F3ZW4zLTRCDQogIG1heF9tb2RlbF9sZW46IDQwOTYNCmRldmljZXM6DQotIG5hbWU6IEExMDBfNDBHQg0KICBtZW1vcnk6IDM5DQogIGJhbmR3aWR0aDogMzINCiAgcHJvZmlsZTogQTEwMC1QQ0lFLTQwR0INCg==\" download=\"simple.yaml\">Simple 模式配置\u003c/a>，模型路径和性能 profile 需匹配本机环境。相对的 \u003ccode>config_path\u003c/code> 假定工作目录为仓库根目录；通过 wheel 安装的应用可使用自有配置副本的绝对路径。Ray 运行时需已具备\u003ca href=\"#/zh/deployment\">部署说明\u003c/a>中的 \u003ccode>node_0\u003c/code> 资源。\u003c/p>\n\u003ch2 id=\"示例\">示例\u003ca class=\"headerlink\" href=\"#/zh/python-api#示例\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">os\u003c/span>\n\u003cspan class=\"kn\">import\u00 p\">())\u003c/span>\n\n\u003cspan class=\"n\">service\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">LLMService\u003c/span>\u003cspan class=\"p\">([\u003c/span>\n    \u003cspan class=\"n\">NodeConfig\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n        \u003cspan class=\"n\">node_id\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s1\">'node_0'\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">num_prefill_engines\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">num_decode_engines\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">num_engines\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">tensor_parallel_size\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">cpu_num_slabs\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">8\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">cpu_slab_size_bytes\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">1024\u003c/span>\u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">model_cache_size\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">20\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"mi\">1024\u003c/span>\u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">cached_models\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">spec\u003c/span>\u003cspan class=\"p\">],\u003c/span>\n        \u003cspan class=\"n\">config_path\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">config_path\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"p\">])\u003c/span>\n\u003cspan class=\"n\">request\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">Request\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n    \u003cspan class=\"n\">model\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">spec\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">arrival_time\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"p\">(),\u003c/span>\n    \u003cspan class=\"n\">request_id\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">prompt_token_ids\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">tokenizer\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">encode\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s1\">'KV Cache is'\u003c/span>\u003cspan class=\"p\">),\u003c/span>\n    \u003cspan class=\"n\">decode_tokens\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">16\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">eos_token_ids\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">model_config\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">eos_token_ids\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">max_model_len\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">model_config\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">max_model_len\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"k\">try\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">outputs\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">service\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">serve\u003c/span>\u003cspan class=\"p\">([\u003c/span>\u003cspan class=\"n\">request\u003c/span>\u003cspan class=\"p\">])\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"nb\">isinstance\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">outputs\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">],\u003c/span> \u003cspan class=\"ne\">BaseException\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"k\">raise\u003c/span> \u003cspan class=\"n\">outputs\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n    \u003cspan class=\"n\">token_ids\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">step\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">new_token_id\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">step\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">outputs\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">]]\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">tokenizer\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">decode\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">token_ids\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">skip_special_tokens\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003cspan class=\"k\">finally\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">ray\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">shutdown\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch2 id=\"接口\">接口\u003ca class=\"headerlink\" href=\"#/zh/python-api#接口\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>NodeConfig\u003c/code> 配置节点的 Engine、缓存和模型，内存大小以字节计。\u003c/li>\n\u003cli>\u003ccode>Request\u003c/code> 提供输入 token ID、输出长度、EOS 和上下文限制；Chat 消息先应用聊天模板。\u003c/li>\n\u003cli>\u003ccode>LLMService.serve()\u003c/code> 按输入顺序为每个请求返回一个 \u003ccode>StepOutput\u003c/code> 列表或异常对象。它运行自己的事件循环，调用方使用同步代码。\u003c/li>\n\u003cli>\u003ccode>deploy_model_replicas()\u003c/code> 和 \u003ccode>undeploy_model_replicas()\u003c/code> 异步管理副本。\u003c/li>\n\u003c/ul>\n\u003cp>聊天格式、流式输出和响应 schema 可直接使用 \u003ca href=\"#/zh/api\">HTTP API\u003c/a>。\u003c/p>",

          "text": "Python API ¶ LLMService 、 NodeConfig 和 Request 提供直接传入 token ID 的推理接口。YAML 文件提供模型和设备元数据； NodeConfig 定义各节点的 Engine、缓存和初始缓存模型。 示例使用 Simple 模式配置 ，模型路径和性能 profile 需匹配本机环境。相对的 config_path 假定工作目录为仓库根目录；通过 wheel 安装的应用可使用自有配置副本的绝对路径。Ray 运行时需已具备 部署说明 中的 node_0 资源。 示例 ¶ import os import time import ray from aegaeon import LLMService , NodeConfig , Request from aegaeon.config import get_model_config from aegaeon.models import set_model_registry from aegaeon.model_registry import get_registry from aegaeon.utils import get_tokenizer config_path = os . path . abspath ( 'docs/zh/examples/simple.yaml' ) os . environ [ 'AEGAEON_CONFIG_PATH' ] = config_path set_model_registry ( config_path ) ray . init ( address = '127.0.0.1:6789' ) spec = get_registry () . get_by_name ( 'Qwen/Qwen3-4B' ) assert spec is not None model_config = get_model_config ( spec ) tokenizer = get_tokenizer ( spec . path ()) service = LLMService ([ NodeConfig ( node_id = 'node_0' , num_prefill_engines = 0 , num_decode_engines = 0 , num_engines = 1 , tensor_parallel_size = 1 , cpu_num_slabs = 8 , cpu_slab_size_bytes = 1024 ** 3 , model_cache_size = 20 * 1024 ** 3 , cached_models = [ spec ], config_path = config_path , ) ]) request = Request ( model = spec , arrival_time = time . time (), request_id = 0 , prompt_token_ids = tokenizer . encode ( 'KV Cache is' ), decode_tokens = 16 , eos_token_ids = model_config . eos_token_ids , max_model_len = model_config . max_model_len , ) try : outputs = service . serve ([ request ]) if isinstance ( outputs [ 0 ], BaseException ): raise outputs [ 0 ] token_ids = [ step . new_token_id for step in outputs [ 0 ]] print ( tokenizer . decode ( token_ids , skip_special_tokens = True )) finally : ray . shutdown () 接口 ¶ NodeConfig 配置节点的 Engine、缓存和模型，内存大小以字节计。 Request 提供输入 token ID、输出长度、EOS 和上下文限制；Chat 消息先应用聊天模板。 LLMService.serve() 按输入顺序为每个请求返回一个 StepOutput 列表或异常对象。它运行自己的事件循环，调用方使用同步代码。 deploy_model_replicas() 和 undeploy_model_replicas() 异步管理副本。 聊天格式、流式输出和响应 schema 可直接使用 HTTP API 。"
        },

          "html": "\u003ch1 id=\"配置参考\">配置参考\u003ca class=\"headerlink\" href=\"#/zh/configuration#配置参考\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>YAML 包含三部分：\u003ccode>server\u003c/code> 定义 Engine 拓扑和内存预算，\u003ccode>models\u003c/code> 注册模型路径和性能 profile，\u003ccode>devices\u003c/code> 描述 GPU 容量与带宽。监听地址、端口和 Ray 地址通过 CLI 传入。完整配置见\u003ca href=\"#/zh/examples\">示例\u003c/a>。\u003c/p>\n\u003ch2 id=\"文件系统路径\">文件系统路径\u003ca class=\"headerlink\" href=\"#/zh/configuration#文件系统路径\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>示例和部分随附工具默认采用 \u003ccode>/srv\u003c/code> 目录布局：\u003ccode>/srv/models\u003c/code> 存放模型权重，\u003ccode>/srv/aegaeon-archives\u003c/code> 存放 CUDA Graph 存档，\u003ccode>/srv/datasets\u003c/code> 存放数据集。\u003c/p>\n\u003cp>运行示例前，请将路径替换为本机实际使用的绝对路径。将各个 \u003ccode>models[].path\u003c/code> 设为对应的 checkpoint 目录；使用 CUDA Graph save/load 时，将 \u003ccode>server.cuda_graph.archive_dir\u003c/code> 设为所需的存档位置。对于工具，优先使用其路径参数或文档说明的环境变量；若未提供这些选项，则修改工具中的默认路径。确保服务能够读取输入并写入输出。多节点部署时，所有使用这些路径的节点都必须能够访问相应文件。\u003ca href=\"#/zh/quickstart\">快速开始\u003c/a>演示了如何替换配置中的路径。\u003c/p>\n\u003ch2 id=\"serverconfig-默认值\">ServerConfig 默认值\u003ca class=\"headerlink\" href=\"#/zh/configuration#serverconfig-默认值\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth style=\"text-align: right;\">默认值\u003c/th>\n\u003cth>含义 / 注意事项\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>cpu_num_slabs\u003c/td>\n\u003ctd style=\"text-align: right;\">128\u003c/td>\n\u003ctd>每节点 CPU KV slab 数量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cpu_slab_size_bytes\u003c/td>\n\u003ctd style=\"text-align: right;\">1073741824\u003c/td>\n\u003ctd>每 slab 1 GiB，单位 bytes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>memory_utilization\u003c/td>\n\u003ctd style=\"text-align: right;\">0.775\u003c/td>\n\u003ctd>显存容量估算比例；CUDA allocator 另行管理实际分配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>worker_num_cpus\u003c/td>\n\u003ctd style=\"text-align: right;\">16\u003c/td>\n\u003ctd>每 Worker Ray CPU 资源请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>nnodes\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>物理 Ray 节点数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>num_prefill_engines\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>每节点 Prefill Engine 数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>num_decode_engines\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>每节点 Decode Engine 数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>num_engines\u003c/td>\n\u003ctd style=\"text-align: right;\">0\u003c/td>\n\u003ctd>每节点 Simple Engine 数；与 P/D 引擎互斥\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tensor_parallel_size\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>每 Engine 一个 Worker；当前只支持值 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>model_cache_size_gb\u003c/td>\n\u003ctd style=\"text-align: right;\">0\u003c/td>\n\u003ctd>CPU 权重缓存 GiB；0 进入自动估算路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>dummy_weights\u003c/td>\n\u003ctd style=\"text-align: right;\">false\u003c/td>\n\u003ctd>测试占位权重；仅用于控制路径测试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decode_work_stealing\u003c/td>\n\u003ctd style=\"text-align: right;\">false\u003c/td>\n\u003ctd>节点内 Decode 批次转移\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decode_work_stealing_min_batch_gap\u003c/td>\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003ctd>donor/receiver 批次数差阈值，至少 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>model_placement_policy\u003c/td>\n\u003ctd style=\"text-align: right;\">least-loaded\u003c/td>\n\u003ctd>或 round-robin\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>request_routing_policy\u003c/td>\n\u003ctd style=\"text-align: right;\">least-outstanding\u003c/td>\n\u003ctd>或 round-robin\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>startup_models\u003c/td>\n\u003ctd style=\"text-align: right;\">null\u003c/td>\n\u003ctd>null=全部；[]=空服务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cuda_graph\u003c/td>\n\u003ctd style=\"text-align: right;\">CudaGraphConfig()\u003c/td>\n\u003ctd>默认关闭；详见下表\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>CPU KV 默认每节点 128 GiB，slab 和权重缓存需匹配可用主机内存。Simple 模式使用 \u003ccode>num_engines &gt; 0\u003c/code>，Prefill 与 Decode Engine 数量均为 0；P/D 模式使用 \u003ccode>num_engines: 0\u003c/code>，两个阶段至少各有一个 Engine。\u003c/p>\n\u003cp>\u003ccode>startup_models: null\u003c/code> 加载所有配置模型，\u003ccode>[]\u003c/code> 启动空服务，列表选择指定模型。CLI 的 \u003ccode>--models\u003c/code> 优先。\u003c/p>\n\u003ch2 id=\"models-条目\">models 条目\u003ca class=\"headerlink\" href=\"#/zh/configuration#models-条目\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>默认\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>name\u003c/td>\n\u003ctd>必填\u003c/td>\n\u003ctd>对外模型名字；profile 文件夹可使用独立名称\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>path\u003c/td>\n\u003ctd>空字符串\u003c/td>\n\u003ctd>本地权重目录；省略时 \u003ccode>ModelSpec.path()\u003c/code> 触发下载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>params\u003c/td>\n\u003ctd>null\u003c/td>\n\u003ctd>输入数字乘以 2^30 得到参数量；null 表示从本地权重元数据推断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>profile\u003c/td>\n\u003ctd>空字符串\u003c/td>\n\u003ctd>性能目录别名；省略时由模型名称最后一段规范化生成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>max_model_len\u003c/td>\n\u003ctd>null\u003c/td>\n\u003ctd>覆盖上下文总长度；仍受模型能力限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>id\u003c/td>\n\u003ctd>省略\u003c/td>\n\u003ctd>所有模型都省略时按顺序生成；显式设置时为每个模型都填写 ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tool_parser\u003c/td>\n\u003ctd>null\u003c/td>\n\u003ctd>支持的 vLLM 工具解析器名称；覆盖根据模型名称或路径选择的解析器\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"devices-条目\">devices 条目\u003ca class=\"headerlink\" href=\"#/zh/configuration#devices-条目\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>name\u003c/td>\n\u003ctd>必填，设备逻辑名；应与检测/别名匹配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>memory\u003c/td>\n\u003ctd>必填，乘以 2^30 得到容量 bytes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>bandwidth\u003c/td>\n\u003ctd>可选，乘以 2^30 得到 bytes/s；省略会尝试 NVML 检测\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>profile\u003c/td>\n\u003ctd>通过 DeviceSpec.extra 保存，指定性能目录别名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>其他字段\u003c/td>\n\u003ctd>保存到 DeviceSpec.extra；只有实现中显式读取的字段才会生效\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"cuda_graph-默认与约束\">cuda_graph 默认与约束\u003ca class=\"headerlink\" href=\"#/zh/configuration#cuda_graph-默认与约束\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>配置类默认值\u003c/th>\n\u003cth>约束\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>mode\u003c/td>\n\u003ctd>'off'\u003c/td>\n\u003ctd>'off' / save / load；各取值均使用引号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>archive_dir\u003c/td>\n\u003ctd>''\u003c/td>\n\u003ctd>save/load 必填\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>batch_sizes\u003c/td>\n\u003ctd>[1,2,4,8]\u003c/td>\n\u003ctd>正整数、非空；会排序去重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>seq_len_buckets\u003c/td>\n\u003ctd>[128,256,512,1024,2048]\u003c/td>\n\u003ctd>配置类接受多个；\u003cstrong>当前 Worker save/load 必须只填一个最大长度桶\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>strict\u003c/td>\n\u003ctd>true\u003c/td>\n\u003ctd>控制初始化 scratch 等严格检查；ABI/layout/binding 校验始终执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>base_address\u003c/td>\n\u003ctd>0x400000000000\u003c/td>\n\u003ctd>正整数、2 MiB 对齐；可写带引号十六进制字符串\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>region_size_bytes\u003c/td>\n\u003ctd>274877906944\u003c/td>\n\u003ctd>256 GiB 虚拟地址范围；正整数、2 MiB 对齐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>scratch_size_bytes\u003c/td>\n\u003ctd>4294967296\u003c/td>\n\u003ctd>4 GiB；正整数、2 MiB 对齐，且小于 region_size_bytes\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>CUDA Graph save/load 默认关闭；\u003ccode>mode\u003c/code> 为 \u003ccode>'save'\u003c/code> 或 \u003ccode>'load'\u003c/code> 时，在 P/D Decode Worker 上运行。详见 \u003ca href=\"#/zh/cuda-graphs\">CUDA Graph\u003c/a>。\u003c/p>",

          "text": "配置参考 ¶ YAML 包含三部分： server 定义 Engine 拓扑和内存预算， models 注册模型路径和性能 profile， devices 描述 GPU 容量与带宽。监听地址、端口和 Ray 地址通过 CLI 传入。完整配置见 示例 。 文件系统路径 ¶ 示例和部分随附工具默认采用 /srv 目录布局： /srv/models 存放模型权重， /srv/aegaeon-archives 存放 CUDA Graph 存档， /srv/datasets 存放数据集。 运行示例前，请将路径替换为本机实际使用的绝对路径。将各个 models[].path 设为对应的 checkpoint 目录；使用 CUDA Graph save/load 时，将 server.cuda_graph.archive_dir 设为所需的存档位置。对于工具，优先使用其路径参数或文档说明的环境变量；若未提供这些选项，则修改工具中的默认路径。确保服务能够读取输入并写入输出。多节点部署时，所有使用这些路径的节点都必须能够访问相应文件。 快速开始 演示了如何替换配置中的路径。 ServerConfig 默认值 ¶ 字段 默认值 含义 / 注意事项 cpu_num_slabs 128 每节点 CPU KV slab 数量 cpu_slab_size_bytes 1073741824 每 slab 1 GiB，单位 bytes memory_utilization 0.775 显存容量估算比例；CUDA allocator 另行管理实际分配 worker_num_cpus 16 每 Worker Ray CPU 资源请求 nnodes 1 物理 Ray 节点数 num_prefill_engines 1 每节点 Prefill Engine 数 num_decode_engines 1 每节点 Decode Engine 数 num_engines 0 每节点 Simple Engine 数；与 P/D 引擎互斥 tensor_parallel_size 1 每 Engine 一个 Worker；当前只支持值 1 model_cache_size_gb 0 CPU 权重缓存 GiB；0 进入自动估算路径 dummy_weights false 测试占位权重；仅用于控制路径测试 decode_work_stealing false 节点内 Decode 批次转移 decode_work_stealing_min_batch_gap 2 donor/receiver 批次数差阈值，至少 2 model_placement_policy least-loaded 或 round-robin request_routing_policy least-outstanding 或 round-robin startup_models null null=全部；[]=空服务 cuda_graph CudaGraphConfig() 默认关闭；详见下表 CPU KV 默认每节点 128 GiB，slab 和权重缓存需匹配可用主机内存。Simple 模式使用 num_engines > 0 ，Prefill 与 Decode Engine 数量均为 0；P/D 模式使用 num_engines: 0 ，两个阶段至少各有一个 Engine。 startup_models: null 加载所有配置模型， [] 启动空服务，列表选择指定模型。CLI 的 --models 优先。 models 条目 ¶ 字段 默认 说明 name 必填 对外模型名字；profile 文件夹可使用独立名称 path 空字符串 本地权重目录；省略时 ModelSpec.path() 触发下载 params null 输入数字乘以 2^30 得到参数量；null 表示从本地权重元数据推断 profile 空字符串 性能目录别名；省略时由模型名称最后一段规范化生成 max_model_len null 覆盖上下文总长度；仍受模型能力限制 id 省略 所有模型都省略时按顺序生成；显式设置时为每个模型都填写 ID tool_parser null 支持的 vLLM 工具解析器名称；覆盖根据模型名称或路径选择的解析器 devices 条目 ¶ 字段 说明 name 必填，设备逻辑名；应与检测/别名匹配 memory 必填，乘以 2^30 得到容量 bytes bandwidth 可选，乘以 2^30 得到 bytes/s；省略会尝试 NVML 检测 profile 通过 DeviceSpec.extra 保存，指定性能目录别名 其他字段 保存到 DeviceSpec.extra；只有实现中显式读取的字段才会生效 cuda_graph 默认与约束 ¶ 字段 配置类默认值 约束 mode 'off' 'off' / save / load；各取值均使用引号 archive_dir '' save/load 必填 batch_sizes [1,2,4,8] 正整数、非空；会排序去重 seq_len_buckets [128,256,512,1024,2048] 配置类接受多个； 当前 Worker save/load 必须只填一个最大长度桶 strict true 控制初始化 scratch 等严格检查；ABI/layout/binding 校验始终执行 base_address 0x400000000000 正整数、2 MiB 对齐；可写带引号十六进制字符串 region_size_bytes 274877906944 256 GiB 虚拟地址范围；正整数、2 MiB 对齐 scratch_size_bytes 4294967296 4 GiB；正整数、2 MiB 对齐，且小于 region_size_bytes CUDA Graph save/load 默认关闭； mode 为 'save' 或 'load' 时，在 P/D Decode Worker 上运行。详见 CUDA Graph 。"
        },
        "environment": {
          "id": "environment",
          "label": "环境变量",
          "group": "group-4",
          "html": "\u003ch1 id=\"环境变量\">环境变量\u003ca class=\"headerlink\" href=\"#/zh/environment#环境变量\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>环境变量配置进程级默认值和动态库路径。变量在启动或模块导入时读取，修改后重启生效。Worker 使用的设置也需要在对应 Ray 节点上可用。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变量\u003c/th>\n\u003cth>默认值\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_WEB_DIR\u003c/code>\u003c/td>\n\u003ctd>未设置\u003c/td>\n\u003ctd>可选的外部 UI 资源目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_LOG_FILE\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>output.log\u003c/code>\u003c/td>\n\u003ctd>服务日志路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_TTFT_SLO\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>10\u003c/code>\u003c/td>\n\u003ctd>TTFT 目标，秒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_TPOT_SLO\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0.1\u003c/code>\u003c/td>\n\u003ctd>TPOT 目标，秒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_DEFAULT_MODEL_REPO\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>modelscope\u003c/code>\u003c/td>\n\u003ctd>模型来源：modelscope 或 huggingface\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_PROFILE_ROOT\u003c/code>\u003c/td>\n\u003ctd>内置 profile，其次为仓库 \u003ccode>profiles/\u003c/code>\u003c/td>\n\u003ctd>模型与设备的性能 profile\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_SHM_DIR\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>/dev/shm\u003c/code>\u003c/td>\n\u003ctd>共享内存缓存目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_RAY_ADDRESS\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>RAY_ADDRESS\u003c/code> / \u003ccode>auto\u003c/code>\u003c/td>\n\u003ctd>Ray 集群地址，CLI 优先\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_RAY_TEMP_DIR\u003c/code>\u003c/td>\n\u003ctd>未设置\u003c/td>\n\u003ctd>本地 Ray 临时目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_ARENA_FRACTION\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0.875\u003c/code>\u003c/td>\n\u003ctd>QuickLoader GPU arena 比例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>CUDA_VISIBLE_DEVICES\u003c/code>\u003c/td>\n\u003ctd>进程环境\u003c/td>\n\u003ctd>可见 GPU 集合\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_MAX_REQUESTS_PER_SECOND\u003c/code>\u003c/td>\n\u003ctd>未设置\u003c/td>\n\u003ctd>每模型请求数/秒，按 60 秒平均，包含待接入的当前请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_MAX_TOKENS_PER_SECOND\u003c/code>\u003c/td>\n\u003ctd>未设置\u003c/td>\n\u003ctd>每模型已生成 token 数/秒，按 60 秒平均，在请求接入时检查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_FOUNDRY_HOOK_PATH\u003c/code>\u003c/td>\n\u003ctd>未设置\u003c/td>\n\u003ctd>\u003ccode>libcuda_hook.so\u003c/code> 绝对路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AEGAEON_CUDA_COMPAT_PATH\u003c/code>\u003c/td>\n\u003ctd>自动查找\u003c/td>\n\u003ctd>CUDA compatibility 动态库目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LD_LIBRARY_PATH\u003c/code>\u003c/td>\n\u003ctd>进程环境\u003c/td>\n\u003ctd>动态库搜索路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>HTTP_PROXY\u003c/code>、\u003ccode>HTTPS_PROXY\u003c/code>、\u003ccode>NO_PROXY\u003c/code>\u003c/td>\n\u003ctd>进程环境\u003c/td>\n\u003ctd>下载与网络代理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>图设置使用 \u003ca href=\"#/zh/configuration\">YAML 配置\u003c/a>，启动命令见 \u003ca href=\"#/zh/cli\">CLI 参考\u003c/a>。\u003c/p>",
          "headings": [],
          "text": "环境变量 ¶ 环境变量配置进程级默认值和动态库路径。变量在启动或模块导入时读取，修改后重启生效。Worker 使用的设置也需要在对应 Ray 节点上可用。 变量 默认值 用途 AEGAEON_WEB_DIR 未设置 可选的外部 UI 资源目录 AEGAEON_LOG_FILE output.log 服务日志路径 AEGAEON_TTFT_SLO 10 TTFT 目标，秒 AEGAEON_TPOT_SLO 0.1 TPOT 目标，秒 AEGAEON_DEFAULT_MODEL_REPO modelscope 模型来源：modelscope 或 huggingface AEGAEON_PROFILE_ROOT 内置 profile，其次为仓库 profiles/ 模型与设备的性能 profile AEGAEON_SHM_DIR /dev/shm 共享内存缓存目录 AEGAEON_RAY_ADDRESS RAY_ADDRESS / auto Ray 集群地址，CLI 优先 AEGAEON_RAY_TEMP_DIR 未设置 本地 Ray 临时目录 AEGAEON_ARENA_FRACTION 0.875 QuickLoader GPU arena 比例 CUDA_VISIBLE_DEVICES 进程环境 可见 GPU 集合 AEGAEON_MAX_REQUESTS_PER_SECOND 未设置 每模型请求数/秒，按 60 秒平均，包含待接入的当前请求 AEGAEON_MAX_TOKENS_PER_SECOND 未设置 每模型已生成 token 数/秒，按 60 秒平均，在请求接入时检查 AEGAEON_FOUNDRY_HOOK_PATH 未设置 libcuda_hook.so 绝对路径 AEGAEON_CUDA_COMPAT_PATH 自动查找 CUDA compatibility 动态库目录 LD_LIBRARY_PATH 进程环境 动态库搜索路径 HTTP_PROXY 、 HTTPS_PROXY 、 NO_PROXY 进程环境 下载与网络代理 图设置使用 YAML 配置 ，启动命令见 CLI 参考 。"
        },
        "cli": {
          "id": "cli",
          "label": "命令行接口",
          "group": "group-5",
          "html": "\u003ch1 id=\"cli-参考\">CLI 参考\u003ca class=\"headerlink\" href=\"#/zh/cli#cli-参考\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cp>使用 \u003ccode>aegaeon\u003c/code> 或 \u003ccode>python -m aegaeon\u003c/code>。\u003c/p>\n\u003ch2 id=\"doctor\">doctor\u003ca class=\"headerlink\" href=\"#/zh/cli#doctor\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>doctor\u003c/code> 检查当前 Python 环境和本机运行条件。提供配置文件后，还会检查模型路径、性能 profile、拓扑和内存预算。\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>doctor\n\u003cspan class=\"nv\">CUDA_VISIBLE_DEVICES\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"m\">0\u003c/span>\u003cspan class=\"w\"> \u003c/span>aegaeon\u003cspan class=\"w\"> \u003c/span>doctor\u003cspan class=\"w\"> \u003c/span>--check-cuda\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>解析器默认值\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>--config\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>用于本地模型、性能 profile、拓扑和内存检查的 YAML 文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--models\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>逗号分隔的启动模型列表；需要 --config\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--tensor-parallel-size\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>非零值覆盖 YAML，0 沿用 YAML；需要 --config，最终值必须为 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--strict\u003c/td>\n\u003ctd>false\u003c/td>\n\u003ctd>警告和失败均返回非零退出码\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--check-cuda\u003c/td>\n\u003ctd>false\u003c/td>\n\u003ctd>执行小型 PyTorch/CuPy CUDA 运算，导入 vLLM 原生扩展，检查可见 GPU，并测试单页主机内存注册\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"start\">start\u003ca class=\"headerlink\" href=\"#/zh/cli#start\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--config\u003cspan class=\"w\"> \u003c/span>/srv/aegaeon/config.yaml\u003cspan class=\"w\"> \u003c/span>--host\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">127\u003c/span>.0.0.1\u003cspan class=\"w\"> \u003c/span>--port\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">8000\u003c/span>\u003cspan class=\"w\"> \u003c/span>--ray-address\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">127\u003c/span>.0.0.1:6789\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>解析器默认值\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>--config\u003c/td>\n\u003ctd>必填\u003c/td>\n\u003ctd>YAML 文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--host\u003c/td>\n\u003ctd>0.0.0.0\u003c/td>\n\u003ctd>监听地址\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--port\u003c/td>\n\u003ctd>8000\u003c/td>\n\u003ctd>监听端口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--models\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>逗号分隔的启动模型列表；覆盖 startup_models；空字符串表示启动时不加载模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--num-prefill-engines\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>正常路径以 YAML ServerConfig 为准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--num-decode-engines\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--num-engines\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--tensor-parallel-size\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>显式非零值覆盖 YAML；0 沿用 YAML\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--model-cache-size-gb\u003c/td>\n\u003ctd>20\u003c/td>\n\u003ctd>CPU 权重缓存容量回退值，单位 GiB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--cpu-num-slabs\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>slab 数量回退值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--cpu-slab-size-gb\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>slab 大小回退值，单位 GiB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--ray-address\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>指定集群，优先于环境变量\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>拓扑和内存预算在 \u003ca href=\"#/zh/configuration\">YAML 配置\u003c/a>中设置。\u003c/p>\n\u003ch2 id=\"deploy\">deploy\u003ca class=\"headerlink\" href=\"#/zh/cli#deploy\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>deploy\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--path\u003cspan class=\"w\"> \u003c/span>/srv/models/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--replicas\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">2\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>默认值\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>model\u003c/td>\n\u003ctd>位置参数，必填\u003c/td>\n\u003ctd>服务中的模型名字\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--path\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>本地权重目录；未指定时先查注册配置，再尝试下载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--host\u003c/td>\n\u003ctd>localhost\u003c/td>\n\u003ctd>API 服务主机\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--port\u003c/td>\n\u003ctd>8000\u003c/td>\n\u003ctd>API 端口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--max-model-len\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>覆盖上下文长度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--replicas\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>自动部署时的最小 READY 副本数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--nodes\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>显式节点 ID；绕过自动放置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--tool-parser\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>为该模型别名覆盖工具解析器，取值须为支持的 vLLM 解析器\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>部分成功时返回非零退出码，见\u003ca href=\"#/zh/model-management\">模型管理\u003c/a>。\u003c/p>\n\u003ch2 id=\"undeploy\">undeploy\u003ca class=\"headerlink\" href=\"#/zh/cli#undeploy\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>undeploy\u003cspan class=\"w\"> \u003c/span>Qwen/Qwen3-4B\u003cspan class=\"w\"> \u003c/span>--nodes\u003cspan class=\"w\"> \u003c/span>node_1\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>默认值\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>model\u003c/td>\n\u003ctd>必填位置参数\u003c/td>\n\u003ctd>服务中的模型名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--host\u003c/td>\n\u003ctd>localhost\u003c/td>\n\u003ctd>API 主机\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--port\u003c/td>\n\u003ctd>8000\u003c/td>\n\u003ctd>API 端口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>--nodes\u003c/td>\n\u003ctd>全部已知副本\u003c/td>\n\u003ctd>只卸载列出的节点\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"查询\">查询\u003ca class=\"headerlink\" href=\"#/zh/cli#查询\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cp>各命令的帮助列出参数及解析器默认值。\u003c/p>\n\u003cdiv class=\"highlight\">\u003cpre>\u003cspan>\u003c/span>\u003ccode>aegaeon\u003cspan class=\"w\"> \u003c/span>--help\naegaeon\u003cspan class=\"w\"> \u003c/span>doctor\u003cspan class=\"w\"> \u003c/span>--help\naegaeon\u003cspan class=\"w\"> \u003c/span>start\u003cspan class=\"w\"> \u003c/span>--help\naegaeon\u003cspan class=\"w\"> \u003c/span>deploy\u003cspan class=\"w\"> \u003c/span>--help\naegaeon\u003cspan class=\"w\"> \u003c/span>undeploy\u003cspan class=\"w\"> \u003c/span>--help\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>启动资源以 YAML 字段及其默认值为准，优先于旧的资源回退选项。\u003ccode>--models\u003c/code> 和非零 \u003ccode>--tensor-parallel-size\u003c/code> 覆盖对应 YAML 字段；Ray 地址依次取 \u003ccode>--ray-address\u003c/code>、\u003ccode>AEGAEON_RAY_ADDRESS\u003c/code>、\u003ccode>RAY_ADDRESS\u003c/code>、\u003ccode>auto\u003c/code>。\u003c/p>",

          "text": "CLI 参考 ¶ 使用 aegaeon 或 python -m aegaeon 。 doctor ¶ doctor 检查当前 Python 环境和本机运行条件。提供配置文件后，还会检查模型路径、性能 profile、拓扑和内存预算。 aegaeon doctor CUDA_VISIBLE_DEVICES = 0 aegaeon doctor --check-cuda 参数 解析器默认值 说明 --config None 用于本地模型、性能 profile、拓扑和内存检查的 YAML 文件 --models None 逗号分隔的启动模型列表；需要 --config --tensor-parallel-size None 非零值覆盖 YAML，0 沿用 YAML；需要 --config，最终值必须为 1 --strict false 警告和失败均返回非零退出码 --check-cuda false 执行小型 PyTorch/CuPy CUDA 运算，导入 vLLM 原生扩展，检查可见 GPU，并测试单页主机内存注册 start ¶ aegaeon start --config /srv/aegaeon/config.yaml --host 127 .0.0.1 --port 8000 --ray-address 127 .0.0.1:6789 参数 解析器默认值 说明 --config 必填 YAML 文件 --host 0.0.0.0 监听地址 --port 8000 监听端口 --models None 逗号分隔的启动模型列表；覆盖 startup_models；空字符串表示启动时不加载模型 --num-prefill-engines 1 正常路径以 YAML ServerConfig 为准 --num-decode-engines 1 同上 --num-engines 0 同上 --tensor-parallel-size None 显式非零值覆盖 YAML；0 沿用 YAML --model-cache-size-gb 20 CPU 权重缓存容量回退值，单位 GiB --cpu-num-slabs 15 slab 数量回退值 --cpu-slab-size-gb 1 slab 大小回退值，单位 GiB --ray-address None 指定集群，优先于环境变量 拓扑和内存预算在 YAML 配置 中设置。 deploy ¶ aegaeon deploy Qwen/Qwen3-4B --path /srv/models/Qwen3-4B --replicas 2 参数 默认值 说明 model 位置参数，必填 服务中的模型名字 --path None 本地权重目录；未指定时先查注册配置，再尝试下载 --host localhost API 服务主机 --port 8000 API 端口 --max-model-len None 覆盖上下文长度 --replicas 1 自动部署时的最小 READY 副本数 --nodes None 显式节点 ID；绕过自动放置 --tool-parser None 为该模型别名覆盖工具解析器，取值须为支持的 vLLM 解析器 部分成功时返回非零退出码，见 模型管理 。 undeploy ¶ aegaeon undeploy Qwen/Qwen3-4B --nodes node_1 参数 默认值 含义 model 必填位置参数 服务中的模型名 --host localhost API 主机 --port 8000 API 端口 --nodes 全部已知副本 只卸载列出的节点 查询 ¶ 各命令的帮助列出参数及解析器默认值。 aegaeon --help aegaeon doctor --help aegaeon start --help aegaeon deploy --help aegaeon undeploy --help 启动资源以 YAML 字段及其默认值为准，优先于旧的资源回退选项。 --models 和非零 --tensor-parallel-size 覆盖对应 YAML 字段；Ray 地址依次取 --ray-address 、 AEGAEON_RAY_ADDRESS 、 RAY_ADDRESS 、 auto 。"
        }
      },

        "index": {
          "id": "index",
          "label": "Home",
          "group": "group-0",
          "html": "\u003ch1 id=\"welcome-to-aegaeon\">Welcome to Aegaeon\u003ca class=\"headerlink\" href=\"#/en/index#welcome-to-aegaeon\" title=\"Permanent link\">¶\u003c/a>\u003c/h1>\n\u003cdiv class=\"home-hero\">\n\u003cdiv class=\"hero-wordmark\">\u003csvg viewBox=\"0 0 72 80\" aria-hidden=\"true\">\u003cpath d=\"M36 3 69 71H54L36 33 18 71H3Z\" fill=\"#5368d6\"/>\u003cpath d=\"M27 56h18l7 15H20Z\" fill=\"#91a1ef\"/>\u003cpath d=\"M36 3 45 22 36 33 27 22Z\" fill=\"#bdc8ff\"/>\u003c/svg>\u003cspan>Aegaeon\u003c/span>\u003c/div>\n\u003cp class=\"hero-tagline\">Efficient Model-as-a-Service, powered by token-level autoscaling.\u003c/p>\n\u003cdiv class=\"hero-actions\">\u003ca class=\"primary-action\" href=\"#/en/quickstart\">Get Started \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003ca class=\"secondary-action\" href=\"#/en/architecture\">Architecture \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\n\u003c/div>\n\n\u003cp>Aegaeon is a blazingly fast inference system for deploying multiple AI models on shared GPUs, enabling Model-as-a-Service (MaaS) both in local and cloud environments.\u003c/p>\n\u003ch2 id=\"key-features\">Key Features\u003ca class=\"headerlink\" href=\"#/en/index#key-features\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Token-level autoscaling\u003c/strong> — switch models between token steps instead of waiting for whole requests to finish.\u003c/li>\n\u003cli>\u003cstrong>SLO-aware scheduling\u003c/strong> — coordinates Prefill and Decode work against TTFT and TPOT objectives.\u003c/li>\n\u003cli>\u003cstrong>Fast model switching\u003c/strong> — combines host-side weight caching, prefetching, a Rust quick loader, and explicit KV-cache movement.\u003c/li>\n\u003cli>\u003cstrong>Multi-model runtime\u003c/strong> — supports dynamic model deployment, multiple replicas, and load-aware request routing.\u003c/li>\n\u003cli>\u003cstrong>vLLM backend\u003c/strong> — inherits model and kernel support across dense, hybrid, and MoE architectures from vLLM.\u003c/li>\n\u003cli>\u003cstrong>Serving and observability\u003c/strong> — provides OpenAI-style Chat and Completion APIs, SSE streaming, and runtime state telemetry.\u003c/li>\n\u003c/ul>\n\u003cp>See our \u003ca href=\"https://doi.org/10.1145/3731569.3764815\">SOSP '25 paper\u003c/a> for more technical details.\u003c/p>\n\u003ch2 id=\"documentation\">Documentation\u003ca class=\"headerlink\" href=\"#/en/index#documentation\" title=\"Permanent link\">¶\u003c/a>\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Guide\u003c/th>\n\u003cth>Contents\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/en/quickstart\">Quickstart\u003c/a>\u003c/td>\n\u003ctd>Install, configure, and send a request\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/en/deployment\">Deployment\u003c/a>\u003c/td>\n\u003ctd>Single-node and multi-node serving\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/en/architecture\">Architecture\u003c/a>\u003c/td>\n\u003ctd>Request flow and runtime components\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/en/benchmarking\">Benchmarking\u003c/a>\u003c/td>\n\u003ctd>Metrics, profiling, and performance tools\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/en/api\">HTTP API\u003c/a>\u003c/td>\n\u003ctd>Endpoints, schemas, and responses\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/en/cli\">CLI\u003c/a>\u003c/td>\n\u003ctd>Start, deploy, and query\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>See \u003ca href=\"#/en/capabilities\">Features and Compatibility\u003c/a> for the supported configuration.\u003c/p>",
