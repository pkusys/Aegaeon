# Architecture compatibility test matrix.
#
# Each entry maps a model to a ModelScope repo id (or an already-present local
# dir). Phase 1 (smoke) only fetches config+tokenizer (~KB-MB). Phase 2 (real)
# fetches full weights; entries with `real: false` exceed the local 30GB/GPU
# budget and are smoke-only.
#
# repo: "local:/abs/path" means the weights already exist at that path.

models:
  - name: Falcon-H1-0.5B
    arch: FalconH1ForCausalLM
    repo: "tiiuae/Falcon-H1-0.5B-Instruct"
    real: true

  - name: GLM4-9B-0414
    arch: Glm4ForCausalLM
    repo: "ZhipuAI/GLM-4-9B-0414"
    real: true

  - name: mamba-130m-hf 
    arch: MambaForCausalLM
    repo: "AI-ModelScope/mamba-130m-hf"
    real: true 
  
  - name: mamba-codestral-7B
    arch: Mamba2ForCausalLM
    repo: "AI-ModelScope/mamba-codestral-7B-v0.1"
    real: true
  
  - name: Mellum2-12B
    arch: MellumForCausalLM
    repo: "JetBrains/Mellum2-12B-A2.5B-Base"
    real: true
    skip: "vLLM AutoWeightsLoader/RoutedExperts prefix mismatch leaves mlp.experts.{i}.(gate/up/down)_proj unloaded (MoE loading gap); unsupported"

  - name: Nemotron-H-8B
    arch: NemotronHForCausalLM
